    .rows {

    .row {
      display: grid;
      grid-template-columns:

    .btn.primary {

    .footer-note {

    .error {

    @media (max-width: 560px) {

  <script>
    'use strict';

    const API_URL =
      'https://78.17.112.158/api.php';

    const REQUEST_TIMEOUT_MS = 10000;
    const HASH_CHANGE_DELAY_MS = 150;
    const HISTORY_TOKEN_KEY = '__limupy_subscription_token';

    let activeToken = '';
    let deviceId = '';
    let activeLoadPromise = null;
    let hashTimer = null;

    const $ = id =>
      document.getElementById(id);

    function getUrlToken() {
      const hashParams =
        new URLSearchParams(
          window.location.hash.replace(/^#/, '')
        );

      const searchParams =
        new URLSearchParams(
          window.location.search
        );

      return (
        hashParams.get('key') ||
        searchParams.get('key') ||
        ''
      ).trim();
    }

    function getHistoryToken() {
      const state =
        window.history &&
        window.history.state;

      if (
        !state ||
        typeof state !== 'object'
      ) {
        return '';
      }

      const token =
        state[HISTORY_TOKEN_KEY];

      return typeof token === 'string'
        ? token.trim()
        : '';
    }

    function saveTokenToHistory(token) {
      if (
        !window.history ||
        typeof window.history.replaceState !== 'function'
      ) {
        return false;
      }

      const currentState =
        window.history.state &&
        typeof window.history.state === 'object'
          ? window.history.state
          : {};

      const nextState = {
        ...currentState,
        [HISTORY_TOKEN_KEY]: token
      };

      window.history.replaceState(
        nextState,
        '',
        window.location.pathname
      );

      return true;
    }

    function clearUrlKeepHistoryState() {
      if (
        !window.history ||
        typeof window.history.replaceState !== 'function'
      ) {
        return;
      }

      const currentState =
        window.history.state &&
        typeof window.history.state === 'object'
          ? window.history.state
          : null;

      window.history.replaceState(
        currentState,
        '',
        window.location.pathname
      );
    }

    function adoptToken() {
      const urlToken =
        getUrlToken();

      if (urlToken) {
        activeToken =
          urlToken;

        saveTokenToHistory(
          activeToken
        );

        return activeToken;
      }

      const historyToken =
        getHistoryToken();

      activeToken =
        historyToken;

      clearUrlKeepHistoryState();

      return activeToken;
    }

    function base64Url(bytes) {
      let binary = '';

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    function getDeviceId() {
      if (deviceId) {
        return deviceId;
      }

      const bytes =
        new Uint8Array(32);

      crypto.getRandomValues(bytes);

      deviceId =
        base64Url(bytes);

      return deviceId;
    }

    function setStatus(type, text) {
      const el = $('status');

      el.className =
        'status ' + type;

      el.textContent =
        text;
    }

    function resetFields() {
      $('subscription').textContent = '—';
      $('server').textContent = '—';
      $('devicesCount').textContent = '—';
      $('protocols').textContent = '—';
      $('traffic').textContent = '—';
      $('expire').textContent = '—';
      $('latency').textContent = '—';

      $('happConnect').hidden = true;
      $('happConnect').removeAttribute('href');
    }

    function showError(
      message,
      warning = false
    ) {
      const el =
        $('error');

      el.hidden =
        false;

      el.className =
        warning
          ? 'error warning'
          : 'error';

      el.textContent =
        message;
    }

    function hideError() {
      const el =
        $('error');

      el.hidden =
        true;

      el.textContent =
        '';

      el.className =
        'error';
    }

    function bytes(value) {
      const n =
        Number(value || 0);

      if (
        !Number.isFinite(n) ||
        n <= 0
      ) {
        return '0 Б';
      }

      const units = [
        'Б',
        'КБ',
        'МБ',
        'ГБ',
        'ТБ'
      ];

      let x = n;
      let i = 0;

      while (
        x >= 1024 &&
        i < units.length - 1
      ) {
        x /= 1024;
        i++;
      }

      const digits =
        x >= 100
          ? 0
          : x >= 10
            ? 1
            : 2;

      return `${x.toFixed(digits)} ${units[i]}`;
    }

    function trafficText(sub) {
      const total =
        Number(
          sub.total_bytes || 0
        );

      const used =
        Number(
          sub.used_bytes || 0
        );

      if (!total) {
        return `Использовано ${bytes(used)} · без лимита`;
      }

      const remaining =
        Number(
          sub.remaining_bytes ??
          Math.max(
            0,
            total - used
          )
        );

      return (
        `${bytes(used)} из ${bytes(total)} · осталось ${bytes(remaining)}`
      );
    }

    function expireText(timestamp) {
      const ts =
        Number(
          timestamp || 0
        );

      if (!ts) {
        return 'Бессрочно';
      }

      const d =
        new Date(
          ts > 1e12
            ? ts
            : ts * 1000
        );

      if (
        Number.isNaN(
          d.getTime()
        )
      ) {
        return '—';
      }

      return d.toLocaleDateString(
        'ru-RU',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }

    function isAllowedHappUrl(value) {
      try {
        const url =
          new URL(value);

        if (
          url.protocol === 'happ:'
        ) {
          return (
            url.hostname === 'add' &&
            url.pathname.startsWith(
              '/https://78.17.112.158/'
            )
          );
        }

        if (
          url.protocol === 'https:'
        ) {
          return (
            url.origin ===
              'https://78.17.112.158' &&
            url.pathname.startsWith(
              '/DisstVpn/'
            )
          );
        }

        return false;
      } catch (_) {
        return false;
      }
    }

    async function postApi() {
      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS
        );

      try {
        return await fetch(
          API_URL,
          {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            credentials: 'omit',
            redirect: 'error',
            signal: controller.signal,
            headers: {
              'Authorization':
                `Bearer ${activeToken}`,
              'Accept':
                'application/json',
              'Content-Type':
                'application/json'
            },
            body: JSON.stringify({
              device_id:
                getDeviceId()
            })
          }
        );
      } finally {
        clearTimeout(
          timeout
        );
      }
    }

    async function fetchSubscription() {
      const started =
        performance.now();

      const res =
        await postApi();

      let data =
        null;

      try {
        data =
          await res.json();
      } catch (_) {
        data =
          null;
      }

      return {
        res,
        data,
        elapsed:
          performance.now() -
          started
      };
    }

    function pluralizeDevices(count) {
      const mod10 =
        count % 10;

      const mod100 =
        count % 100;

      if (
        mod10 === 1 &&
        mod100 !== 11
      ) {
        return 'устройство';
      }

      if (
        mod10 >= 2 &&
        mod10 <= 4 &&
        (
          mod100 < 10 ||
          mod100 >= 20
        )
      ) {
        return 'устройства';
      }

      return 'устройств';
    }

    function getConnectionCount(data) {
      const direct = [
        data?.vpn_connections_count,
        data?.vpn_connected_devices_count,
        data?.connected_vpn_devices_count,
        data?.connected_devices_count,
        data?.active_devices_count,
        data?.connections_count,
        data?.online_count,
        data?.connected_count,
        data?.device_count,
        data?.devices_count,
        data?.connection_count,
        data?.subscription?.connected_devices_count,
        data?.subscription?.active_devices_count,
        data?.subscription?.connections_count,
        data?.subscription?.online_count,
        data?.device?.connected_devices_count,
        data?.device?.active_devices_count,
        data?.device?.connections_count,
        data?.device?.online_count,
        data?.connections?.count
      ];

      for (const value of direct) {
        if (
          typeof value === 'number' &&
          Number.isFinite(value) &&
          value >= 0
        ) {
          return Math.floor(
            value
          );
        }

        if (
          typeof value === 'string' &&
          value.trim() !== '' &&
          Number.isFinite(
            Number(value)
          )
        ) {
          return Math.max(
            0,
            Math.floor(
              Number(value)
            )
          );
        }
      }

      const ipSources = [
        data?.connected_ips,
        data?.connectedIPs,
        data?.vpn_ips,
        data?.online_ips,
        data?.ips,
        data?.subscription?.connected_ips,
        data?.subscription?.connectedIPs,
        data?.subscription?.vpn_ips,
        data?.subscription?.online_ips,
        data?.subscription?.ips,
        data?.connection?.ips,
        data?.connections?.ips,
        data?.device?.ips
      ];

      for (
        const value of ipSources
      ) {
        if (
          !Array.isArray(value)
        ) {
          continue;
        }

        const uniqueIps =
          new Set();

        for (
          const item of value
        ) {
          if (
            typeof item === 'string'
          ) {
            const ip =
              item.trim();

            if (ip) {
              uniqueIps.add(ip);
            }

            continue;
          }

          if (
            item &&
            typeof item === 'object'
          ) {
            const ip =
              String(
                item.ip ??
                item.address ??
                item.client_ip ??
                item.clientIp ??
                ''
              ).trim();

            if (ip) {
              uniqueIps.add(ip);
            }
          }
        }

        return uniqueIps.size;
      }

      const arrays = [
        data?.connections,
        data?.devices,
        data?.connected_devices,
        data?.connectedDevices,
        data?.vpn_devices,
        data?.sessions,
        data?.connected_clients,
        data?.online_clients,
        data?.subscription?.connections,
        data?.subscription?.connected_devices,
        data?.subscription?.sessions,
        data?.connection?.connections,
        data?.connection?.sessions,
        data?.device?.connections,
        data?.device?.sessions
      ];

      for (
        const value of arrays
      ) {
        if (
          Array.isArray(value)
        ) {
          return value.length;
        }
      }

      return null;
    }

    function renderConnections(data) {
      const count =
        getConnectionCount(
          data
        );

      const el =
        $('devicesCount');

      el.textContent =
        '';

      if (
        count === null
      ) {
        el.textContent =
          'Данные недоступны';

        return;
      }

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'connections';

      const countEl =
        document.createElement(
          'div'
        );

      countEl.className =
        'connections-count';

      countEl.textContent =
        `${count} ${pluralizeDevices(count)}`;

      wrapper.appendChild(
        countEl
      );

      if (
        count === 0
      ) {
        const stateEl =
          document.createElement(
            'div'
          );

        stateEl.className =
          'connections-state';

        stateEl.textContent =
          'сейчас нет активных подключений';

        wrapper.appendChild(
          stateEl
        );
      }

      el.appendChild(
        wrapper
      );
    }

    function renderProtocols(protocols) {
      const arr =
        Array.isArray(protocols)
          ? protocols
          : String(
              protocols || ''
            )
              .split(',')
              .map(
                s => s.trim()
              )
              .filter(Boolean);

      const el =
        $('protocols');

      el.textContent =
        '';

      if (
        !arr.length
      ) {
        el.textContent =
          '—';

        return;
      }

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'protocols';

      for (
        const protocol of arr
      ) {
        const item =
          document.createElement(
            'span'
          );

        item.className =
          'protocol';

        item.textContent =
          String(
            protocol
          );

        wrapper.appendChild(
          item
        );
      }

      el.appendChild(
        wrapper
      );
    }

    function showApiError(
      status,
      retryAfter
    ) {
      if (
        status === 401
      ) {
        showError(
          'Подписка недействительна.'
        );
        return;
      }

      if (
        status === 403
      ) {
        showError(
          'Доступ запрещён.'
        );
        return;
      }

      if (
        status === 429
      ) {
        const seconds =
          Number(
            retryAfter
          );

        showError(
          Number.isFinite(seconds) &&
          seconds > 0
            ? `Слишком много запросов. Повторите через ${Math.ceil(seconds)} сек.`
            : 'Слишком много запросов. Попробуйте позже.',
          true
        );

        return;
      }

      if (
        status === 502 ||
        status === 503 ||
        status === 504
      ) {
        showError(
          'Сервер временно недоступен.'
        );

        return;
      }

      showError(
        'Не удалось получить данные подписки.'
      );
    }

    function isSubscriptionActive(data) {
      const sub =
        data?.subscription ||
        {};

      return !(
        sub.enabled === false ||
        sub.active === false ||
        data?.enabled === false ||
        data?.active === false
      );
    }

    function renderActive(
      data,
      elapsed
    ) {
      const sub =
        data?.subscription ||
        {};

      $('subscription').textContent =
        String(
          data.subscription_name ||
          sub.name ||
          data.name ||
          'VPN-подписка'
        );

      $('server').textContent =
        'Финляндия';

      renderConnections(
        data
      );

      renderProtocols(
        sub.protocols ||
        data.protocols ||
        []
      );

      $('traffic').textContent =
        trafficText(
          sub
        );

      $('expire').textContent =
        expireText(
          sub.expire
        );

      $('latency').textContent =
        `${Math.max(1, Math.round(elapsed))} мс`;

      if (
        typeof data.launch_url ===
          'string' &&
        isAllowedHappUrl(
          data.launch_url
        )
      ) {
        $('happConnect').href =
          data.launch_url;

        $('happConnect').hidden =
          false;
      }
    }

    async function loadInternal() {
      hideError();
      resetFields();

      setStatus(
        'wait',
        'Проверка…'
      );

      if (
        !activeToken
      ) {
        setStatus(
          'bad',
          'Не активно'
        );

        showError(
          'Ссылка не содержит ключ подписки.'
        );

        return;
      }

      try {
        const {
          res,
          data,
          elapsed
        } =
          await fetchSubscription();

        if (
          res.status === 429
        ) {
          setStatus(
            'warn',
            'Ограничение'
          );

          showApiError(
            429,
            res.headers.get(
              'Retry-After'
            )
          );

          return;
        }

        if (
          !res.ok ||
          !data ||
          data.ok === false
        ) {
          setStatus(
            'bad',
            'Не активно'
          );

          showApiError(
            res.status,
            res.headers.get(
              'Retry-After'
            )
          );

          return;
        }

        if (
          !isSubscriptionActive(
            data
          )
        ) {
          setStatus(
            'bad',
            'Не активно'
          );

          showError(
            'Эта VPN-подписка отключена.'
          );

          return;
        }

        setStatus(
          'ok',
          'Активно'
        );

        renderActive(
          data,
          elapsed
        );
      } catch (error) {
        setStatus(
          'bad',
          'Не активно'
        );

        resetFields();

        showError(
          error?.name ===
            'AbortError'
            ? 'Сервер не ответил вовремя.'
            : 'Нет связи с сервером подписки.'
        );
      }
    }

    function load() {
      if (
        activeLoadPromise
      ) {
        return activeLoadPromise;
      }

      activeLoadPromise =
        loadInternal().finally(
          () => {
            activeLoadPromise =
              null;
          }
        );

      return activeLoadPromise;
    }

    $('happConnect').addEventListener(
      'click',
      event => {
        const href =
          $('happConnect').getAttribute(
            'href'
          );

        if (
          !href ||
          !isAllowedHappUrl(
            href
          )
        ) {
          event.preventDefault();
          return;
        }

        event.currentTarget.href =
          href;
      }
    );

    window.addEventListener(
      'hashchange',
      () => {
        const urlToken =
          getUrlToken();

        if (
          urlToken
        ) {
          activeToken =
            urlToken;

          saveTokenToHistory(
            activeToken
          );
        } else {
          activeToken =
            getHistoryToken();

          clearUrlKeepHistoryState();
        }

        clearTimeout(
          hashTimer
        );

        hashTimer =
          setTimeout(
            () => load(),
            HASH_CHANGE_DELAY_MS
          );
      }
    );

    window.addEventListener(
      'popstate',
      () => {
        activeToken =
          getHistoryToken();

        clearUrlKeepHistoryState();

        load();
      }
    );

    window.addEventListener(
      'load',
      () => {
        adoptToken();

        $('happDownload').href =
          'https://happ.info/';

        load();
      }
    );
  </script>

</body>
</html>
