
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="VPN-подписка Limupy VPN для HAPP">
  <meta property="og:title" content="Limupy VPN">
  <meta property="og:description" content="VPN-подписка для HAPP">
  <meta name="theme-color" content="#0b0c0f">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Limupy VPN</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1115'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial,sans-serif' font-size='42' font-weight='700' fill='white'%3EL%3C/text%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0b0c0f;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.045), transparent 34%),
        #0b0c0f;
      color: #f3f4f6;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing: antialiased;
      opacity: 0;
      transition: opacity .15s ease;
    }

    body.ready {
      opacity: 1;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 42px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101216;
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .brand {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .subtitle {
      margin-top: 5px;
      color: #8f96a3;
      font-size: 14px;
      line-height: 1.3;
    }

    .card {
      background: rgba(18,20,24,.92);
      border: 1px solid rgba(255,255,255,.065);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
    }

    .card-head {
      padding: 20px 20px 17px;
      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #f4f5f7;
    }

    .key-wrap {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .key-label {
      color: #7f8793;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .key {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 10px;
      background: #0e1014;
      border: 1px solid rgba(255,255,255,.06);
      color: #cdd2da;
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size: 12px;
    }

    .status {
      margin-top: 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0e1014;
      border: 1px solid rgba(255,255,255,.06);
      color: #9fa6b2;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #737984;
      flex: 0 0 7px;
    }

    .status.ok {
      color: #d8dbe0;
    }

    .status.ok .status-dot {
      background: #c9ced6;
    }

    .status.error {
      color: #d7a2a2;
    }

    .status.error .status-dot {
      background: #b86767;
    }

    .rows {
      padding: 5px 20px;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.7fr);
      gap: 18px;
      align-items: center;
      min-height: 60px;
      border-bottom: 1px solid rgba(255,255,255,.045);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      min-width: 0;
      color: #7f8793;
      font-size: 13px;
      line-height: 1.35;
    }

    .value {
      min-width: 0;
      color: #eceef1;
      font-size: 14px;
      line-height: 1.4;
      text-align: right;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .server-value {
      display: flex;
      justify-content: flex-end;
    }

    .server-main {
      max-width: 100%;
      text-align: right;
      color: #e6e8ec;
    }

    .config-text {
      max-width: 100%;
      text-align: right;
      color: #d9dce2;
    }

    .devices {
      padding: 20px;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .devices-title {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .device-list {
      display: grid;
      gap: 9px;
    }

    .device {
      position: relative;
      padding: 13px 72px 13px 14px;
      border-radius: 13px;
      background: #0e1014;
      border: 1px solid rgba(255,255,255,.055);
      min-width: 0;
    }

    .device-name {
      color: #e5e7eb;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .device-date {
      margin-top: 4px;
      color: #737a86;
      font-size: 11px;
      line-height: 1.3;
    }

    .device-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      padding: 4px 7px;
      border-radius: 8px;
      background: #1a1d22;
      border: 1px solid rgba(255,255,255,.06);
      color: #aab0b9;
      font-size: 10px;
      line-height: 1;
    }

    .warning {
      margin: 0 20px 20px;
      padding: 12px 13px;
      border-radius: 12px;
      background: #0e1014;
      border: 1px solid rgba(255,255,255,.055);
      color: #858c98;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .button {
      min-height: 48px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.07);
      background: #1a1d22;
      color: #f2f3f5;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 15px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }

    .button:active {
      transform: scale(.985);
    }

    .button.primary {
      background: #f0f1f3;
      color: #101216;
      border-color: transparent;
    }

    .empty {
      color: #737a86;
      font-size: 13px;
      padding: 5px 0;
    }

    @media (max-width: 767px) {
      .page {
        padding:
          calc(20px + env(safe-area-inset-top))
          12px
          calc(28px + env(safe-area-inset-bottom));
      }

      .header {
        gap: 12px;
        margin-bottom: 17px;
      }

      .logo {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
        border-radius: 15px;
        font-size: 34px;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
      }

      .card {
        border-radius: 18px;
      }

      .card-head {
        padding: 17px 15px 15px;
      }

      .rows {
        padding: 4px 15px;
      }

      .row {
        grid-template-columns: minmax(78px,.9fr) minmax(0,1.6fr);
        gap: 10px;
        min-height: 57px;
      }

      .label {
        font-size: 12px;
      }

      .value {
        font-size: 13px;
      }

      .devices {
        padding: 16px 15px;
      }

      .warning {
        margin: 0 15px 15px;
      }

      .actions {
        padding: 0 15px 15px;
      }

      .button {
        min-height: 46px;
      }
    }

    @media (max-width: 390px) {
      .row {
        grid-template-columns: minmax(72px,.86fr) minmax(0,1.55fr);
        gap: 8px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="logo">L</div>

      <div class="brand">
        <h1 class="title">Limupy VPN</h1>
        <div class="subtitle">VPN-подписка</div>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <div class="section-title">Подписка</div>

        <div class="key-wrap">
          <div class="key-label">Ключ</div>
          <div class="key" id="keyView">Проверка...</div>
        </div>

        <div class="status" id="status">
          <span class="status-dot"></span>
          <span id="statusText">Проверка подписки...</span>
        </div>
      </div>

      <div class="rows">
        <div class="row">
          <div class="label">Клиент</div>
          <div class="value">HAPP</div>
        </div>

        <div class="row">
          <div class="label">Сервер</div>
          <div class="value server-value">
            <div class="server-main" id="serverMain">Проверка...</div>
          </div>
        </div>

        <div class="row">
          <div class="label">Конфигурация</div>
          <div class="value">
            <div class="config-text" id="configText">Проверка...</div>
          </div>
        </div>

        <div class="row">
          <div class="label">Осталось</div>
          <div class="value" id="remaining">Проверка...</div>
        </div>

        <div class="row">
          <div class="label">Использовано</div>
          <div class="value" id="used">Проверка...</div>
        </div>

        <div class="row">
          <div class="label">Действует до</div>
          <div class="value" id="expire">Проверка...</div>
        </div>
      </div>

      <div class="devices">
        <div class="devices-title">Устройства</div>
        <div class="device-list" id="deviceList"></div>
      </div>

      <div class="warning">
        Не передавайте ссылку на этот сайт третьим лицам.
      </div>

      <div class="actions">
        <button class="button primary" id="openButton" type="button">
          Открыть HAPP
        </button>

        <a class="button" href="https://happ.info/" target="_blank" rel="noopener noreferrer">
          Скачать HAPP
        </a>
      </div>
    </section>
  </main>

  <script>
    const SERVER = "http://78.17.112.158/open.php";
    let initialized = false;

    function setReady() {
      requestAnimationFrame(() => {
        document.body.classList.add("ready");
      });
    }

    function setStatus(text, type = "") {
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");

      status.className = "status" + (type ? " " + type : "");
      statusText.textContent = text;
    }

    function formatBytes(bytes) {
      const value = Number(bytes || 0);

      if (!Number.isFinite(value) || value <= 0) {
        return "0 Б";
      }

      const units = ["Б", "КБ", "МБ", "ГБ", "ТБ"];
      let size = value;
      let index = 0;

      while (size >= 1024 && index < units.length - 1) {
        size /= 1024;
        index++;
      }

      const rounded = size >= 10 || index === 0
        ? Math.round(size)
        : Math.round(size * 10) / 10;

      return rounded + " " + units[index];
    }

    function formatDate(timestamp) {
      const value = Number(timestamp || 0);

      if (!value) {
        return "Не указано";
      }

      const date = new Date(value * 1000);

      if (Number.isNaN(date.getTime())) {
        return "Не указано";
      }

      return date.toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function decodeState(value) {
      try {
        const normalized = value
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const padding = "=".repeat(
          (4 - normalized.length % 4) % 4
        );

        const binary = atob(normalized + padding);
        const bytes = Uint8Array.from(
          binary,
          char => char.charCodeAt(0)
        );

        return JSON.parse(
          new TextDecoder().decode(bytes)
        );
      } catch {
        return null;
      }
    }

    function getKey() {
      const params = new URLSearchParams(
        window.location.search
      );

      const queryKey = params.get("key");

      if (
        queryKey &&
        queryKey.trim() &&
        queryKey.trim() !== "vpn"
      ) {
        return queryKey.trim();
      }

      return "";
    }

    function requestData(key) {
      const returnUrl = new URL(
        window.location.href
      );

      returnUrl.hash = "";

      const url =
        SERVER +
        "?mode=collect" +
        "&key=" + encodeURIComponent(key) +
        "&return=" + encodeURIComponent(
          returnUrl.toString()
        );

      window.location.replace(url);
    }

    function launchHapp() {
      const key = getKey();

      const returnUrl = new URL(
        window.location.href
      );

      returnUrl.hash = "";

      const url =
        SERVER +
        "?mode=launch" +
        "&key=" + encodeURIComponent(key) +
        "&return=" + encodeURIComponent(
          returnUrl.toString()
        );

      window.location.assign(url);
    }

    function renderSubscription(info) {
      const remaining =
        document.getElementById("remaining");

      const used =
        document.getElementById("used");

      const expire =
        document.getElementById("expire");

      const configText =
        document.getElementById("configText");

      if (!info) {
        remaining.textContent = "Нет данных";
        used.textContent = "Нет данных";
        expire.textContent = "Нет данных";
        configText.textContent = "Нет данных";
        return;
      }

      const total = Number(
        info.total_bytes || 0
      );

      const usedBytes = Number(
        info.used_bytes || 0
      );

      const remainingBytes = Number(
        info.remaining_bytes || 0
      );

      remaining.textContent =
        total > 0
          ? formatBytes(remainingBytes)
          : "Безлимит";

      used.textContent =
        formatBytes(usedBytes);

      expire.textContent =
        Number(info.expire || 0) > 0
          ? formatDate(info.expire)
          : "Без ограничения";

      const protocols =
        Array.isArray(info.protocols)
          ? info.protocols.filter(Boolean)
          : [];

      configText.textContent =
        protocols.length
          ? protocols.join(" · ")
          : "Нет данных";
    }

    function renderPing(ping) {
      const serverMain =
        document.getElementById("serverMain");

      if (
        ping &&
        ping.available &&
        Number.isFinite(Number(ping.rtt))
      ) {
        serverMain.textContent =
          "Finland · Доступен · " +
          Number(ping.rtt).toFixed(1) +
          " мс";
      } else {
        serverMain.textContent =
          "Finland · Недоступен";
      }
    }

    function renderDevices(
      devices,
      currentDeviceId
    ) {
      const list =
        document.getElementById("deviceList");

      list.innerHTML = "";

      if (
        !Array.isArray(devices) ||
        !devices.length
      ) {
        const empty =
          document.createElement("div");

        empty.className = "empty";
        empty.textContent =
          "Устройства пока не зарегистрированы";

        list.appendChild(empty);
        return;
      }

      devices.forEach(device => {
        const item =
          document.createElement("div");

        item.className = "device";

        const name =
          document.createElement("div");

        name.className = "device-name";
        name.textContent =
          device.name ||
          "Неизвестное устройство";

        const date =
          document.createElement("div");

        date.className = "device-date";
        date.textContent =
          "Последний вход: " +
          formatDate(
            device.last_seen ||
            device.first_seen
          );

        item.appendChild(name);
        item.appendChild(date);

        if (
          device.id === currentDeviceId
        ) {
          const badge =
            document.createElement("div");

          badge.className =
            "device-badge";

          badge.textContent =
            "Текущее";

          item.appendChild(badge);
        }

        list.appendChild(item);
      });
    }

    function renderState(state, key) {
      document.getElementById(
        "keyView"
      ).textContent =
        key || "Не указан";

      if (!state) {
        setStatus(
          "Не удалось получить данные",
          "error"
        );

        document.getElementById(
          "serverMain"
        ).textContent =
          "Finland · Недоступен";

        document.getElementById(
          "configText"
        ).textContent =
          "Нет данных";

        document.getElementById(
          "remaining"
        ).textContent =
          "Нет данных";

        document.getElementById(
          "used"
        ).textContent =
          "Нет данных";

        document.getElementById(
          "expire"
        ).textContent =
          "Нет данных";

        document.getElementById(
          "deviceList"
        ).innerHTML =
          '<div class="empty">Данные недоступны</div>';

        return;
      }

      setStatus(
        "Подписка активна",
        "ok"
      );

      renderSubscription(
        state.subscription
      );

      renderPing(
        state.ping
      );

      renderDevices(
        state.devices || [],
        state.current_device_id || ""
      );

      history.replaceState(
        null,
        "",
        window.location.pathname +
        window.location.search
      );
    }

    function initialize() {
      if (initialized) {
        return;
      }

      initialized = true;

      const key = getKey();

      if (!key) {
        setStatus(
          "Ключ не указан",
          "error"
        );

        document.getElementById(
          "keyView"
        ).textContent =
          "Нет ключа";

        setReady();
        return;
      }

      const hashParams =
        new URLSearchParams(
          window.location.hash.replace(
            /^#/,
            ""
          )
        );

      const encodedState =
        hashParams.get("state");

      if (!encodedState) {
        requestData(key);
        return;
      }

      const state =
        decodeState(encodedState);

      renderState(
        state,
        key
      );

      setReady();
    }

    document
      .getElementById("openButton")
      .addEventListener(
        "click",
        launchHapp
      );

    initialize();
  </script>
</body>
</html>
