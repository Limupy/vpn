<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Limupy</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:#11141b;
      --panel-2:#151923;
      --line:#262b36;
      --text:#f5f7fb;
      --muted:#8f97a8;
      --danger:#ff6868;
      --success:#67d391;
      --shadow:0 20px 60px rgba(0,0,0,.28);
      --radius:18px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{min-height:100vh}
    button,input,textarea{font:inherit}
    button{border:0;cursor:pointer}

    .app{
      width:min(700px,100%);
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .mode-wrap{position:relative}

    .mode-button{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:40px;
      padding:0 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      color:var(--text);
      font-weight:700;
    }

    .mode-button svg{width:15px;height:15px;opacity:.7}

    .mode-menu{
      position:absolute;
      right:0;
      top:48px;
      z-index:30;
      width:170px;
      padding:6px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      display:none;
    }

    .mode-menu.open{display:block}

    .mode-option{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:11px 12px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      text-align:left;
    }

    .mode-option:hover{background:#1b202b}
    .mode-option.active{background:#202631}
    .mode-option span:last-child{color:var(--muted);font-size:12px}

    .page{display:none}
    .page.active{display:block}

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel + .panel{margin-top:12px}

    .panel-head{
      padding:18px 18px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panel-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .panel-subtitle{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .panel-body{padding:18px}

    .mode-label{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .mode-value{
      font-size:30px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .status-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:16px;
    }

    .status-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      min-width:0;
    }

    .status-item-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px;
    }

    .status-item-value{
      font-size:14px;
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .input-row{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:stretch;
    }

    .input-row #vpnCheck{
      min-height:46px;
      height:46px;
      width:100%;
      align-self:stretch;
      font-size:16px;
      font-weight:800;
    }

    .input{
      width:100%;
      height:46px;
      min-height:46px;
      padding:0 14px;
      text-align:left;
      line-height:normal;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      outline:none;
      color:var(--text);
    }

    .input:focus{border-color:#454d5d}
    .input::placeholder{color:#687080}

    .btn{
      min-height:46px;
      padding:0 16px;
      border-radius:12px;
      font-weight:750;
      transition:.18s ease;
      white-space:nowrap;
    }

    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:#fff;color:#111}
    .vpn-check-btn{
      min-height:56px;
      height:56px;
    }

    .btn-primary:hover:not(:disabled){background:#e9ebef}
    .btn-secondary{background:var(--panel-2);border:1px solid var(--line);color:var(--text)}
    .btn-secondary:hover:not(:disabled){background:#1a1f29}
    .btn-danger{background:rgba(255,104,104,.08);border:1px solid rgba(255,104,104,.22);color:var(--danger)}

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .actions.one{grid-template-columns:1fr}

    .notice{
      margin-top:10px;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
      background:var(--panel-2);
    }

    /* Errors stay neutral; red is reserved for destructive actions. */
    .notice.error{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
    .notice.success{color:#a3e9ba;border-color:rgba(103,211,145,.22);background:rgba(103,211,145,.05)}

    .lan-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      padding:5px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:13px;
      margin-bottom:12px;
    }

    .lan-tab{
      min-height:38px;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      font-weight:700;
    }

    .lan-tab.active{background:#202631;color:var(--text)}
    .lan-form{display:none}
    .lan-form.active{display:block}

    .field{margin-bottom:12px}

    .field-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:7px;
      display:block;
    }

    .floating-field{
      position:relative;
      padding-top:5px;
    }

    .floating-field .field-label{
      position:absolute;
      top:0;
      left:12px;
      z-index:1;
      margin:0;
      padding:0 5px;
      background:var(--panel);
      transform:translateY(-50%);
      line-height:1;
    }

    .floating-field .input{
      min-height:52px;
      height:52px;
      padding:0 14px;
      line-height:normal;
    }

    .input-field-grow{
      flex:1;
      margin-bottom:0;
      min-width:0;
    }

    .input-field-grow .field-label{
      background:var(--panel);
    }

    .input-row > .btn{
      flex:0 0 auto;
      align-self:stretch;
    }

    .key-row{
      display:flex;
      gap:10px;
      align-items:stretch;
    }

    .key-row .input{min-width:0}

    .mini-btn{
      flex:0 0 auto;
      min-height:40px;
      padding:8px 10px;
      border-radius:9px;
      background:#202631;
      color:var(--text);
      border:1px solid var(--line);
      font-size:12px;
      font-weight:700;
    }

    .network-list{display:grid;gap:8px}

    .network-item{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      text-align:left;
      padding:13px 14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      color:var(--text);
      border-radius:12px;
    }

    .network-item:hover{background:#191e27}
    .network-main{min-width:0}
    .network-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .network-meta{margin-top:4px;color:var(--muted);font-size:11px}
    .network-arrow{color:var(--muted);font-size:18px}

    .current-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .current-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
    }

    .current-label{color:var(--muted);font-size:11px;margin-bottom:7px}
    .current-value{font-weight:700;font-size:14px;word-break:break-word}

    .access-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:14px;
    }

    .access-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .access-title{font-size:12px;color:var(--muted)}

    .access-code{
      padding:11px 12px;
      border-radius:10px;
      border:1px dashed #3a4250;
      background:#0f1218;
      color:var(--text);
      font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.04em;
      word-break:break-all;
      user-select:text;
    }

    .config-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel-2);
    }

    .config-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .config-title{font-weight:750;font-size:13px}
    .config-actions{display:flex;gap:8px}

    .config-text{
      width:100%;
      min-height:220px;
      resize:vertical;
      padding:12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0c0f14;
      color:#d9dde5;
      font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
      outline:none;
    }

    .devices{display:grid;gap:8px}

    .device{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 13px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:12px;
    }

    .device-main{min-width:0}
    .device-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .device-sub{margin-top:4px;color:var(--muted);font-size:11px}
    .device-state{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);flex:0 0 auto}
    .device-dot{width:7px;height:7px;border-radius:50%;background:#666e7d}
    .device-dot.online{background:var(--success)}

    .empty{
      padding:18px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:12px;
      font-size:12px;
    }

    .hidden{display:none !important}

    @media (max-width:700px){
      .status-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media (max-width:620px){
      .app{padding:16px 12px 28px}
      .input-row{flex-direction:column}
      .actions{grid-template-columns:1fr}
      .config-head{align-items:flex-start;flex-direction:column}
      .config-actions{width:100%}
      .config-actions .mini-btn{flex:1}
      .key-row{flex-direction:column}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Limupy</div>
      <div class="mode-wrap">
        <button class="mode-button" id="modeButton" type="button" aria-expanded="false">
          <span id="modeButtonText">VPN</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
        <div class="mode-menu" id="modeMenu">
          <button class="mode-option active" data-mode="vpn" type="button"><span>VPN</span><span>Сервис</span></button>
          <button class="mode-option" data-mode="lan" type="button"><span>LAN</span><span>Сеть</span></button>
        </div>
      </div>
    </div>

    <main>
      <section class="page active" id="pageVpn">
        <div class="panel">
          <div class="panel-body">
            <div class="mode-value">VPN</div>
            <div class="status-grid">
              <div class="status-item"><div class="status-item-label">Срок</div><div class="status-item-value" id="vpnExpiry">—</div></div>
              <div class="status-item"><div class="status-item-label">Пинг</div><div class="status-item-value" id="vpnPing">—</div></div>
              <div class="status-item"><div class="status-item-label">Статус</div><div class="status-item-value" id="vpnState">—</div></div>
              <div class="status-item"><div class="status-item-label">Трафик</div><div class="status-item-value" id="vpnTraffic">—</div></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Токен</div>
              
            </div>
          </div>
          <div class="panel-body">
            <div class="input-row">
              <div class="field floating-field input-field-grow">
                <label class="field-label" for="vpnToken">Токен</label>
                <input class="input" id="vpnToken" type="text" placeholder="Введите токен" autocomplete="off" spellcheck="false">
              </div>
              <button class="btn btn-primary vpn-check-btn" id="vpnCheck" type="button">Проверить</button>
            </div>
            <div class="actions hidden" id="vpnActions">
              <button class="btn btn-primary" id="happDownload" type="button">Открыть ссылку Happ</button>
              <button class="btn btn-secondary" id="happOpen" type="button">Открыть в Happ</button>
            </div>
          </div>
        </div>
      </section>

      <section class="page" id="pageLan">
        <div class="panel">
          <div class="panel-body">
            <div class="mode-value">LAN</div>
            <div class="status-grid">
              <div class="status-item"><div class="status-item-label">Статус</div><div class="status-item-value" id="lanInfoStatus">Не готова</div></div>
              <div class="status-item"><div class="status-item-label">Подсеть</div><div class="status-item-value" id="lanInfoSubnet">—</div></div>
              <div class="status-item"><div class="status-item-label">IP</div><div class="status-item-value" id="lanInfoIp">—</div></div>
              <div class="status-item"><div class="status-item-label">Роль</div><div class="status-item-value" id="lanInfoRole">—</div></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Подключение</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="lan-tabs">
              <button class="lan-tab active" data-lan-tab="create" type="button">Создать</button>
              <button class="lan-tab" data-lan-tab="join" type="button">Подключить</button>
            </div>

            <div class="field floating-field">
              <label class="field-label" for="lanPublicKey">Ключ</label>
              <input class="input" id="lanPublicKey" type="text" placeholder="Введите ключ" autocomplete="off" spellcheck="false">
            </div>

            <div class="lan-form active" id="lanCreateForm">
              <div class="field floating-field">
                <label class="field-label" for="lanCreateName">Название</label>
                <input class="input" id="lanCreateName" type="text" maxlength="64" placeholder="Введите название">
              </div>
              <div class="actions one">
                <button class="btn btn-primary" id="lanCreateButton" type="button">Создать</button>
              </div>
            </div>

            <div class="lan-form" id="lanJoinForm">
              <div class="field floating-field">
                <label class="field-label" for="lanJoinCode">Код</label>
                <input class="input" id="lanJoinCode" type="text" maxlength="128" placeholder="Введите код" autocomplete="off" spellcheck="false">
              </div>
              <div class="actions one">
                <button class="btn btn-primary" id="lanJoinButton" type="button">Подключить</button>
              </div>
            </div>

          </div>
        </div>

        <div class="panel" id="myNetworksPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Мои сети</div>
            </div>
            <button class="mini-btn" id="refreshLan" type="button">Обновить</button>
          </div>
          <div class="panel-body"><div class="network-list" id="networkList"></div></div>
        </div>

        <div class="panel hidden" id="currentNetworkPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Текущая сеть</div>
              <div class="panel-subtitle" id="currentNetworkSubtitle">—</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="current-grid">
              <div class="current-item"><div class="current-label">Имя</div><div class="current-value" id="currentName">—</div></div>
              <div class="current-item"><div class="current-label">Подсеть</div><div class="current-value" id="currentSubnet">—</div></div>
              <div class="current-item"><div class="current-label">Мой IP</div><div class="current-value" id="currentIp">—</div></div>
              <div class="current-item"><div class="current-label">Роль</div><div class="current-value" id="currentRole">—</div></div>
            </div>

            <div class="access-box hidden" id="accessBox">
              <div class="access-head">
                <div class="access-title">Код для гостей</div>
                <button class="mini-btn" id="copyAccessCode" type="button">Копировать</button>
              </div>
              <div class="access-code" id="accessCode">—</div>
            </div>

            <div class="config-box">
              <div class="config-head">
                <div class="config-title">WireGuard</div>
                <div class="config-actions">
                  <button class="mini-btn" id="copyConfig" type="button">Копировать</button>
                  <button class="mini-btn" id="downloadConfig" type="button">Скачать</button>
                </div>
              </div>
              <textarea class="config-text" id="configText" readonly spellcheck="false"></textarea>
            </div>
          </div>
        </div>

        <div class="panel hidden" id="devicesPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Устройства</div>
              <div class="panel-subtitle" id="devicesCount">0 устройств</div>
            </div>
          </div>
          <div class="panel-body"><div class="devices" id="devicesList"></div></div>
        </div>

        <div class="panel hidden" id="networkActionsPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Действия</div>
              <div class="panel-subtitle">Управление текущей сетью</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="actions one">
              <button class="btn btn-secondary" id="leaveLanButton" type="button">Выйти из сети</button>
              <button class="btn btn-danger hidden" id="deleteLanButton" type="button">Удалить LAN-сеть</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_URL = 'https://78.17.112.158/api.php';
    const REQUEST_TIMEOUT_MS = 10000;

    const LS_VPN_TOKEN = 'limupy_vpn_token';

    const SS_ACTIVE_NETWORK = 'limupy_active_network';
    const SS_LAN_NETWORKS = 'limupy_lan_networks';
    const SS_LAN_JOIN_CODES = 'limupy_lan_join_codes';

    let currentMode = 'vpn';
    let currentLanTab = 'create';
    let currentNetwork = null;
    let currentConfig = '';
    let vpnData = null;

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setMode(mode) {
      currentMode = mode;
      $('pageVpn').classList.toggle('active', mode === 'vpn');
      $('pageLan').classList.toggle('active', mode === 'lan');
      $('modeButtonText').textContent = mode === 'vpn' ? 'VPN' : 'LAN';

      document.querySelectorAll('.mode-option').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });

      $('modeMenu').classList.remove('open');
      $('modeButton').setAttribute('aria-expanded', 'false');

      if (mode === 'lan') refreshLanNetwork();
    }

    function setLanTab(tab) {
      currentLanTab = tab;
      document.querySelectorAll('.lan-tab').forEach(button => {
        button.classList.toggle('active', button.dataset.lanTab === tab);
      });
      $('lanCreateForm').classList.toggle('active', tab === 'create');
      $('lanJoinForm').classList.toggle('active', tab === 'join');
    }

    async function api(action, payload = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(API_URL, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action, ...payload}),
          signal:controller.signal
        });

        const text = await response.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(text || 'Ошибка сервера');
        }

        if (!response.ok) {
          throw new Error(data?.message || data?.error || 'Ошибка сервера');
        }

        if (data?.success === false || data?.ok === false) {
          throw new Error(data?.message || data?.error || 'Ошибка сервера');
        }

        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    function readSession(key, fallback) {
      try {
        const raw = sessionStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeSession(key, value) {
      sessionStorage.setItem(key, JSON.stringify(value));
    }

    function getPublicKey() {
      return $('lanPublicKey').value.trim();
    }

    function isValidBase64Key(value) {
      if (!value || typeof value !== 'string') return false;
      try {
        const normalized = value.replace(/\s/g, '');
        if (!/^[A-Za-z0-9+/]+={0,2}$/.test(normalized)) return false;
        return atob(normalized).length === 32;
      } catch {
        return false;
      }
    }

    function getActiveNetwork() {
      return readSession(SS_ACTIVE_NETWORK, null);
    }

    function saveActiveNetwork(network) {
      if (!network) {
        sessionStorage.removeItem(SS_ACTIVE_NETWORK);
        return;
      }
      writeSession(SS_ACTIVE_NETWORK, network);
    }

    function getLanNetworks() {
      return readSession(SS_LAN_NETWORKS, []);
    }

    function saveLanNetworks(networks) {
      writeSession(SS_LAN_NETWORKS, networks || []);
    }

    function getJoinCodes() {
      return readSession(SS_LAN_JOIN_CODES, {});
    }

    function saveJoinCodes(codes) {
      writeSession(SS_LAN_JOIN_CODES, codes || {});
    }

    function getJoinCodeForNetwork(networkId) {
      const codes = getJoinCodes();
      return codes[String(networkId)] || '';
    }

    function saveJoinCode(networkId, code) {
      if (!networkId || !code) return;
      const codes = getJoinCodes();
      codes[String(networkId)] = code;
      saveJoinCodes(codes);
    }

    function removeJoinCode(networkId) {
      const codes = getJoinCodes();
      delete codes[String(networkId)];
      saveJoinCodes(codes);
    }

    function normalizeNetwork(raw, fallback = {}, publicKey = '') {
      if (!raw) return null;

      const ownerKey = raw.owner_public_key || raw.ownerPublicKey || '';
      const id = raw.network_id ?? raw.networkId ?? raw.id ?? fallback.id ?? null;

      let role = raw.role || fallback.role || '';
      if (!role) role = ownerKey && publicKey && ownerKey === publicKey ? 'owner' : 'member';

      return {
        id,
        name: raw.name ?? raw.network_name ?? raw.networkName ?? fallback.name ?? 'LAN',
        subnet: raw.subnet ?? raw.cidr ?? fallback.subnet ?? '—',
        publicKey: raw.public_key ?? raw.publicKey ?? ownerKey ?? fallback.publicKey ?? '',
        ownerPublicKey: ownerKey || fallback.ownerPublicKey || '',
        role,
        myIp: raw.my_ip ?? raw.myIp ?? raw.ip ?? raw.address ?? raw.me?.ip ?? raw.me?.address ?? fallback.myIp ?? '—',
        joinCode: raw.join_code ?? raw.joinCode ?? raw.code ?? fallback.joinCode ?? getJoinCodeForNetwork(id) ?? '',
        config: raw.config ?? raw.wireguard_config ?? raw.wireguardConfig ?? fallback.config ?? '',
        devices: Array.isArray(raw.devices) ? raw.devices : (fallback.devices || [])
      };
    }

    function normalizeNetworkCollection(data, publicKey) {
      let rawNetworks = [];

      if (Array.isArray(data?.networks)) rawNetworks = data.networks;
      else if (data?.network) rawNetworks = [data.network];
      else if (data?.network_id || data?.networkId || data?.id || data?.name || data?.config) rawNetworks = [data];

      const existing = getLanNetworks();

      return rawNetworks.map(raw => {
        const id = raw?.network_id ?? raw?.networkId ?? raw?.id ?? null;
        const fallback = existing.find(item => id != null && String(item.id) === String(id)) || {};
        return normalizeNetwork(raw, fallback, publicKey);
      }).filter(network => network && network.id != null);
    }

    function mergeNetworks(networks) {
      const existing = getLanNetworks();
      const map = new Map();

      existing.forEach(item => {
        if (item?.id != null) map.set(String(item.id), item);
      });

      networks.forEach(network => {
        if (!network?.id) return;
        const key = String(network.id);
        const previous = map.get(key) || {};
        map.set(key, {
          ...previous,
          ...network,
          joinCode: network.joinCode || previous.joinCode || '',
          config: network.config || previous.config || '',
          devices: network.devices?.length ? network.devices : (previous.devices || [])
        });
      });

      const merged = [...map.values()];
      saveLanNetworks(merged);
      return merged;
    }

    function updateLanInfo(network, status = '') {
      const key = getPublicKey();
      let resolvedStatus = status;

      if (!key) {
        resolvedStatus = 'Не готова';
      } else if (!isValidBase64Key(key)) {
        resolvedStatus = 'Неверный ключ';
      } else if (!resolvedStatus) {
        resolvedStatus = 'Действительный';
      }

      $('lanInfoSubnet').textContent = network?.subnet || '—';
      $('lanInfoIp').textContent = network?.myIp || '—';
      $('lanInfoRole').textContent = network ? (network.role === 'owner' ? 'Владелец' : 'Участник') : '—';
      $('lanInfoStatus').textContent = resolvedStatus;
    }

    function setLanStatus(message, network = currentNetwork) {
      const key = getPublicKey();
      if (!key) {
        updateLanInfo(network, 'Не готова');
        return;
      }
      if (!isValidBase64Key(key)) {
        updateLanInfo(network, 'Неверный ключ');
        return;
      }
      updateLanInfo(network, message || 'Действительный');
    }

    function renderNetworkList(networks) {
      const list = $('networkList');

      if (!networks.length) {
        list.innerHTML = '<div class="empty">Нет сетей</div>';
        return;
      }

      list.innerHTML = networks.map(network => {
        const role = network.role === 'owner' ? 'Владелец' : 'Участник';
        return `
          <button class="network-item" type="button" data-network-id="${escapeHtml(network.id)}">
            <div class="network-main">
              <div class="network-name">${escapeHtml(network.name)}</div>
              <div class="network-meta">${escapeHtml(network.subnet)} · ${escapeHtml(role)} · ${escapeHtml(network.myIp || '—')}</div>
            </div>
            <div class="network-arrow">›</div>
          </button>`;
      }).join('');

      list.querySelectorAll('.network-item').forEach(button => {
        button.addEventListener('click', () => {
          const network = networks.find(item => String(item.id) === String(button.dataset.networkId));
          if (network) openNetwork(network);
        });
      });
    }

    function renderDevices(devices) {
      const list = $('devicesList');
      $('devicesCount').textContent = `${devices.length} ${devices.length === 1 ? 'устройство' : 'устройств'}`;

      if (!devices.length) {
        list.innerHTML = '<div class="empty">Нет устройств</div>';
        return;
      }

      const myPublicKey = getPublicKey();

      list.innerHTML = devices.map(device => {
        const publicKey = device.public_key || device.publicKey || '';
        const name = device.name || (publicKey === myPublicKey ? 'Это устройство' : 'Устройство');
        const ip = device.ip || device.address || device.client_ip || '—';
        const online = Boolean(device.online || device.is_online || device.connected);

        return `
          <div class="device">
            <div class="device-main">
              <div class="device-name">${escapeHtml(name)}</div>
              <div class="device-sub">${escapeHtml(ip)}</div>
            </div>
            <div class="device-state">
              <span class="device-dot ${online ? 'online' : ''}"></span>
              <span>${online ? 'онлайн' : 'офлайн'}</span>
            </div>
          </div>`;
      }).join('');
    }

    function renderCurrentNetwork(network) {
      currentNetwork = network;
      saveActiveNetwork(network);
      updateLanInfo(network);

      $('currentNetworkPanel').classList.remove('hidden');
      $('networkActionsPanel').classList.remove('hidden');
      $('devicesPanel').classList.remove('hidden');

      $('currentNetworkSubtitle').textContent = network.name || 'LAN';
      $('currentName').textContent = network.name || '—';
      $('currentSubnet').textContent = network.subnet || '—';
      $('currentIp').textContent = network.myIp || '—';
      $('currentRole').textContent = network.role === 'owner' ? 'Владелец' : 'Участник';

      const owner = network.role === 'owner';
      $('accessBox').classList.toggle('hidden', !owner || !network.joinCode);
      $('leaveLanButton').classList.toggle('hidden', owner);
      $('deleteLanButton').classList.toggle('hidden', !owner);
      $('accessCode').textContent = network.joinCode || '—';

      currentConfig = network.config || '';
      $('configText').value = currentConfig;
      renderDevices(network.devices || []);
    }

    function clearCurrentNetwork() {
      currentNetwork = null;
      currentConfig = '';
      saveActiveNetwork(null);
      updateLanInfo(null, '');

      $('currentNetworkPanel').classList.add('hidden');
      $('networkActionsPanel').classList.add('hidden');
      $('devicesPanel').classList.add('hidden');
      $('accessBox').classList.add('hidden');
      $('configText').value = '';
    }

    function openNetwork(network) {
      renderCurrentNetwork(network);
      window.scrollTo({top:$('currentNetworkPanel').offsetTop - 12, behavior:'smooth'});
    }

    function requirePublicKey() {
      const key = getPublicKey();
      if (!key) {
        updateLanInfo(currentNetwork, 'Не готова');
        updateLanControls();
        return '';
      }

      if (!isValidBase64Key(key)) {
        updateLanInfo(currentNetwork, 'Неверный ключ');
        updateLanControls();
        return '';
      }

      return key;
    }

    function updateLanControls() {
      const valid = isValidBase64Key(getPublicKey());
      $('lanCreateButton').disabled = !valid;
      $('lanJoinButton').disabled = !valid;
      $('refreshLan').disabled = !valid;
    }

    async function createLan() {
      const name = $('lanCreateName').value.trim();
      if (!name) {
        setLanStatus('Введите название сети');
        return;
      }

      const publicKey = requirePublicKey();
      if (!publicKey) return;

      const button = $('lanCreateButton');
      button.disabled = true;

      try {
        const data = await api('lan_create', {public_key:publicKey, name});

        const rawNetwork = data.network || data.result || data;
        let network = normalizeNetwork(rawNetwork, {}, getPublicKey());

        if (!network?.id && data.network_id) {
          network = normalizeNetwork({...data, network_id:data.network_id}, {}, getPublicKey());
        }

        if (!network?.id) throw new Error('Сеть не создана');

        network.role = 'owner';
        network.joinCode = data.join_code || data.joinCode || data.code || network.joinCode || '';

        if (network.joinCode) saveJoinCode(network.id, network.joinCode);
        mergeNetworks([network]);
        renderNetworkList(getLanNetworks());
        renderCurrentNetwork(network);
        updateLanInfo(network, 'Действительный');
      } catch (error) {
        setLanStatus(error?.message || 'Не удалось создать сеть');
      } finally {
        updateLanControls();
      }
    }

    async function joinLan() {
      const joinCode = $('lanJoinCode').value.trim();
      if (!joinCode) {
        setLanStatus('Введите код доступа');
        return;
      }

      const publicKey = requirePublicKey();
      if (!publicKey) return;

      const button = $('lanJoinButton');
      button.disabled = true;

      try {
        const data = await api('lan_join', {public_key:publicKey, join_code:joinCode});

        const rawNetwork = data.network || data.result || data;
        let network = normalizeNetwork(rawNetwork, {}, getPublicKey());

        if (!network?.id && data.network_id) {
          network = normalizeNetwork({...data, network_id:data.network_id}, {}, getPublicKey());
        }

        if (!network?.id) throw new Error('Не удалось подключиться');

        network.role = 'member';
        network.joinCode = joinCode;

        saveJoinCode(network.id, joinCode);
        mergeNetworks([network]);
        renderNetworkList(getLanNetworks());
        renderCurrentNetwork(network);
        $('lanJoinCode').value = '';
        updateLanInfo(network, 'Действительный');
      } catch (error) {
        setLanStatus(error?.message || 'Не удалось подключиться');
      } finally {
        updateLanControls();
      }
    }

    async function refreshLanNetwork() {
      const publicKey = requirePublicKey();
      if (!publicKey) {
        renderNetworkList(getLanNetworks());
        const active = getActiveNetwork();
        if (active) renderCurrentNetwork(active);
        else clearCurrentNetwork();
        return;
      }

      const active = getActiveNetwork();
      const payload = {public_key:publicKey};

      if (active && active.role !== 'owner' && active.id) {
        const joinCode = getJoinCodeForNetwork(active.id) || active.joinCode || '';
        if (joinCode) payload.join_code = joinCode;
      }

      try {
        const data = await api('lan_status', payload);
        const networks = normalizeNetworkCollection(data, publicKey);
        const merged = mergeNetworks(networks);
        renderNetworkList(merged);

        if (!networks.length) {
          if (!active) clearCurrentNetwork();
          return;
        }

        let selected = null;
        if (active?.id) selected = networks.find(item => String(item.id) === String(active.id)) || null;
        if (!selected && networks.length === 1) selected = networks[0];

        if (selected) {
          const oldNetwork = getLanNetworks().find(item => String(item.id) === String(selected.id)) || {};
          const finalNetwork = normalizeNetwork(selected, oldNetwork, publicKey);
          mergeNetworks([finalNetwork]);
          renderNetworkList(getLanNetworks());
          renderCurrentNetwork(finalNetwork);
        }
      } catch (error) {
        renderNetworkList(getLanNetworks());
        if (active) renderCurrentNetwork(active);
        else clearCurrentNetwork();
      }
    }

    async function refreshSelectedNetwork() {
      if (!currentNetwork?.id) {
        await refreshLanNetwork();
        return;
      }

      const publicKey = requirePublicKey();
      if (!publicKey) return;

      const payload = {public_key:publicKey};

      if (currentNetwork.role !== 'owner') {
        const joinCode = getJoinCodeForNetwork(currentNetwork.id) || currentNetwork.joinCode || '';
        if (joinCode) payload.join_code = joinCode;
      }

      try {
        const data = await api('lan_status', payload);
        const networks = normalizeNetworkCollection(data, publicKey);
        const selected = networks.find(item => String(item.id) === String(currentNetwork.id));
        if (!selected) return;

        const oldNetwork = getLanNetworks().find(item => String(item.id) === String(selected.id)) || currentNetwork;
        const mergedNetwork = normalizeNetwork(selected, oldNetwork, publicKey);
        mergeNetworks([mergedNetwork]);
        renderNetworkList(getLanNetworks());
        renderCurrentNetwork(mergedNetwork);
      } catch (error) {
        // Status refresh failures are intentionally silent.
      }
    }

    async function leaveLan() {
      if (!currentNetwork?.id) return;

      const publicKey = requirePublicKey();
      if (!publicKey) return;

      const joinCode = getJoinCodeForNetwork(currentNetwork.id) || currentNetwork.joinCode || '';
      if (!joinCode) {
        setLanStatus('Нет кода доступа для выхода из сети');
        return;
      }

      const button = $('leaveLanButton');
      button.disabled = true;

      try {
        await api('lan_leave', {public_key:publicKey, join_code:joinCode});
        removeJoinCode(currentNetwork.id);

        const networks = getLanNetworks().filter(item => String(item.id) !== String(currentNetwork.id));
        saveLanNetworks(networks);
        clearCurrentNetwork();
        renderNetworkList(networks);
        setLanStatus('Вы вышли из сети', null);
      } catch (error) {
        setLanStatus(error?.message || 'Не удалось выйти из сети');
      } finally {
        updateLanControls();
      }
    }

    async function deleteLan() {
      if (!currentNetwork?.id) return;

      const publicKey = requirePublicKey();
      if (!publicKey) return;

      const button = $('deleteLanButton');
      button.disabled = true;

      try {
        await api('lan_delete', {public_key:publicKey, network_id:currentNetwork.id});
        removeJoinCode(currentNetwork.id);

        const networks = getLanNetworks().filter(item => String(item.id) !== String(currentNetwork.id));
        saveLanNetworks(networks);
        clearCurrentNetwork();
        renderNetworkList(networks);
        setLanStatus('Сеть удалена', null);
      } catch (error) {
        setLanStatus(error?.message || 'Не удалось удалить сеть');
      } finally {
        updateLanControls();
      }
    }

    async function copyText(text, button) {
      if (!text || text === '—') return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      const old = button.textContent;
      button.textContent = 'Готово';
      setTimeout(() => { button.textContent = old; }, 1200);
    }

    function downloadText(filename, text) {
      if (!text) return;
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function formatExpiry(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString('ru-RU');
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes < 0) return null;
      if (bytes === 0) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / (1024 ** index)).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    }

    function formatTraffic(data) {
      const traffic = data?.traffic;

      if (typeof traffic === 'string' && traffic.trim()) return traffic;
      if (typeof traffic === 'number') return formatBytes(traffic) || '—';

      const used = traffic?.used ?? traffic?.usage ?? data?.traffic_used ?? data?.used_traffic ?? data?.bytes_used ?? data?.subscription?.traffic_used;
      const limit = traffic?.limit ?? traffic?.quota ?? data?.traffic_limit ?? data?.traffic_total ?? data?.subscription?.traffic_limit;

      const upload = traffic?.upload ?? traffic?.uploaded ?? data?.upload ?? data?.uploaded;
      const download = traffic?.download ?? traffic?.downloaded ?? data?.download ?? data?.downloaded;

      if (used != null && limit != null) {
        return `${formatBytes(used) || used} / ${formatBytes(limit) || limit}`;
      }

      if (upload != null || download != null) {
        const down = download != null ? (formatBytes(download) || download) : '—';
        const up = upload != null ? (formatBytes(upload) || upload) : '—';
        return `↓${down} ↑${up}`;
      }

      if (used != null) return formatBytes(used) || String(used);
      return '—';
    }

    function setVpnStatus(state, expiry = '—', ping = '—', traffic = '—') {
      $('vpnState').textContent = state;
      $('vpnExpiry').textContent = expiry;
      $('vpnPing').textContent = ping;
      $('vpnTraffic').textContent = traffic;
    }

    function getSavedVpnToken() {
      return localStorage.getItem(LS_VPN_TOKEN) || '';
    }

    function getTokenFromUrl() {
      try {
        const url = new URL(window.location.href);
        const keys = ['token','vpn_token','access_token','subscription_token'];

        for (const key of keys) {
          const value = url.searchParams.get(key);
          if (value) return value.trim();
        }

        const hash = url.hash.replace(/^#/, '');
        const hashParams = new URLSearchParams(hash.includes('=') ? hash : `token=${hash}`);
        for (const key of keys) {
          const value = hashParams.get(key);
          if (value) return value.trim();
        }
      } catch {}

      return '';
    }

    function getHappUrl() {
      return vpnData?.happ_url || vpnData?.subscription_url || vpnData?.happ || vpnData?.url || vpnData?.link || '';
    }

    async function checkVpnToken() {
      const token = $('vpnToken').value.trim();
      const button = $('vpnCheck');

      $('vpnActions').classList.add('hidden');

      if (!token) {
        setVpnStatus('Введите токен', '—', '—', '—');
        return;
      }

      button.disabled = true;
      setVpnStatus('Проверка…', '—', '—', '—');

      try {
        let data;

        try {
          data = await api('vpn_status', {token});
        } catch (firstError) {
          const message = firstError?.message || '';
          if (/unknown action|неизвест|not found/i.test(message)) {
            data = await api('vpn_check', {token});
          } else {
            throw firstError;
          }
        }

        vpnData = data;
        localStorage.setItem(LS_VPN_TOKEN, token);

        const valid = data.valid ?? data.active ?? data.is_active ?? data.subscription_active ?? true;

        if (!valid) {
          setVpnStatus('Неверный токен', '—', '—', '—');
          return;
        }

        const expiry = formatExpiry(
          data.expires_at || data.expire_at || data.expiry || data.expires || data.subscription?.expires_at
        );

        let ping = '—';
        if (data.ping != null) ping = `${data.ping} ms`;
        else if (data.latency != null) ping = `${data.latency} ms`;

        const traffic = formatTraffic(data);

        setVpnStatus(
          data.status === 'disabled' ? 'Отключена' : 'Активна',
          expiry,
          ping,
          traffic
        );


        const happUrl = getHappUrl();
        const actions = $('vpnActions');
        actions.classList.remove('hidden');

        if (happUrl) {
          $('happOpen').classList.remove('hidden');
          $('happDownload').classList.remove('hidden');
          actions.classList.remove('one');
        } else {
          $('happOpen').classList.add('hidden');
          $('happDownload').classList.add('hidden');
          actions.classList.add('one');
        }
      } catch (error) {
        const message = error?.name === 'AbortError' ? 'Нет ответа' : error?.message || 'Нет связи';
        setVpnStatus(message, '—', '—', '—');
      } finally {
        button.disabled = false;
      }
    }

    function restoreVpnToken() {
      const urlToken = getTokenFromUrl();
      const savedToken = getSavedVpnToken();
      const token = urlToken || savedToken;

      if (token) {
        $('vpnToken').value = token;
      }

      setVpnStatus(token ? 'Не проверен' : 'Нет токена', '—', '—', '—');

      if (urlToken) {
        try {
          const url = new URL(window.location.href);
          ['token','vpn_token','access_token','subscription_token'].forEach(key => url.searchParams.delete(key));
          url.hash = '';
          window.history.replaceState({}, document.title, url.toString());
        } catch {}
      }
    }

      $('modeMenu').classList.toggle('open', open);

    $('leaveLanButton').addEventListener('click', leaveLan);

    $('copyConfig').addEventListener('click', () => copyText(currentConfig, $('copyConfig')));

    $('downloadConfig').addEventListener('click', () => {
      if (!currentConfig) return;
      const safeName = (currentNetwork?.name || 'limupy').replace(/[^\wа-яА-ЯёЁ.-]+/g, '_');
      downloadText(`${safeName}.conf`, currentConfig);
    });

    $('vpnCheck').addEventListener('click', checkVpnToken);
    $('vpnToken').addEventListener('keydown', event => {
      if (event.key === 'Enter') checkVpnToken();
    });

    $('happDownload').addEventListener('click', () => {
      const url = getHappUrl();
      if (!url) return;
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    $('happOpen').addEventListener('click', () => {
      const url = getHappUrl();
      if (!url) return;
      window.location.href = url;
    });

    async function init() {
      restoreVpnToken();

      $('lanPublicKey').value = '';
      updateLanControls();
      renderNetworkList(getLanNetworks());

      const active = getActiveNetwork();
      if (active) renderCurrentNetwork(active);
      else updateLanInfo(null, 'Не готова');
    }

    init();
  </script>
</body>
</html>
