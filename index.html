<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    >

    <meta
        name="referrer"
        content="no-referrer"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <title>Limupy VPN</title>

    <meta
        name="description"
        content="VPN-подписка Limupy VPN для клиента HAPP."
    >

    <meta
        property="og:title"
        content="Limupy VPN — VPN-подписка"
    >

    <meta
        property="og:description"
        content="VPN-подписка Limupy VPN для клиента HAPP."
    >

    <meta
        property="og:type"
        content="website"
    >

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1115'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EL%3C/text%3E%3C/svg%3E"
    >

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: #0f1115;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100%;
            min-width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #0f1115;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            padding: 22px;

            overflow: hidden;

            background: #191c22;
            border: 1px solid #252a33;
            border-radius: 22px;

            box-shadow: 0 16px 45px rgba(0, 0, 0, .28);
        }

        .header {
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: #0f1115;
            color: #fff;

            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0;

            font-size: 28px;
            line-height: 1.15;
        }

        .subtitle {
            margin-top: 7px;

            color: #8f97a5;
            font-size: 14px;
        }

        .status {
            margin-top: 20px;
            padding: 14px 15px;

            border-radius: 13px;

            background: #11141a;
            color: #dce1e8;

            font-size: 14px;
            line-height: 1.45;

            text-align: center;
        }

        .status.error {
            background: #251a1e;
            color: #e7c7c7;
        }

        .section {
            margin-top: 12px;
            padding: 15px;

            border-radius: 15px;

            background: #20242c;
        }

        .section-header {
            min-width: 0;

            margin-bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .section-title {
            color: #fff;

            font-size: 14px;
            font-weight: 700;
        }

        .rows {
            display: flex;
            flex-direction: column;
        }

        .row {
            min-height: 38px;

            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1.7fr);

            align-items: center;

            gap: 12px;

            padding: 9px 0;

            border-bottom: 1px solid #2d323b;
        }

        .row:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .label {
            min-width: 0;

            color: #8f97a5;

            font-size: 13px;
        }

        .value {
            min-width: 0;

            color: #fff;

            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;

            text-align: right;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .server-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .server-main {
            color: #fff;

            font-size: 13px;
            line-height: 1.35;

            text-align: right;

            overflow-wrap: anywhere;
        }

        .config-text {
            color: #fff;

            font-size: 12px;
            line-height: 1.4;

            text-align: right;

            overflow-wrap: anywhere;
        }

        .warning {
            margin-top: 12px;
            padding: 14px;

            border-radius: 13px;

            background: #2a2420;
            color: #d8c8bb;

            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;

            gap: 9px;

            margin-top: 14px;
        }

        .button {
            width: 100%;
            min-height: 50px;

            padding: 13px 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 13px;

            text-decoration: none;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .primary {
            background: #fff;
            color: #111;
        }

        .secondary {
            background: #2a2f38;
            color: #fff;
        }

        .button[disabled] {
            opacity: .45;
            cursor: not-allowed;
        }

        @media (max-width: 767px) {
            body {
                align-items: flex-start;

                padding:
                    max(12px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }

            .container {
                max-width: 100%;
            }

            .card {
                padding: 18px;
                border-radius: 19px;
            }

            .logo {
                width: 54px;
                height: 54px;

                font-size: 23px;
            }

            h1 {
                font-size: 25px;
            }

            .section {
                padding: 13px;
            }

            .row {
                grid-template-columns:
                    minmax(78px, .9fr)
                    minmax(0, 1.6fr);

                gap: 10px;
            }

            .label {
                font-size: 12px;
            }

            .value,
            .config-text {
                font-size: 12px;
                text-align: right;
            }

            .server-main {
                font-size: 12px;
            }

            .button {
                min-height: 52px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 16px;
            }

            .section {
                padding: 12px;
            }

            .row {
                grid-template-columns:
                    minmax(70px, .8fr)
                    minmax(0, 1.5fr);

                gap: 8px;
            }

            .label,
            .value,
            .config-text {
                font-size: 11px;
            }
        }

        @media (min-width: 768px) {
            .card {
                padding: 28px 24px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <section class="card">

        <header class="header">
            <div class="logo">L</div>

            <h1>Limupy VPN</h1>

            <div class="subtitle">
                VPN-подписка
            </div>
        </header>


        <div
            class="status"
            id="status"
        >
            Получаем информацию о подписке...
        </div>


        <section class="section">

            <div class="section-header">
                <div class="section-title">
                    Подписка
                </div>
            </div>


            <div class="rows">

                <div class="row">
                    <div class="label">
                        Клиент
                    </div>

                    <div class="value">
                        HAPP
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Сервер
                    </div>

                    <div class="value server-value">
                        <div
                            class="server-main"
                            id="serverMain"
                        >
                            Проверка...
                        </div>
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Конфигурация
                    </div>

                    <div
                        class="config-text"
                        id="configText"
                    >
                        Проверка...
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Осталось
                    </div>

                    <div
                        class="value"
                        id="remaining"
                    >
                        Проверка...
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Использовано
                    </div>

                    <div
                        class="value"
                        id="used"
                    >
                        Проверка...
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Действует до
                    </div>

                    <div
                        class="value"
                        id="expire"
                    >
                        Проверка...
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Устройства
                    </div>

                    <div class="value">
                        1
                    </div>
                </div>

            </div>

        </section>


        <div class="warning">
            Не передавайте ссылку на этот сайт третьим лицам.
        </div>


        <nav class="actions">

            <button
                class="button primary"
                id="open"
                type="button"
                disabled
            >
                Открыть HAPP
            </button>


            <a
                class="button secondary"
                href="https://happ.info/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Скачать HAPP
            </a>

        </nav>

    </section>

</main>


<script src="./app.js" defer></script>


<script>
(() => {

    const elements = {
        status: document.getElementById("status"),
        open: document.getElementById("open"),

        serverMain:
            document.getElementById("serverMain"),

        configText:
            document.getElementById("configText"),

        remaining:
            document.getElementById("remaining"),

        used:
            document.getElementById("used"),

        expire:
            document.getElementById("expire")
    };


    function formatBytes(bytes) {

        if (
            bytes === null ||
            bytes === undefined
        ) {
            return "Нет данных";
        }


        const value = Number(bytes);


        if (!Number.isFinite(value)) {
            return "Нет данных";
        }


        if (value === 0) {
            return "0 Б";
        }


        const units = [
            "Б",
            "КБ",
            "МБ",
            "ГБ",
            "ТБ"
        ];


        const index = Math.min(
            Math.floor(
                Math.log(value) /
                Math.log(1024)
            ),
            units.length - 1
        );


        return (
            value /
            Math.pow(
                1024,
                index
            )
        ).toFixed(
            index > 2
                ? 2
                : 1
        ) +
        " " +
        units[index];
    }


    function formatDate(timestamp) {

        const value = Number(timestamp);


        if (
            !Number.isFinite(value) ||
            value <= 0
        ) {
            return "Нет данных";
        }


        return new Date(
            value * 1000
        ).toLocaleString(
            "ru-RU"
        );
    }


    function setError(message) {

        elements.status.textContent =
            message;

        elements.status.classList.add(
            "error"
        );

        elements.open.disabled = true;
    }


    async function initialize() {

        if (
            !window.Limupy ||
            typeof window.Limupy.collect !==
                "function"
        ) {
            setError(
                "Не удалось загрузить клиент."
            );

            return;
        }


        try {

            const payload =
                await window.Limupy.collect();


            const subscription =
                payload.subscription || {};


            const upstream =
                payload.upstream || {};


            const protocols =
                Array.isArray(
                    subscription.protocols
                )
                    ? subscription.protocols
                    : [];


            elements.status.textContent =
                "Подписка готова.";


            elements.status.classList.remove(
                "error"
            );


            if (
                upstream.available
            ) {

                const rtt =
                    Number(
                        upstream.rtt_ms
                    );


                elements.serverMain.textContent =
                    Number.isFinite(rtt)
                        ? "Finland · Доступен · " +
                          rtt.toFixed(1) +
                          " мс"
                        : "Finland · Доступен";

            } else {

                elements.serverMain.textContent =
                    "Finland · Недоступен";

            }


            elements.configText.textContent =
                protocols.length
                    ? protocols.join(" · ")
                    : "Нет данных";


            if (
                subscription.total_bytes !==
                    null &&
                Number(
                    subscription.total_bytes
                ) === 0
            ) {

                elements.remaining.textContent =
                    "Безлимит";

            } else {

                elements.remaining.textContent =
                    formatBytes(
                        subscription.remaining_bytes
                    );

            }


            elements.used.textContent =
                formatBytes(
                    subscription.used_bytes
                );


            elements.expire.textContent =
                subscription.expire
                    ? formatDate(
                        subscription.expire
                    )
                    : "Нет данных";


            elements.open.disabled =
                false;


            elements.open.onclick =
                () => {

                    try {

                        if (
                            typeof window.Limupy
                                .openHapp !==
                            "function"
                        ) {
                            throw new Error(
                                "Функция HAPP недоступна."
                            );
                        }


                        window.Limupy.openHapp(
                            payload
                        );

                    } catch (error) {

                        setError(
                            error &&
                            error.message
                                ? error.message
                                : "Не удалось открыть HAPP."
                        );

                    }

                };


        } catch (error) {

            setError(
                error &&
                error.message
                    ? error.message
                    : "Не удалось получить данные подписки."
            );

        }

    }


  
    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once: true
            }
        );

    } else {

        initialize();

    }

})();
</script>

</body>
</html>
