<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAPP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #fff;
        }

        .box {
            width: min(90%, 420px);
            padding: 35px 25px;
            text-align: center;
            background: #191c22;
            border-radius: 18px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #aeb4c0;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            border-radius: 10px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>HAPP</h1>
    <p id="status">Открываем приложение...</p>

    <a id="fallback" href="https://happ.info/" style="display:none;">
        Скачать HAPP
    </a>
</div>

<script>
    /*
     * =====================================================
     * НАСТРОЙКИ
     * =====================================================
     */

    // Твоя подписка
    const subscription =
        "http://78.17.112.158:444/DisstVpn/dplgn7904o4cd4cp";

    // Секретный путь.
    //
    // Итоговая ссылка будет:
    //
    // https://happ.example.com/7fK3mP9xQ2vL
    //
    const secretPath = "/7fK3mP9xQ2vL";


    /*
     * =====================================================
     * ПРОВЕРКА СЕКРЕТНОГО URL
     * =====================================================
     */

    const currentPath =
        window.location.pathname.replace(/\/+$/, "");

    if (currentPath !== secretPath) {

        document.getElementById("status").textContent =
            "Страница не найдена.";

    } else {

        const happUrl =
            "happ://add/" + subscription;

        const status =
            document.getElementById("status");

        const fallback =
            document.getElementById("fallback");

        let opened = false;

        /*
         * Пытаемся открыть HAPP.
         */
        window.location.href = happUrl;

        /*
         * Если приложение не открылось,
         * показываем кнопку сайта HAPP.
         */
        setTimeout(function () {

            if (!opened) {

                status.textContent =
                    "Если HAPP не установлен, скачайте его:";

                fallback.style.display =
                    "inline-block";
            }

        }, 1800);
    }
</script>

</body>
</html>
