<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1020">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src https://78.17.112.158; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'"
  >

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236ea8fe'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-size='38' font-weight='800' fill='white'%3EL%3C/text%3E%3C/svg%3E"
  >

  <title>Limupy VPN</title>

  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(20, 27, 48, .9);
      --line: rgba(255,255,255,.08);
      --text: #f4f7fb;
      --muted: #9aa6bd;
      --accent: #6ea8fe;
      --accent-2: #8b7cff;
      --ok: #41d392;
      --bad: #ff657a;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          900px 500px at 10% -10%,
          rgba(110,168,254,.16),
          transparent 55%
        ),
        radial-gradient(
          700px 450px at 100% 0%,
          rgba(139,124,255,.13),
          transparent 50%
        ),
        var(--bg);

      color: var(--text);
      padding: 28px 16px 42px;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );
      color: white;
      font-weight: 800;
      box-shadow:
        0 10px 30px rgba(110,168,254,.24);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .hero {
      padding: 11px 18px;
      border-bottom: 1px solid var(--line);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin: 0;
      min-height: 24px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      min-height: 24px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      background: rgba(255,255,255,.06);
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.ok {
      color: var(--ok);
      background: rgba(65,211,146,.10);
    }

    .status.bad {
      color: var(--bad);
      background: rgba(255,101,122,.10);
    }

    .status.wait {
      color: #c5cde0;
    }

    .rows {
      padding: 6px 22px 14px;
    }

    .row {
      display: grid;
      grid-template-columns:
        minmax(120px, 1fr)
        minmax(0, 1.5fr);
      gap: 18px;
      align-items: center;
      min-height: 62px;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .value {
      text-align: right;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .protocols {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .protocol {
      padding: 6px 9px;
      border-radius: 9px;
      border: 1px solid rgba(110,168,254,.22);
      background: rgba(110,168,254,.10);
      color: #dce9ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .connections {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .connections-count {
      font-weight: 750;
    }

    .ip-list {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
    }

    .ip {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(65,211,146,.08);
      border: 1px solid rgba(65,211,146,.18);
      color: #c9f6df;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .ip-more {
      color: var(--muted);
      font-size: 11px;
      padding: 5px 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 18px 22px 22px;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 16px;
      border-radius: 13px;
      text-decoration: none;
      font-weight: 750;
      font-size: 14px;
      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.primary {
      color: #07101f;
      background:
        linear-gradient(
          135deg,
          #86b8ff,
          #8f84ff
        );
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.07);
      border: 1px solid var(--line);
    }

    .btn[hidden] {
      display: none;
    }

    .footer-note {
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .error {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,101,122,.08);
      border: 1px solid rgba(255,101,122,.18);
      color: #ffd7dd;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error[hidden] {
      display: none;
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 13px 0;
        min-height: auto;
      }

      .value {
        text-align: left;
      }

      .protocols {
        justify-content: flex-start;
      }

      .connections {
        align-items: flex-start;
      }

      .ip-list {
        justify-content: flex-start;
      }

      .header {
        align-items: flex-start;
      }

      .actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="header">
      <div class="brand">
        <div class="logo">L</div>

        <div>
          <h1>Limupy VPN</h1>
          <div class="subtitle">VPN-подписка</div>
        </div>
      </div>
    </div>

    <section
      class="card"
      aria-live="polite"
    >
      <div class="hero">
        <div class="status-row">
          <span class="label">Статус</span>

          <span
            id="status"
            class="status wait"
          >
            Проверка…
          </span>
        </div>
      </div>

      <div class="rows">
        <div class="row">
          <div class="label">Подписка</div>

          <div
            id="subscription"
            class="value"
          >
            —
          </div>
        </div>

        <div class="row">
          <div class="label">Подключено к VPN</div>

          <div
            id="devicesCount"
            class="value"
          >
            —
          </div>
        </div>

        <div class="row">
          <div class="label">Протоколы</div>

          <div
            id="protocols"
            class="value"
          >
            —
          </div>
        </div>

        <div class="row">
          <div class="label">Трафик</div>

          <div
            id="traffic"
            class="value"
          >
            —
          </div>
        </div>

        <div class="row">
          <div class="label">Срок действия</div>

          <div
            id="expire"
            class="value"
          >
            —
          </div>
        </div>

        <div class="row">
          <div class="label">Задержка</div>

          <div
            id="latency"
            class="value"
          >
            —
          </div>
        </div>
      </div>

      <div class="actions">
        <a
          id="happDownload"
          class="btn secondary"
          href="https://happ.info/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Скачать Happ
        </a>

        <a
          id="happConnect"
          class="btn primary"
          href="#"
          rel="noopener noreferrer"
          hidden
        >
          Открыть в Happ
        </a>
      </div>
    </section>

    <div
      id="error"
      class="error"
      hidden
    ></div>

    <div class="footer-note">
      Задержка измеряется непосредственно с вашего устройства до API Limupy.
    </div>
  </main>

  <script>
    'use strict';

    const API_URL = 'https://78.17.112.158/api.php';
    const HAPP_DOWNLOAD_URL = 'https://happ.info/';
    const REQUEST_TIMEOUT_MS = 10000;
    const DEVICE_STORAGE_KEY = 'limupy_device_id_v2';

    const $ = id => document.getElementById(id);

    function getToken() {
      const hash = window.location.hash.replace(/^#/, '');
      const params = new URLSearchParams(hash);
      return (params.get('key') || '').trim();
    }

    function base64Url(bytes) {
      let binary = '';

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    function makeDeviceId() {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      return base64Url(bytes);
    }

    function getDeviceId() {
      let value = localStorage.getItem(DEVICE_STORAGE_KEY);

      if (!value || !/^[A-Za-z0-9._~-]{43}$/.test(value)) {
        value = makeDeviceId();
        localStorage.setItem(DEVICE_STORAGE_KEY, value);
      }

      return value;
    }

    function setStatus(active, text) {
      const el = $('status');

      el.className = 'status ' + (active ? 'ok' : 'bad');
      el.textContent = text;
    }

    function resetFields() {
      $('subscription').textContent = '—';
      $('devicesCount').textContent = '—';
      $('protocols').textContent = '—';
      $('traffic').textContent = '—';
      $('expire').textContent = '—';
      $('latency').textContent = '—';

      $('happConnect').hidden = true;
      $('happConnect').removeAttribute('href');
    }

    function bytes(value) {
      const n = Number(value || 0);

      if (!Number.isFinite(n) || n <= 0) {
        return '0 Б';
      }

      const units = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ'];

      let x = n;
      let i = 0;

      while (x >= 1024 && i < units.length - 1) {
        x /= 1024;
        i++;
      }

      const digits =
        x >= 100
          ? 0
          : x >= 10
            ? 1
            : 2;

      return `${x.toFixed(digits)} ${units[i]}`;
    }

    function trafficText(sub) {
      const total = Number(sub.total_bytes || 0);
      const used = Number(sub.used_bytes || 0);

      if (!total) {
        return `Использовано ${bytes(used)} · без лимита`;
      }

      return `${bytes(used)} из ${bytes(total)}`;
    }

    function expireText(timestamp) {
      const ts = Number(timestamp || 0);

      if (!ts) {
        return 'Бессрочно';
      }

      const d = new Date(
        ts > 1e12
          ? ts
          : ts * 1000
      );

      if (Number.isNaN(d.getTime())) {
        return '—';
      }

      return d.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    function isIPv4(value) {
      const parts = String(value).trim().split('.');

      if (parts.length !== 4) {
        return false;
      }

      return parts.every(part => {
        if (!/^\d+$/.test(part)) {
          return false;
        }

        const n = Number(part);

        return n >= 0 && n <= 255;
      });
    }

    function isIPv6(value) {
      const text = String(value).trim();

      return (
        text.includes(':') &&
        /^[0-9a-fA-F:.]+$/.test(text)
      );
    }

    function isValidIp(value) {
      return isIPv4(value) || isIPv6(value);
    }

    function normalizeIp(value) {
      if (typeof value !== 'string') {
        return null;
      }

      let ip = value.trim();

      const suffixMatch = ip.match(
        /^([0-9a-fA-F:.]+)(?:\s|\(|$)/
      );

      if (suffixMatch) {
        ip = suffixMatch[1];
      }

      return isValidIp(ip) ? ip : null;
    }

    function getIpFromObject(obj) {
      if (!obj || typeof obj !== 'object') {
        return null;
      }

      const candidates = [
        obj.ip,
        obj.IP,
        obj.address,
        obj.addr,
        obj.source_ip,
        obj.sourceIp,
        obj.client_ip,
        obj.clientIp,
        obj.remote_ip,
        obj.remoteIp,
        obj.remote_address,
        obj.remoteAddress,
        obj.last_ip,
        obj.lastIp
      ];

      for (const value of candidates) {
        const ip = normalizeIp(value);

        if (ip) {
          return ip;
        }
      }

      return null;
    }

    function extractConnections(data) {
      const result = new Set();

      const addIp = value => {
        const ip = normalizeIp(value);

        if (ip) {
          result.add(ip);
        }
      };

      const walk = value => {
        if (value == null) {
          return;
        }

        if (typeof value === 'string') {
          addIp(value);
          return;
        }

        if (typeof value !== 'object') {
          return;
        }

        if (Array.isArray(value)) {
          for (const item of value) {
            if (typeof item === 'string') {
              addIp(item);
            } else if (item && typeof item === 'object') {
              const directIp = getIpFromObject(item);

              if (directIp) {
                addIp(directIp);
              }

              walkObjectFields(item);
            }
          }

          return;
        }

        walkObjectFields(value);
      };

      const walkObjectFields = obj => {
        const directIp = getIpFromObject(obj);

        if (directIp) {
          addIp(directIp);
        }

        const nestedKeys = [
          'ips',
          'ip_addresses',
          'ipAddresses',
          'connected_ips',
          'connectedIPs',
          'online_ips',
          'onlineIPs',
          'active_ips',
          'activeIPs',
          'connections',
          'online_connections',
          'onlineConnections',
          'vpn_connections',
          'vpnConnections',
          'connected_devices',
          'connectedDevices',
          'vpn_devices',
          'vpnDevices',
          'connected_clients',
          'connectedClients',
          'online_clients',
          'onlineClients',
          'clients',
          'sessions',
          'peers',
          'addresses'
        ];

        for (const key of nestedKeys) {
          if (obj[key] != null) {
            walk(obj[key]);
          }
        }
      };

      const candidates = [
        data.vpn_connections,
        data.vpnConnections,
        data.connected_ips,
        data.connectedIPs,
        data.online_ips,
        data.onlineIPs,
        data.active_ips,
        data.activeIPs,
        data.connections,
        data.online_connections,
        data.onlineConnections,
        data.connected_devices,
        data.connectedDevices,
        data.vpn_devices,
        data.vpnDevices,
        data.connected_clients,
        data.connectedClients,
        data.online_clients,
        data.onlineClients,
        data.sessions,
        data.subscription?.vpn_connections,
        data.subscription?.connections,
        data.subscription?.connected_ips,
        data.subscription?.online_ips,
        data.subscription?.connected_devices,
        data.subscription?.vpn_devices,
        data.subscription?.sessions,
        data.connection?.vpn_connections,
        data.connection?.connections,
        data.connection?.connected_ips,
        data.connection?.online_ips,
        data.connection?.connected_devices,
        data.connection?.sessions,
        data.device?.connections,
        data.device?.connected_devices,
        data.device?.sessions,
        data.device?.ips,
        data.devices
      ];

      for (const candidate of candidates) {
        walk(candidate);
      }

      return [...result];
    }

    function getExplicitConnectionCount(data) {
      const candidates = [
        data.vpn_connected_devices_count,
        data.connected_vpn_devices_count,
        data.vpn_devices_count,
        data.active_vpn_devices_count,
        data.vpn_connections_count,
        data.connected_devices_count,
        data.connectedDevicesCount,
        data.active_devices_count,
        data.activeDevicesCount,
        data.connections_count,
        data.connectionsCount,
        data.online_count,
        data.connected_count,
        data.device_count,
        data.devices_count,
        data.subscription?.vpn_connected_devices_count,
        data.subscription?.connected_vpn_devices_count,
        data.subscription?.vpn_devices_count,
        data.subscription?.active_vpn_devices_count,
        data.subscription?.vpn_connections_count,
        data.subscription?.connected_devices_count,
        data.subscription?.active_devices_count,
        data.subscription?.connections_count,
        data.subscription?.online_count,
        data.connection?.vpn_connected_devices_count,
        data.connection?.connected_devices_count,
        data.connection?.active_devices_count,
        data.connection?.connections_count,
        data.connection?.online_count,
        data.device?.connected_devices_count,
        data.device?.active_devices_count,
        data.device?.connections_count,
        data.device?.online_count
      ];

      for (const value of candidates) {
        if (
          typeof value === 'number' &&
          Number.isFinite(value) &&
          value >= 0
        ) {
          return Math.floor(value);
        }

        if (
          typeof value === 'string' &&
          value.trim() !== '' &&
          Number.isFinite(Number(value))
        ) {
          return Math.max(
            0,
            Math.floor(Number(value))
          );
        }
      }

      return null;
    }

    function getConnectionArrayCount(data) {
      const candidates = [
        data.connected_devices,
        data.connectedDevices,
        data.vpn_devices,
        data.vpnDevices,
        data.sessions,
        data.subscription?.connected_devices,
        data.subscription?.vpn_devices,
        data.subscription?.sessions,
        data.connection?.connected_devices,
        data.connection?.sessions,
        data.device?.connections,
        data.device?.sessions
      ];

      for (const value of candidates) {
        if (Array.isArray(value)) {
          return value.length;
        }
      }

      return null;
    }

    function pluralizeDevices(count) {
      const mod10 = count % 10;
      const mod100 = count % 100;

      if (
        mod10 === 1 &&
        mod100 !== 11
      ) {
        return 'устройство';
      }

      if (
        mod10 >= 2 &&
        mod10 <= 4 &&
        (
          mod100 < 10 ||
          mod100 >= 20
        )
      ) {
        return 'устройства';
      }

      return 'устройств';
    }

    function clearChildren(el) {
      while (el.firstChild) {
        el.removeChild(el.firstChild);
      }
    }

    function renderConnections(data) {
      const ips = extractConnections(data);

      let count = getExplicitConnectionCount(data);

      if (count === null) {
        count = getConnectionArrayCount(data);
      }

      if (count === null && ips.length > 0) {
        count = ips.length;
      }

      clearChildren($('devicesCount'));

      if (count === null) {
        $('devicesCount').textContent = '—';
        return;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'connections';

      const countEl = document.createElement('div');
      countEl.className = 'connections-count';
      countEl.textContent =
        `${count} ${pluralizeDevices(count)}`;

      wrapper.appendChild(countEl);

      if (ips.length > 0) {
        const ipList = document.createElement('div');
        ipList.className = 'ip-list';

        const visible = ips.slice(0, 8);

        for (const ip of visible) {
          const ipEl = document.createElement('span');
          ipEl.className = 'ip';
          ipEl.textContent = ip;
          ipList.appendChild(ipEl);
        }

        if (ips.length > 8) {
          const moreEl = document.createElement('span');
          moreEl.className = 'ip-more';
          moreEl.textContent = `+${ips.length - 8}`;
          ipList.appendChild(moreEl);
        }

        wrapper.appendChild(ipList);
      }

      $('devicesCount').appendChild(wrapper);
    }

    function renderProtocols(protocols) {
      const arr = Array.isArray(protocols)
        ? protocols
        : String(protocols || '')
            .split(',')
            .map(s => s.trim())
            .filter(Boolean);

      clearChildren($('protocols'));

      if (!arr.length) {
        $('protocols').textContent = '—';
        return;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'protocols';

      for (const protocol of arr) {
        const item = document.createElement('span');
        item.className = 'protocol';
        item.textContent = String(protocol);
        wrapper.appendChild(item);
      }

      $('protocols').appendChild(wrapper);
    }

    function isAllowedHappUrl(value) {
      try {
        const url = new URL(value);

        return (
          url.protocol === 'https:' ||
          url.protocol === 'happ:'
        );
      } catch (_) {
        return false;
      }
    }

    async function postApi(token) {
      const controller = new AbortController();

      const timeout = setTimeout(
        () => controller.abort(),
        REQUEST_TIMEOUT_MS
      );

      try {
        return await fetch(
          API_URL,
          {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            credentials: 'omit',
            redirect: 'error',
            signal: controller.signal,
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              device_id: getDeviceId()
            })
          }
        );
      } finally {
        clearTimeout(timeout);
      }
    }

    async function fetchSubscription(token) {
      const res = await postApi(token);

      let data = null;

      try {
        data = await res.json();
      } catch (_) {
        data = null;
      }

      return {
        res,
        data
      };
    }

    async function measureBrowserLatency(token) {
      const samples = [];

      for (let i = 0; i < 3; i++) {
        const start = performance.now();

        try {
          const res = await postApi(token);

          await res.arrayBuffer();

          if (res.ok) {
            samples.push(
              performance.now() - start
            );
          }
        } catch (_) {}
      }

      if (!samples.length) {
        return null;
      }

      samples.sort((a, b) => a - b);

      return samples[
        Math.floor(samples.length / 2)
      ];
    }

    function showApiError(status, data) {
      $('error').hidden = false;

      if (
        data &&
        typeof data.error === 'string'
      ) {
        $('error').textContent = data.error;
        return;
      }

      switch (status) {
        case 400:
          $('error').textContent =
            'API отклонил запрос: проверьте формат данных и идентификатор устройства.';
          break;

        case 401:
          $('error').textContent =
            'Подписка отключена или ключ больше не действителен.';
          break;

        case 403:
          $('error').textContent =
            'Запрос отклонён сервером по политике доступа.';
          break;

        case 405:
          $('error').textContent =
            'Ошибка метода API: сервер ожидает POST-запрос.';
          break;

        case 415:
          $('error').textContent =
            'API отклонил формат запроса. Ожидается JSON.';
          break;

        default:
          $('error').textContent =
            `Не удалось получить данные подписки. HTTP ${status}.`;
      }
    }

    function renderActive(data) {
      const sub = data.subscription || {};

      const subscriptionName =
        data.subscription_name ||
        sub.name ||
        data.name ||
        'VPN-подписка';

      $('subscription').textContent =
        subscriptionName;

      renderConnections(data);

      renderProtocols(
        sub.protocols ||
        data.protocols ||
        []
      );

      $('traffic').textContent =
        trafficText(sub);

      $('expire').textContent =
        expireText(sub.expire);

      if (
        typeof data.launch_url === 'string' &&
        isAllowedHappUrl(data.launch_url)
      ) {
        $('happConnect').href =
          data.launch_url;

        $('happConnect').hidden = false;
      }
    }

    async function load() {
      $('error').hidden = true;
      $('error').textContent = '';

      resetFields();

      $('status').className =
        'status wait';

      $('status').textContent =
        'Проверка…';

      const token = getToken();

      if (!token) {
        setStatus(false, 'Не активно');

        $('error').hidden = false;

        $('error').textContent =
          'Ссылка не содержит ключ подписки. Откройте персональную ссылку из Limupy.';

        return;
      }

      try {
        const { res, data } =
          await fetchSubscription(token);

        if (
          !res.ok ||
          !data ||
          data.ok === false
        ) {
          setStatus(false, 'Не активно');

          showApiError(
            res.status,
            data
          );

          return;
        }

        if (
          data.subscription &&
          (
            data.subscription.enabled === false ||
            data.subscription.active === false
          )
        ) {
          setStatus(false, 'Не активно');

          $('error').hidden = false;

          $('error').textContent =
            'Эта VPN-подписка отключена.';

          return;
        }

        setStatus(true, 'Активно');

        renderActive(data);

        const latency =
          await measureBrowserLatency(token);

        $('latency').textContent =
          latency == null
            ? '—'
            : `${Math.max(
                1,
                Math.round(latency)
              )} мс`;
      } catch (error) {
        setStatus(false, 'Не активно');

        $('error').hidden = false;

        if (
          error &&
          error.name === 'AbortError'
        ) {
          $('error').textContent =
            'Сервер не ответил вовремя. Попробуйте обновить страницу.';
        } else {
          $('error').textContent =
            'Нет связи с сервером подписки. Проверьте соединение и попробуйте обновить страницу.';
        }
      }
    }

    window.addEventListener(
      'hashchange',
      load
    );

    window.addEventListener(
      'load',
      () => {
        $('happDownload').href =
          HAPP_DOWNLOAD_URL;

        load();
      }
    );
  </script>
</body>
</html>
