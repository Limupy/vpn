<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src https://78.17.112.158; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'; frame-src 'none'"
  >
  <title>Limupy</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:#11141b;
      --panel-2:#151923;
      --line:#262b36;
      --text:#f5f7fb;
      --muted:#8f97a8;
      --danger:#ff6868;
      --success:#67d391;
      --shadow:0 20px 60px rgba(0,0,0,.28);
      --radius:18px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{min-height:100vh}
    button,input,textarea{font:inherit}
    button{border:0;cursor:pointer}

    .app{
      width:min(700px,100%);
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .mode-wrap{position:relative}

    .mode-button{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:40px;
      padding:0 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      color:var(--text);
      font-weight:700;
    }

    .mode-button svg{width:15px;height:15px;opacity:.7}

    .mode-menu{
      position:absolute;
      right:0;
      top:48px;
      z-index:30;
      width:170px;
      padding:6px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      display:none;
    }

    .mode-menu.open{display:block}

    .mode-option{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:11px 12px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      text-align:left;
    }

    .mode-option:hover{background:#1b202b}
    .mode-option.active{background:#202631}
    .mode-option span:last-child{color:var(--muted);font-size:12px}

    .page{display:none}
    .page.active{display:block}

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel + .panel{margin-top:12px}

    .panel-head{
      padding:18px 18px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panel-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .panel-subtitle{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .panel-body{padding:18px}

    .mode-label{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .mode-value{
      font-size:30px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .status-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:16px;
    }

    .status-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      min-width:0;
    }

    .status-item-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px;
    }

    .status-item-value{
      font-size:14px;
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .input-row{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:stretch;
    }

    .input-row #vpnCheck{
      min-height:46px;
      height:46px;
      width:100%;
      align-self:stretch;
      font-size:16px;
      font-weight:800;
    }

    .input{
      width:100%;
      height:46px;
      min-height:46px;
      padding:0 14px;
      text-align:left;
      line-height:normal;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      outline:none;
      color:var(--text);
    }

    .input:focus{border-color:#454d5d}
    .input::placeholder{color:#687080}

    .btn{
      min-height:46px;
      padding:0 16px;
      border-radius:12px;
      font-weight:750;
      transition:.18s ease;
      white-space:nowrap;
    }

    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:#fff;color:#111}
    .vpn-check-btn{
      min-height:56px;
      height:56px;
    }

    .btn-primary:hover:not(:disabled){background:#e9ebef}
    .btn-secondary{
      background:var(--panel-2);
      border:1px solid var(--line);
      color:var(--text)
    }

    .btn-secondary:hover:not(:disabled){background:#1a1f29}

    .btn-danger{
      background:rgba(255,104,104,.08);
      border:1px solid rgba(255,104,104,.22);
      color:var(--danger)
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .actions.one{grid-template-columns:1fr}

    .notice{
      margin-top:10px;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
      background:var(--panel-2);
    }

    .notice.error{
      color:var(--muted);
      border-color:var(--line);
      background:var(--panel-2)
    }

    .notice.success{
      color:#a3e9ba;
      border-color:rgba(103,211,145,.22);
      background:rgba(103,211,145,.05)
    }

    .lan-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      padding:5px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:13px;
      margin-bottom:12px;
    }

    .lan-tab{
      min-height:38px;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      font-weight:700;
    }

    .lan-tab.active{
      background:#202631;
      color:var(--text)
    }

    .lan-form{display:none}
    .lan-form.active{display:block}

    .field{margin-bottom:12px}

    .field-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:7px;
      display:block;
    }

    .floating-field{
      position:relative;
      padding-top:5px;
    }

    .floating-field .field-label{
      position:absolute;
      top:0;
      left:12px;
      z-index:1;
      margin:0;
      padding:0 5px;
      background:var(--panel);
      transform:translateY(-50%);
      line-height:1;
    }

    .floating-field .input{
      min-height:52px;
      height:52px;
      padding:0 14px;
      line-height:normal;
    }

    .input-field-grow{
      flex:1;
      margin-bottom:0;
      min-width:0;
    }

    .input-field-grow .field-label{
      background:var(--panel);
    }

    .input-row > .btn{
      flex:0 0 auto;
      align-self:stretch;
    }

    .key-row{
      display:flex;
      gap:10px;
      align-items:stretch;
    }

    .key-row .input{min-width:0}

    .mini-btn{
      flex:0 0 auto;
      min-height:40px;
      padding:8px 10px;
      border-radius:9px;
      background:#202631;
      color:var(--text);
      border:1px solid var(--line);
      font-size:12px;
      font-weight:700;
    }

    .network-list{display:grid;gap:8px}

    .network-item{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      text-align:left;
      padding:13px 14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      color:var(--text);
      border-radius:12px;
    }

    .network-item:hover{background:#191e27}
    .network-main{min-width:0}
    .network-name{
      font-weight:750;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }

    .network-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:11px
    }

    .network-arrow{
      color:var(--muted);
      font-size:18px
    }

    .current-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .current-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
    }

    .current-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px
    }

    .current-value{
      font-weight:700;
      font-size:14px;
      word-break:break-word
    }

    .access-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:14px;
    }

    .access-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px
    }

    .access-title{
      font-size:12px;
      color:var(--muted)
    }

    .access-code{
      padding:11px 12px;
      border-radius:10px;
      border:1px dashed #3a4250;
      background:#0f1218;
      color:var(--text);
      font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.04em;
      word-break:break-all;
      user-select:text;
    }

    .config-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel-2);
    }

    .config-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px
    }

    .config-title{
      font-weight:750;
      font-size:13px
    }

    .config-actions{
      display:flex;
      gap:8px
    }

    .config-text{
      width:100%;
      min-height:220px;
      resize:vertical;
      padding:12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0c0f14;
      color:#d9dde5;
      font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
      outline:none;
    }

    .devices{display:grid;gap:8px}

    .device{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 13px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:12px;
    }

    .device-main{min-width:0}

    .device-name{
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }

    .device-sub{
      margin-top:4px;
      color:var(--muted);
      font-size:11px
    }

    .device-state{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:11px;
      color:var(--muted);
      flex:0 0 auto
    }

    .device-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#666e7d
    }

    .device-dot.online{
      background:var(--success)
    }

    .empty{
      padding:18px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:12px;
      font-size:12px;
    }

    .hidden{display:none !important}

    @media (max-width:700px){
      .status-grid{
        grid-template-columns:repeat(2,minmax(0,1fr))
      }
    }

    @media (max-width:620px){
      .app{
        padding:16px 12px 28px
      }

      .input-row{
        flex-direction:column
      }

      .actions{
        grid-template-columns:1fr
      }

      .config-head{
        align-items:flex-start;
        flex-direction:column
      }

      .config-actions{
        width:100%
      }

      .config-actions .mini-btn{
        flex:1
      }

      .key-row{
        flex-direction:column
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Limupy</div>

      <div class="mode-wrap">
        <button
          class="mode-button"
          id="modeButton"
          type="button"
          aria-expanded="false"
        >
          <span id="modeButtonText">VPN</span>

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        <div class="mode-menu" id="modeMenu">
          <button
            class="mode-option active"
            data-mode="vpn"
            type="button"
          >
            <span>VPN</span>
            <span>Сервис</span>
          </button>

          <button
            class="mode-option"
            data-mode="lan"
            type="button"
          >
            <span>LAN</span>
            <span>Сеть</span>
          </button>
        </div>
      </div>
    </div>

    <main>
      <section class="page active" id="pageVpn">
        <div class="panel">
          <div class="panel-body">
            <div class="mode-value">VPN</div>

            <div class="status-grid">
              <div class="status-item">
                <div class="status-item-label">Срок</div>
                <div class="status-item-value" id="vpnExpiry">—</div>
              </div>

              <div class="status-item">
                <div class="status-item-label">Пинг</div>
                <div class="status-item-value" id="vpnPing">—</div>
              </div>

              <div class="status-item">
                <div class="status-item-label">Статус</div>
                <div class="status-item-value" id="vpnState">—</div>
              </div>

              <div class="status-item">
                <div class="status-item-label">Трафик</div>
                <div class="status-item-value" id="vpnTraffic">—</div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Токен</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="input-row">
              <div class="field floating-field input-field-grow">
                <label
                  class="field-label"
                  for="vpnToken"
                >
                  Токен
                </label>

                <input
                  class="input"
                  id="vpnToken"
                  type="text"
                  placeholder="Введите токен"
                  autocomplete="off"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                  maxlength="4096"
                >
              </div>

              <button
                class="btn btn-primary vpn-check-btn"
                id="vpnCheck"
                type="button"
              >
                Проверить
              </button>
            </div>

            <div
              class="actions one hidden"
              id="vpnActions"
            >
              <button
                class="btn btn-secondary"
                id="happOpen"
                type="button"
              >
                Открыть в Happ
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="page" id="pageLan">
        <div class="panel">
          <div class="panel-body">
            <div class="mode-value">LAN</div>

            <div class="status-grid">
              <div class="status-item">
                <div class="status-item-label">Статус</div>
                <div
                  class="status-item-value"
                  id="lanInfoStatus"
                >
                  Не готова
                </div>
              </div>

              <div class="status-item">
                <div class="status-item-label">Подсеть</div>
                <div
                  class="status-item-value"
                  id="lanInfoSubnet"
                >
                  —
                </div>
              </div>

              <div class="status-item">
                <div class="status-item-label">IP</div>
                <div
                  class="status-item-value"
                  id="lanInfoIp"
                >
                  —
                </div>
              </div>

              <div class="status-item">
                <div class="status-item-label">Роль</div>
                <div
                  class="status-item-value"
                  id="lanInfoRole"
                >
                  —
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Подключение</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="lan-tabs">
              <button
                class="lan-tab active"
                data-lan-tab="create"
                type="button"
              >
                Создать
              </button>

              <button
                class="lan-tab"
                data-lan-tab="join"
                type="button"
              >
                Подключить
              </button>
            </div>

            <div class="field floating-field">
              <label
                class="field-label"
                for="lanPublicKey"
              >
                Ключ
              </label>

              <input
                class="input"
                id="lanPublicKey"
                type="text"
                placeholder="Введите ключ"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                maxlength="44"
              >
            </div>

            <div
              class="lan-form active"
              id="lanCreateForm"
            >
              <div class="field floating-field">
                <label
                  class="field-label"
                  for="lanCreateName"
                >
                  Название
                </label>

                <input
                  class="input"
                  id="lanCreateName"
                  type="text"
                  maxlength="64"
                  placeholder="Введите название"
                  autocomplete="off"
                >
              </div>

              <div class="actions one">
                <button
                  class="btn btn-primary"
                  id="lanCreateButton"
                  type="button"
                >
                  Создать
                </button>
              </div>
            </div>

            <div
              class="lan-form"
              id="lanJoinForm"
            >
              <div class="field floating-field">
                <label
                  class="field-label"
                  for="lanJoinCode"
                >
                  Код
                </label>

                <input
                  class="input"
                  id="lanJoinCode"
                  type="text"
                  maxlength="128"
                  placeholder="Введите код"
                  autocomplete="off"
                  autocapitalize="characters"
                  autocorrect="off"
                  spellcheck="false"
                >
              </div>

              <div class="actions one">
                <button
                  class="btn btn-primary"
                  id="lanJoinButton"
                  type="button"
                >
                  Подключить
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="panel"
          id="myNetworksPanel"
        >
          <div class="panel-head">
            <div>
              <div class="panel-title">Мои сети</div>
            </div>

            <button
              class="mini-btn"
              id="refreshLan"
              type="button"
            >
              Обновить
            </button>
          </div>

          <div class="panel-body">
            <div
              class="network-list"
              id="networkList"
            ></div>
          </div>
        </div>

        <div
          class="panel hidden"
          id="currentNetworkPanel"
        >
          <div class="panel-head">
            <div>
              <div class="panel-title">Текущая сеть</div>
              <div
                class="panel-subtitle"
                id="currentNetworkSubtitle"
              >
                —
              </div>
            </div>
          </div>

          <div class="panel-body">
            <div class="current-grid">
              <div class="current-item">
                <div class="current-label">Имя</div>
                <div
                  class="current-value"
                  id="currentName"
                >
                  —
                </div>
              </div>

              <div class="current-item">
                <div class="current-label">Подсеть</div>
                <div
                  class="current-value"
                  id="currentSubnet"
                >
                  —
                </div>
              </div>

              <div class="current-item">
                <div class="current-label">Мой IP</div>
                <div
                  class="current-value"
                  id="currentIp"
                >
                  —
                </div>
              </div>

              <div class="current-item">
                <div class="current-label">Роль</div>
                <div
                  class="current-value"
                  id="currentRole"
                >
                  —
                </div>
              </div>
            </div>

            <div
              class="access-box hidden"
              id="accessBox"
            >
              <div class="access-head">
                <div class="access-title">
                  Код для гостей
                </div>

                <button
                  class="mini-btn"
                  id="copyAccessCode"
                  type="button"
                >
                  Копировать
                </button>
              </div>

              <div
                class="access-code"
                id="accessCode"
              >
                —
              </div>
            </div>

            <div class="config-box">
              <div class="config-head">
                <div class="config-title">
                  WireGuard
                </div>

                <div class="config-actions">
                  <button
                    class="mini-btn"
                    id="copyConfig"
                    type="button"
                  >
                    Копировать
                  </button>

                  <button
                    class="mini-btn"
                    id="downloadConfig"
                    type="button"
                  >
                    Скачать
                  </button>
                </div>
              </div>

              <textarea
                class="config-text"
                id="configText"
                readonly
                spellcheck="false"
                autocomplete="off"
              ></textarea>
            </div>
          </div>
        </div>

        <div
          class="panel hidden"
          id="devicesPanel"
        >
          <div class="panel-head">
            <div>

  <script>
    'use strict';

    const API_URL='https://78.17.112.158/api.php';
    const REQUEST_TIMEOUT_MS=10000;
    const VPN_TOKEN_MAX_LENGTH=4096;
    const LAN_NAME_MAX_LENGTH=64;
    const LAN_JOIN_CODE_MAX_LENGTH=128;
    const DEVICE_NAME='Limupy Web';
    const SS_VPN_TOKEN='__limupy_vpn_token';
    const SS_VPN_HISTORY_TOKEN='__limupy_vpn_history_token';
    const SS_ACTIVE_NETWORK='limupy_active_network';
    const SS_LAN_NETWORKS='limupy_lan_networks';
    const SS_LAN_JOIN_CODES='limupy_lan_join_codes';
    const SS_DEVICE_ID='limupy_device_id';
    const ALLOWED_HAPP_HOST='78.17.112.158';

    let currentMode='vpn';
    let currentLanTab='create';
    let currentNetwork=null;
    let currentConfig='';
    let vpnData=null;
    let deviceId='';

    const $=id=>document.getElementById(id);

    function readSessionValue(key,fallback=''){
      try{
        const value=sessionStorage.getItem(key);
        return value==null?fallback:value;
      }catch{
        return fallback;
      }
    }

    function writeSessionValue(key,value){
      try{
        sessionStorage.setItem(key,String(value));
      }catch{}
    }

    function removeSessionValue(key){
      try{
        sessionStorage.removeItem(key);
      }catch{}
    }

    function readSessionJson(key,fallback){
      try{
        const raw=sessionStorage.getItem(key);
        if(!raw)return fallback;
        const parsed=JSON.parse(raw);
        return parsed??fallback;
      }catch{
        return fallback;
      }
    }

    function writeSessionJson(key,value){
      try{
        sessionStorage.setItem(key,JSON.stringify(value));
      }catch{}
    }

    function bytesToBase64Url(bytes){
      let binary='';
      for(const byte of bytes){
        binary+=String.fromCharCode(byte);
      }
      return btoa(binary)
        .replace(/\+/g,'-')
        .replace(/\//g,'_')
        .replace(/=+$/g,'');
    }

    function getDeviceId(){
      if(deviceId)return deviceId;

      const stored=readSessionValue(
        SS_DEVICE_ID,
        ''
      ).trim();

      if(stored){
        deviceId=stored;
        return deviceId;
      }

      const bytes=new Uint8Array(32);
      crypto.getRandomValues(bytes);

      deviceId=bytesToBase64Url(bytes);

      writeSessionValue(
        SS_DEVICE_ID,
        deviceId
      );

      return deviceId;
    }

    async function api(action,payload={}){
      const controller=new AbortController();

      const timeout=setTimeout(
        ()=>controller.abort(),
        REQUEST_TIMEOUT_MS
      );

      try{
        const response=await fetch(
          API_URL,
          {
            method:'POST',
            mode:'cors',
            cache:'no-store',
            credentials:'omit',
            redirect:'error',
            referrerPolicy:'no-referrer',
            signal:controller.signal,
            headers:{
              Accept:'application/json',
              'Content-Type':'application/json'
            },
            body:JSON.stringify({
              action,
              device_id:getDeviceId(),
              ...payload
            })
          }
        );

        const text=await response.text();

        let data=null;

        try{
          data=text?JSON.parse(text):null;
        }catch{
          data=null;
        }

        if(!response.ok){
          throw new Error(
            data?.message||
            data?.error||
            `Ошибка API ${response.status}`
          );
        }

        if(
          data &&
          (
            data.success===false||
            data.ok===false
          )
        ){
          throw new Error(
            data.message||
            data.error||
            'Ошибка API'
          );
        }

        if(!data){
          throw new Error(
            'Сервер вернул пустой ответ'
          );
        }

        return data;
      }finally{
        clearTimeout(timeout);
      }
    }

    async function vpnRequest(token){
      const controller=new AbortController();

      const timeout=setTimeout(
        ()=>controller.abort(),
        REQUEST_TIMEOUT_MS
      );

      const started=performance.now();

      try{
        const response=await fetch(
          API_URL,
          {
            method:'POST',
            mode:'cors',
            cache:'no-store',
            credentials:'omit',
            redirect:'error',
            referrerPolicy:'no-referrer',
            signal:controller.signal,
            headers:{
              Authorization:`Bearer ${token}`,
              Accept:'application/json',
              'Content-Type':'application/json'
            },
            body:JSON.stringify({
              device_id:getDeviceId()
            })
          }
        );

        const elapsed=performance.now()-started;
        const text=await response.text();

        let data=null;

        try{
          data=text?JSON.parse(text):null;
        }catch{
          data=null;
        }

        return{
          response,
          data,
          elapsed
        };
      }finally{
        clearTimeout(timeout);
      }
    }

    async function vpnActionFallback(token){
      try{
        return await api(
          'vpn_status',
          {token}
        );
      }catch(firstError){
        const message=String(
          firstError?.message||''
        );

        if(
          /unknown action|неизвест|not found|404/i.test(
            message
          )
        ){
          return await api(
            'vpn_check',
            {token}
          );
        }

        throw firstError;
      }
    }

    function getVpnHistoryToken(){
      try{
        const state=
          window.history&&
          window.history.state;

        if(
          !state||
          typeof state!=='object'
        ){
          return '';
        }

        const value=
          state[SS_VPN_HISTORY_TOKEN];

        return typeof value==='string'
          ?value.trim()
          :'';
      }catch{
        return '';
      }
    }

    function saveVpnHistoryToken(token){
      if(
        !window.history||
        typeof window.history.replaceState!=='function'
      ){
        return;
      }

      try{
        const currentState=
          window.history.state&&
          typeof window.history.state==='object'
            ?window.history.state
            :{};

        window.history.replaceState(
          {
            ...currentState,
            [SS_VPN_HISTORY_TOKEN]:token
          },
          '',
          window.location.href
        );
      }catch{}
    }

    function saveVpnToken(token){
      if(!token)return;

      writeSessionValue(
        SS_VPN_TOKEN,
        token
      );

      saveVpnHistoryToken(
        token
      );
    }

    function getSavedVpnToken(){
      return readSessionValue(
        SS_VPN_TOKEN,
        ''
      ).trim();
    }

    function clearVpnToken(){
      removeSessionValue(
        SS_VPN_TOKEN
      );
    }

    function getTokenFromUrl(){
      try{
        const url=new URL(
          window.location.href
        );

        const queryToken=
          url.searchParams.get('key');

        if(queryToken){
          return queryToken.trim();
        }

        const hash=
          url.hash.replace(/^#/,'');
        const hashParams=
          new URLSearchParams(hash);
        const hashToken=
          hashParams.get('key');

        if(hashToken){
          return hashToken.trim();
        }

        if(
          hash&&
          !hash.includes('=')&&
          hash.length<=VPN_TOKEN_MAX_LENGTH
        ){
          return hash.trim();
        }
      }catch{}

      return '';
    }

    function removeTokenFromUrl(){
      try{
        const url=new URL(
          window.location.href
        );

        url.searchParams.delete('key');
        url.hash='';

        window.history.replaceState(
          {},
          document.title,
          url.toString()
        );
      }catch{}
    }

    function getInitialVpnToken(){
      const urlToken=
        getTokenFromUrl();

      if(urlToken){
        saveVpnToken(urlToken);
        removeTokenFromUrl();
        return urlToken;
      }

      const historyToken=
        getVpnHistoryToken();

      if(historyToken){
        return historyToken;
      }

      return getSavedVpnToken();
    }

    function formatExpiry(value){
      if(
        value===null||
        value===undefined||
        value===''
      ){
        return '—';
      }

      let date;

      if(
        typeof value==='number'||
        /^\d+$/.test(String(value))
      ){
        const numeric=Number(value);

        date=new Date(
          numeric>1e12
            ?numeric
            :numeric*1000
        );
      }else{
        date=new Date(String(value));
      }

      if(
        Number.isNaN(date.getTime())
      ){
        return String(value);
      }

      return date.toLocaleDateString(
        'ru-RU'
      );
    }

    function formatBytes(value){
      const bytes=Number(value);

      if(
        !Number.isFinite(bytes)||
        bytes<0
      ){
        return null;
      }

      if(bytes===0){
        return '0 B';
      }

      const units=[
        'B',
        'KB',
        'MB',
        'GB',
        'TB'
      ];

      const index=Math.min(
        Math.floor(
          Math.log(bytes)/
          Math.log(1024)
        ),
        units.length-1
      );

      return `${(
        bytes/
        (1024**index)
      ).toFixed(
        index===0?0:1
      )} ${units[index]}`;
    }

    function formatTraffic(data){
      const subscription=
        data?.subscription||{};

      const traffic=
        data?.traffic||
        subscription.traffic||
        {};

      if(
        typeof traffic==='string'&&
        traffic.trim()
      ){
        const normalized=
          traffic.trim().toLowerCase();

        if(
          normalized==='0 b'||
          normalized==='0б'||
          normalized==='0 б'
        ){
          return 'Безлимит';
        }

        return traffic.trim();
      }

      if(
        typeof traffic==='number'
      ){
        return traffic===0
          ?'Безлимит'
          :(formatBytes(traffic)||'—');
      }

      const used=
        traffic?.used??
        traffic?.usage??
        data?.traffic_used??
        data?.used_traffic??
        data?.bytes_used??
        subscription.traffic_used??
        subscription.used_bytes;

      const limit=
        traffic?.limit??
        traffic?.quota??
        data?.traffic_limit??
        data?.traffic_total??
        subscription.traffic_limit??
        subscription.total_bytes;

      const totalBytes=
        traffic?.total_bytes??
        data?.total_bytes??
        subscription.total_bytes;

      if(
        limit!=null&&
        Number(limit)===0
      ){
        return 'Безлимит';
      }

      if(
        totalBytes!=null&&
        Number(totalBytes)===0
      ){
        return 'Безлимит';
      }

      const upload=
        traffic?.upload??
        traffic?.uploaded??
        data?.upload??
        data?.uploaded;

      const download=
        traffic?.download??
        traffic?.downloaded??
        data?.download??
        data?.downloaded;

      if(
        used!=null&&
        limit!=null
      ){
        return `${formatBytes(used)||used} / ${formatBytes(limit)||limit}`;
      }

      if(
        upload!=null||
        download!=null
      ){
        const down=
          download!=null
            ?(formatBytes(download)||download)
            :'—';

        const up=
          upload!=null
            ?(formatBytes(upload)||upload)
            :'—';

        return `↓${down} ↑${up}`;
      }

      if(used!=null){
        if(Number(used)===0){
          return 'Безлимит';
        }

        return formatBytes(used)||String(used);
      }

      return '—';
    }

    function setVpnStatus(
      state,
      expiry='—',
      ping='—',
      traffic='—'
    ){
      $('vpnState').textContent=state;
      $('vpnExpiry').textContent=expiry;
      $('vpnPing').textContent=ping;
      $('vpnTraffic').textContent=traffic;
    }

    function isVpnActive(data){
      const subscription=
        data?.subscription||{};

      return !(
        data?.enabled===false||
        data?.active===false||
        data?.valid===false||
        data?.subscription_active===false||
        subscription.enabled===false||
        subscription.active===false
      );
    }

    function getHappUrl(){
      const candidates=[
        vpnData?.launch_url,
        vpnData?.happ_url,
        vpnData?.subscription_url,
        vpnData?.happ,
        vpnData?.url,
        vpnData?.link,
        vpnData?.subscription?.launch_url,
        vpnData?.subscription?.happ_url,
        vpnData?.subscription?.url
      ];

      return(
        candidates.find(
          value=>
            typeof value==='string'&&
            value.trim()
        )||''
      ).trim();
    }

    function isAllowedHappUrl(value){
      if(
        typeof value!=='string'
      ){
        return false;
      }

      const raw=value.trim();

      if(!raw){
        return false;
      }

      try{
        const parsed=new URL(raw);

        if(
          parsed.protocol==='https:'&&
          parsed.hostname===ALLOWED_HAPP_HOST&&
          parsed.pathname.startsWith('/DisstVpn/')
        ){
          return true;
        }
      }catch{}

      if(
        /^happ:\/\/add\/https:\/\//i.test(
          raw
        )
      ){
        try{
          const nested=
            raw.replace(
              /^happ:\/\/add\//i,
              ''
            );

          const parsed=new URL(
            nested
          );

          return(
            parsed.protocol==='https:'&&
            parsed.hostname===ALLOWED_HAPP_HOST
          );
        }catch{
          return false;
        }
      }

      try{
        const decoded=
          decodeURIComponent(raw);

        if(decoded!==raw){
          return isAllowedHappUrl(
            decoded
          );
        }
      }catch{}

      return false;
    }

    function getSafeHappUrl(){
      const url=getHappUrl();

      return isAllowedHappUrl(url)
        ?url
        :'';
    }

    function updateVpnCheckButton(){
      const token=
        $('vpnToken')
          .value
          .trim();

      $('vpnCheck').disabled=
        !token||
        token.length>VPN_TOKEN_MAX_LENGTH;
    }

    function hideVpnActions(){
      $('vpnActions')
        .classList.add('hidden');
    }

    function renderVpnActions(){
      const safeUrl=
        getSafeHappUrl();

      if(!safeUrl){
        hideVpnActions();
        return;
      }

      $('vpnActions')
        .classList.remove('hidden');
    }

    async function checkVpnToken(){
      const token=
        $('vpnToken')
          .value
          .trim();

      const button=
        $('vpnCheck');

      hideVpnActions();

      if(!token){
        setVpnStatus(
          'Введите токен',
          '—',
          '—',
          '—'
        );
        return;
      }

      if(
        token.length>
        VPN_TOKEN_MAX_LENGTH
      ){
        setVpnStatus(
          'Некорректный токен',
          '—',
          '—',
          '—'
        );
        return;
      }

      button.disabled=true;

      setVpnStatus(
        'Проверка…',
        '—',
        '—',
        '—'
      );

      try{
        let data=null;
        let requestElapsed=null;

        try{
          const result=
            await vpnRequest(
              token
            );

          requestElapsed=
            result.elapsed;

          const response=
            result.response;

          const responseData=
            result.data;

          if(response.status===401){
            clearVpnToken();

            setVpnStatus(
              'Неверный токен',
              '—',
              '—',
              '—'
            );

            return;
          }

          if(response.status===403){
            setVpnStatus(
              'Доступ запрещён',
              '—',
              '—',
              '—'
            );

            return;
          }

          if(response.status===429){
            setVpnStatus(
              'Слишком много запросов',
              '—',
              '—',
              '—'
            );

            return;
          }

          if(
            response.ok&&
            responseData
          ){
            data=responseData;
          }else if(
            response.status===400||
            response.status===404||
            response.status===405
          ){
            data=
              await vpnActionFallback(
                token
              );
          }else if(
            response.status>=500
          ){
            throw new Error(
              'Сервер недоступен'
            );
          }else{
            throw new Error(
              responseData?.message||
              responseData?.error||
              `Ошибка API ${response.status}`
            );
          }
        }catch(firstError){
          if(
            firstError?.name==='AbortError'
          ){
            throw firstError;
          }

          const message=String(
            firstError?.message||''
          );

          if(
            /сервер недоступен/i.test(
              message
            )
          ){
            throw firstError;
          }

          data=
            await vpnActionFallback(
              token
            );
        }

        if(
          !data||
          data.ok===false||
          data.success===false
        ){
          throw new Error(
            data?.message||
            data?.error||
            'Не удалось получить данные'
          );
        }

        vpnData=data;

        const valid=
          data.valid??
          data.active??
          data.is_active??
          data.subscription_active??
          isVpnActive(data);

        if(!valid){
          clearVpnToken();

          setVpnStatus(
            'Неверный токен',
            '—',
            '—',
            '—'
          );

          return;
        }

        const expiry=
          formatExpiry(
            data.expires_at||
            data.expire_at||
            data.expiry||
            data.expires||
            data.subscription?.expires_at||
            data.subscription?.expire
          );

        let ping='—';

        if(data.ping!=null){
          ping=`${data.ping} ms`;
        }else if(data.latency!=null){
          ping=`${data.latency} ms`;
        }else if(data.server_ping!=null){
          ping=`${data.server_ping} ms`;
        }else if(
          Number.isFinite(
            requestElapsed
          )
        ){
          ping=
            `${Math.max(
              1,
              Math.round(
                requestElapsed
              )
            )} ms`;
        }

        const traffic=
          formatTraffic(data);

        if(!isVpnActive(data)){
          setVpnStatus(
            'Отключена',
            expiry,
            ping,
            traffic
          );

          renderVpnActions();

          return;
        }

        saveVpnToken(token);

        setVpnStatus(
          'Активна',
          expiry,
          ping,
          traffic
        );

        renderVpnActions();
      }catch(error){
        const message=
          error?.name==='AbortError'
            ?'Нет ответа'
            :error?.message||'Нет связи';

        setVpnStatus(
          message,
          '—',
          '—',
          '—'
        );
      }finally{
        updateVpnCheckButton();
      }
    }

    function restoreVpnToken(){
      const token=
        getInitialVpnToken();

      if(token){
        $('vpnToken').value=
          token;
      }

      setVpnStatus(
        token
          ?'Не проверен'
          :'Нет токена',
        '—',
        '—',
        '—'
      );

      hideVpnActions();
      updateVpnCheckButton();
    }

    function escapeHtml(value){
      return String(
        value??''
      )
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function getActiveNetwork(){
      return readSessionJson(
        SS_ACTIVE_NETWORK,
        null
      );
    }

    function saveActiveNetwork(network){
      if(!network){
        try{
          sessionStorage.removeItem(
            SS_ACTIVE_NETWORK
          );
        }catch{}

        return;
      }

      writeSessionJson(
        SS_ACTIVE_NETWORK,
        network
      );
    }

    function getLanNetworks(){
      const networks=
        readSessionJson(
          SS_LAN_NETWORKS,
          []
        );

      return Array.isArray(networks)
        ?networks
        :[];
    }

    function saveLanNetworks(networks){
      writeSessionJson(
        SS_LAN_NETWORKS,
        Array.isArray(networks)
          ?networks
          :[]
      );
    }

    function getJoinCodes(){
      return readSessionJson(
        SS_LAN_JOIN_CODES,
        {}
      );
    }

    function saveJoinCodes(codes){
      writeSessionJson(
        SS_LAN_JOIN_CODES,
        codes||{}
      );
    }

    function getJoinCodeForNetwork(
      networkId
    ){
      const codes=
        getJoinCodes();

      return codes[
        String(networkId)
      ]||'';
    }

    function saveJoinCode(
      networkId,
      code
    ){
      if(
        networkId==null||
        !code
      ){
        return;
      }

      const codes=
        getJoinCodes();

      codes[
        String(networkId)
      ]=code;

      saveJoinCodes(codes);
    }

    function removeJoinCode(
      networkId
    ){
      const codes=
        getJoinCodes();

      delete codes[
        String(networkId)
      ];

      saveJoinCodes(codes);
    }

    function getPublicKey(){
      return $('lanPublicKey')
        .value
        .trim();
    }

    function isValidBase64Key(value){
      if(
        !value||
        typeof value!=='string'
      ){
        return false;
      }

      const normalized=
        value.replace(/\s/g,'');

      if(
        !/^[A-Za-z0-9+/]{43}=$/.test(
          normalized
        )
      ){
        return false;
      }

      try{
        return atob(normalized).length===32;
      }catch{
        return false;
      }
    }

    function validateLanName(value){
      const name=
        String(value||'').trim();

      return Boolean(
        name&&
        name.length<=LAN_NAME_MAX_LENGTH
      );
    }

    function validateJoinCode(value){
      const code=
        String(value||'').trim();

      return Boolean(
        code&&
        code.length<=LAN_JOIN_CODE_MAX_LENGTH
      );
    }

    function requirePublicKey(){
      const key=
        getPublicKey();

      if(!key){
        updateLanInfo(
          currentNetwork,
          'Не готова'
        );

        updateLanControls();
        return '';
      }

      if(
        !isValidBase64Key(key)
      ){
        updateLanInfo(
          currentNetwork,
          'Неверный ключ'
        );

        updateLanControls();
        return '';
      }

      return key;
    }

    function updateLanControls(){
      const valid=
        isValidBase64Key(
          getPublicKey()
        );

      $('lanCreateButton')
        .disabled=!valid;

      $('lanJoinButton')
        .disabled=!valid;

    function normalizeNetwork(
      raw,
      fallback={},
      publicKey=''
    ){
      if(!raw){
        return null;
      }

      const ownerKey=
        raw.owner_public_key||
        raw.ownerPublicKey||
        fallback.ownerPublicKey||
        '';

      const id=
        raw.network_id??
        raw.networkId??
        raw.id??
        fallback.id??
        null;

      if(id==null){
        return null;
      }

      let role=
        raw.role||
        fallback.role||
        '';

      if(!role){
        role=
          ownerKey&&
          publicKey&&
          ownerKey===publicKey
            ?'owner'
            :'member';
      }

      return{
        id,
        name:
          raw.name??
          raw.network_name??
          raw.networkName??
          fallback.name??
          'LAN',
        subnet:
          raw.subnet??
          raw.cidr??
          fallback.subnet??
          '—',
        publicKey:
          raw.public_key??
          raw.publicKey??
          fallback.publicKey??
          publicKey,
        ownerPublicKey:
          ownerKey,
        role,
        myIp:
          raw.my_ip??
          raw.myIp??
          raw.ip??
          raw.address??
          raw.me?.ip??
          raw.me?.address??
          fallback.myIp??
          '—',
        joinCode:
          raw.join_code??
          raw.joinCode??
          raw.code??
          fallback.joinCode??
          getJoinCodeForNetwork(id)||
          '',
        config:
          raw.config??
          raw.wireguard_config??
          raw.wireguardConfig??
          fallback.config??
          '',
        devices:
          Array.isArray(raw.devices)
            ?raw.devices
            :(
              Array.isArray(fallback.devices)
                ?fallback.devices
                :[]
            ),
        joined:
          raw.joined??
          fallback.joined??
          true
      };
    }

    function normalizeNetworkCollection(
      data,
      publicKey
    ){
      let rawNetworks=[];

      if(
        Array.isArray(data?.networks)
      ){
        rawNetworks=data.networks;
      }else if(
        Array.isArray(data?.items)
      ){
        rawNetworks=data.items;
      }else if(
        data?.network
      ){
        rawNetworks=[data.network];
      }else if(
        data?.network_id!=null||
        data?.networkId!=null||
        data?.id!=null||
        data?.name||
        data?.config
      ){
        rawNetworks=[data];
      }

      const existing=
        getLanNetworks();

      const result=[];

      for(
        const raw of rawNetworks
      ){
        if(!raw)continue;

        const id=
          raw.network_id??
          raw.networkId??
          raw.id??
          null;

        const fallback=
          existing.find(
            item=>
              id!=null&&
              String(item.id)===
              String(id)
          )||{};

        const network=
          normalizeNetwork(
            raw,
            fallback,
            publicKey
          );

        if(network){
          result.push(network);
        }
      }

      return result;
    }

    function mergeNetworks(networks){
      const existing=
        getLanNetworks();

      const map=new Map();

      for(
        const item of existing
      ){
        if(
          item&&
          item.id!=null
        ){
          map.set(
            String(item.id),
            item
          );
        }
      }

      for(
        const network of networks
      ){
        if(
          !network||
          network.id==null
        ){
          continue;
        }

        const key=
          String(network.id);

        const previous=
          map.get(key)||{};

        map.set(
          key,
          {
            ...previous,
            ...network,
            joinCode:
              network.joinCode||
              previous.joinCode||
              '',
            config:
              network.config||
              previous.config||
              '',
            devices:
              Array.isArray(network.devices)&&
              network.devices.length
                ?network.devices
                :(previous.devices||[])
          }
        );
      }

      const merged=[
        ...map.values()
      ];

      saveLanNetworks(
        merged
      );

      return merged;
    }

    function updateLanInfo(
      network,
      status=''
    ){
      const key=
        getPublicKey();

      let resolvedStatus=
        status;

      if(!key){
        resolvedStatus='Не готова';
      }else if(
        !isValidBase64Key(key)
      ){
        resolvedStatus='Неверный ключ';
      }else if(
        !resolvedStatus
      ){
        resolvedStatus=
          network
            ?'Подключена'
            :'Действительный';
      }

      $('lanInfoSubnet')
        .textContent=
        network?.subnet||'—';

      $('lanInfoIp')
        .textContent=
        network?.myIp||'—';

      $('lanInfoRole')
        .textContent=
        network
          ?(
            network.role==='owner'
              ?'Владелец'
              :'Участник'
          )
          :'—';

      $('lanInfoStatus')
        .textContent=
        resolvedStatus;
    }

    function setLanStatus(
      message,
      network=currentNetwork
    ){
      const key=
        getPublicKey();

      if(!key){
        updateLanInfo(
          network,
          'Не готова'
        );

        return;
      }

      if(
        !isValidBase64Key(key)
      ){
        updateLanInfo(
          network,
          'Неверный ключ'
        );

        return;
      }

      updateLanInfo(
        network,
        message||
        (
          network
            ?'Подключена'
            :'Действительный'
        )
      );
    }

    async function createLan(){
      const name=
        $('lanCreateName')
          .value
          .trim();

      if(
        !validateLanName(name)
      ){
        setLanStatus(
          'Укажите корректное название сети'
        );
        return;
      }

      const publicKey=
        requirePublicKey();

      if(!publicKey)return;

      const button=
        $('lanCreateButton');

      button.disabled=true;

      try{
        const data=
          await api(
            'lan_create',
            {
              public_key:publicKey,
              device_name:DEVICE_NAME,
              name
            }
          );

        const rawNetwork=
          data.network||
          data.result||
          data;

        let network=
          normalizeNetwork(
            rawNetwork,
            {},
            publicKey
          );

        if(
          !network&&
          data.network_id!=null
        ){
          network=
            normalizeNetwork(
              {
                ...data,
                network_id:
                  data.network_id
              },
              {},
              publicKey
            );
        }

        if(!network){
          throw new Error(
            'Сервер не вернул созданную сеть'
          );
        }

        network.role='owner';

        network.joinCode=
          data.join_code||
          data.joinCode||
          data.code||
          network.joinCode||
          '';

        if(network.joinCode){
          saveJoinCode(
            network.id,
            network.joinCode
          );
        }

        const networks=
          mergeNetworks(
            [network]
          );

        renderNetworkList(
          networks
        );

        renderCurrentNetwork(
          network
        );

        setLanStatus(
          'Сеть создана',
          network
        );
      }catch(error){
        setLanStatus(
          error?.name==='AbortError'
            ?'Нет ответа от сервера'
            :(
              error?.message||
              'Не удалось создать сеть'
            )
        );
      }finally{
        updateLanControls();
      }
    }

    async function refreshLanNetwork(){
      const publicKey=
        requirePublicKey();

      if(!publicKey){
        const networks=
          getLanNetworks();

        renderNetworkList(
          networks
        );

        const active=
          getActiveNetwork();

        if(active){
          renderCurrentNetwork(
            active
          );
        }else{
          clearCurrentNetwork();
        }

        return;
      }

      const active=
        getActiveNetwork();

      const payload={
        public_key:publicKey,
        device_name:DEVICE_NAME
      };

      if(
        active&&
        active.role!=='owner'&&
        active.id!=null
      ){
        const joinCode=
          getJoinCodeForNetwork(
            active.id
          )||
          active.joinCode||
          '';

        if(joinCode){
          payload.join_code=
            joinCode;
        }
      }

      try{
        const data=
          await api(
            'lan_status',
            payload
          );

        if(
          data.joined===false&&
          active?.id!=null
        ){
          const remaining=
            getLanNetworks()
              .filter(
                item=>
                  String(item.id)!==
                  String(active.id)
              );

          saveLanNetworks(
            remaining
          );

          removeJoinCode(
            active.id
          );

          clearCurrentNetwork();
          renderNetworkList(
            remaining
          );

          setLanStatus(
            'Сеть больше недоступна'
          );

          return;
        }

        const networks=
          normalizeNetworkCollection(
            data,
            publicKey
          );

        const merged=
          mergeNetworks(
            networks
          );

        renderNetworkList(
          merged
        );

        if(!networks.length){
          if(active){
            renderCurrentNetwork(
              active
            );
          }else{
            clearCurrentNetwork();
          }

          return;
        }

        let selected=null;

        if(active?.id!=null){
          selected=
            networks.find(
              item=>
                String(item.id)===
                String(active.id)
            )||null;
        }

        if(
          !selected&&
          networks.length===1
        ){
          selected=
            networks[0];
        }

        if(selected){
          const oldNetwork=
            getLanNetworks().find(
              item=>
                String(item.id)===
                String(selected.id)
            )||{};

          const finalNetwork=
            normalizeNetwork(
              selected,
              oldNetwork,
              publicKey
            );

          mergeNetworks(
            [finalNetwork]
          );

          renderNetworkList(
            getLanNetworks()
          );

          renderCurrentNetwork(
            finalNetwork
          );
        }
      }catch(error){
        const networks=
          getLanNetworks();

        renderNetworkList(
          networks
        );

        if(active){
          renderCurrentNetwork(
            active
          );
        }else{
          clearCurrentNetwork();
        }

        if(
          error?.name==='AbortError'
        ){
          setLanStatus(
            'Нет ответа от сервера'
          );
        }
      }
    }

    async function refreshSelectedNetwork(){

        currentNetwork.id==null
      ){

        return;
      }

      const publicKey=
        requirePublicKey();

      if(!publicKey)return;

      const payload={
        public_key:publicKey,
        device_name:DEVICE_NAME,
        network_id:currentNetwork.id
      };

      if(
        currentNetwork.role!=='owner'
      ){
        const joinCode=
          getJoinCodeForNetwork(
            currentNetwork.id
          )||
          currentNetwork.joinCode||
          '';

        if(joinCode){
          payload.join_code=
            joinCode;
        }
      }

      try{
        const data=
          await api(
            'lan_status',
            payload
          );

        if(
          data.joined===false
        ){
          const remaining=
            getLanNetworks()
              .filter(
                item=>
                  String(item.id)!==
                  String(currentNetwork.id)
              );

          removeJoinCode(

          );

          setLanStatus(

        const networks=

            publicKey
          );

        const selected=
          networks.find(
            item=>
              String(item.id)===
              String(currentNetwork.id)

        if(!selected)return;

        const oldNetwork=
          getLanNetworks().find(

              String(selected.id)
          )||
          currentNetwork;

        const mergedNetwork=
          normalizeNetwork(
            selected,
            oldNetwork,
            publicKey
          );

        mergeNetworks(
          [mergedNetwork]
        );

        renderNetworkList(
          getLanNetworks()
        );

        renderCurrentNetwork(
          mergedNetwork
        );

        setLanStatus(
          'Обновлено',
          mergedNetwork
        );
      }catch{}
    }

    async function copyText(
      text,
      button
    ){
      if(
        !text||
        text==='—'
      ){
        return;
      }

      try{
        await navigator.clipboard.writeText(
          text
        );
      }catch{
        const area=
          document.createElement(
            'textarea'
          );

        area.value=text;
        area.setAttribute(
          'readonly',
          ''
        );

        area.style.position='fixed';
        area.style.opacity='0';

        document.body.appendChild(
          area
        );

        area.select();

        try{
          document.execCommand(
            'copy'
          );
        }catch{}

        area.remove();
      }

      if(button){
        const old=
          button.textContent;

        button.textContent='Готово';

        setTimeout(
          ()=>{
            button.textContent=old;
          },
          1200
        );
      }
    }

    function sanitizeFilename(value){
      return String(
        value||'limupy'
      )
        .normalize('NFKC')
        .replace(
          /[^\p{L}\p{N}._-]+/gu,
          '_'
        )
        .replace(
          /^_+|_+$/g,
          ''
        )
        .slice(
          0,
          80
        )||
        'limupy';
    }

    function downloadText(
      filename,
      text
    ){
      if(
        typeof text!=='string'||
        !text
      ){
        return;
      }

      const blob=
        new Blob(
          [text],
          {
            type:
              'text/plain;charset=utf-8'
          }
        );

      const url=
        URL.createObjectURL(
          blob
        );

      const anchor=
        document.createElement(
          'a'
        );

      anchor.href=url;
      anchor.download=filename;
      anchor.rel='noopener';

      document.body.appendChild(
        anchor
      );

      anchor.click();
      anchor.remove();

      setTimeout(
        ()=>{
          URL.revokeObjectURL(
            url
          );
        },
        1000
      );
    }

    function setMode(mode){
      currentMode=
        mode==='lan'
          ?'lan'
          :'vpn';

      $('pageVpn')
        .classList.toggle(
          'active',
          currentMode==='vpn'
        );

      $('pageLan')
        .classList.toggle(
          'active',
          currentMode==='lan'
        );

      $('modeButtonText')
        .textContent=
        currentMode==='vpn'
          ?'VPN'
          :'LAN';

      document
        .querySelectorAll(
          '.mode-option'
        )
        .forEach(
          button=>{
            button.classList.toggle(
              'active',
              button.dataset.mode===
              currentMode
            );
          }
        );

      $('modeMenu')
        .classList.remove(
          'open'
        );

      $('modeButton')
        .setAttribute(
          'aria-expanded',
          'false'
        );

      if(
        currentMode==='lan'
      ){
        refreshLanNetwork();
      }
    }

    $('modeButton')
      .addEventListener(
        'click',
        event=>{
          event.stopPropagation();

          const open=
            !$('modeMenu')
              .classList.contains(
                'open'
              );

          $('modeMenu')
            .classList.toggle(
              'open',
              open
            );

          $('modeButton')
            .setAttribute(
              'aria-expanded',
              String(open)
            );
        }
      );

    document.addEventListener(
      'click',
      ()=>{
        $('modeMenu')
          .classList.remove(
            'open'
          );

        $('modeButton')
          .setAttribute(
            'aria-expanded',
            'false'
          );
      }
    );

    document
      .querySelectorAll(
        '.mode-option'
      )
      .forEach(
        button=>{
          button.addEventListener(
            'click',
            event=>{
              event.stopPropagation();

              setMode(
                button.dataset.mode
              );
            }
          );
        }
      );

    document
      .querySelectorAll(
        '.lan-tab'
      )
      .forEach(
        button=>{
          button.addEventListener(
            'click',
            ()=>{
              setLanTab(
                button.dataset.lanTab
              );
            }
          );
        }
      );

    $('lanPublicKey')
      .addEventListener(
        'input',
        ()=>{
          const value=
            $('lanPublicKey')
              .value
              .trim();

          if(!value){
            updateLanInfo(
              currentNetwork,
              'Не готова'
            );
          }else if(
            isValidBase64Key(value)
          ){
            updateLanInfo(
              currentNetwork,
              currentNetwork
                ?'Подключена'
                :'Действительный'
            );
          }else{
            updateLanInfo(
              currentNetwork,
              'Неверный ключ'
            );
          }

          updateLanControls();
        }
      );

    $('lanCreateName')
      .addEventListener(
        'keydown',
        event=>{
          if(
            event.key==='Enter'&&
            !event.shiftKey
          ){
            event.preventDefault();

            if(
              !$('lanCreateButton')
                .disabled
            ){
              createLan();
            }
          }
        }
      );

    $('lanJoinCode')
      .addEventListener(
        'input',
        event=>{
          event.target.value=
            event.target.value
              .trimStart()
              .toUpperCase();
        }
      );

    $('lanJoinCode')
      .addEventListener(
        'keydown',
        event=>{
          if(
            event.key==='Enter'&&
            !event.shiftKey
          ){
            event.preventDefault();

            if(
              !$('lanJoinButton')
                .disabled
            ){
              joinLan();
            }
          }
        }
      );

    $('lanCreateButton')
      .addEventListener(
        'click',
        createLan
      );

    $('lanJoinButton')
      .addEventListener(
        'click',
        joinLan
      );

    $('refreshLan')
      .addEventListener(
        'click',
        refreshSelectedNetwork
      );

    $('leaveLanButton')
      .addEventListener(
        'click',
        leaveLan
      );

    $('deleteLanButton')
      .addEventListener(
        'click',
        deleteLan
      );

    $('copyAccessCode')
      .addEventListener(
        'click',
        ()=>{
          copyText(
            $('accessCode')
              .textContent,
            $('copyAccessCode')
          );
        }
      );

    $('copyConfig')
      .addEventListener(
        'click',
        ()=>{
          copyText(
            currentConfig,
            $('copyConfig')
          );
        }
      );

    $('downloadConfig')
      .addEventListener(
        'click',
        ()=>{
          if(
            !currentConfig||
            !currentNetwork
          ){
            return;
          }

          const safeName=
            sanitizeFilename(
              currentNetwork.name
            );

          downloadText(
            `${safeName}.conf`,
            currentConfig
          );
        }
      );

    $('vpnCheck')
      .addEventListener(
        'click',
        checkVpnToken
      );

    $('vpnToken')
      .addEventListener(
        'input',
        updateVpnCheckButton
      );

    $('vpnToken')
      .addEventListener(
        'keydown',
        event=>{
          if(
            event.key==='Enter'&&
            $('vpnToken')
              .value
              .trim()
          ){
            event.preventDefault();
            checkVpnToken();
          }
        }
      );

    $('happOpen')
      .addEventListener(
        'click',
        ()=>{
          const url=
            getSafeHappUrl();

          if(!url){
            return;
          }

          window.location.assign(
            url
          );
        }
      );

    window.addEventListener(
      'hashchange',
      ()=>{
        const token=
          getTokenFromUrl();

        if(token){
          $('vpnToken').value=
            token;

          saveVpnToken(
            token
          );

          removeTokenFromUrl();
          updateVpnCheckButton();
        }
      }
    );

    window.addEventListener(
      'popstate',
      ()=>{
        const token=
          getInitialVpnToken();

        if(token){
          $('vpnToken').value=
            token;

          updateVpnCheckButton();
        }
      }
    );

    function init(){
      getDeviceId();

      restoreVpnToken();

      const networks=
        getLanNetworks();

      renderNetworkList(
        networks
      );

      const active=
        getActiveNetwork();

      if(active){
        currentNetwork=
          active;

        renderCurrentNetwork(
          active
        );
      }else{
        clearCurrentNetwork();
      }

      updateLanControls();
      hideVpnActions();
    }

    init();
  </script>
</body>
</html>
