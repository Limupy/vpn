<!doctype html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limupy VPN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1115'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<style>
*{
    box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
background:#0f1115;
color:#fff;
}

.container{
width:100%;
max-width:420px;
}

.card{
padding:32px 24px;
background:#191c22;
border:1px solid #252a33;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
width:58px;
height:58px;
margin:0 auto 18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:16px;
background:#fff;
color:#111;
font-size:24px;
font-weight:700;
}

h1{
margin:0;
font-size:26px;
}

.subtitle{
margin:8px 0 24px;
color:#8f97a5;
font-size:14px;
}

.status{
padding:14px;
margin-bottom:18px;
border-radius:12px;
background:#11141a;
color:#dce1e8;
font-size:14px;
line-height:1.5;
}

.info{
margin-bottom:20px;
padding:16px;
border-radius:12px;
background:#20242c;
text-align:left;
}

.info-title{
margin-bottom:6px;
font-size:14px;
font-weight:700;
}

.info-text{
color:#9ca4b2;
font-size:13px;
line-height:1.5;
}

.actions{
display:none;
gap:10px;
}

.button{
flex:1;
display:flex;
align-items:center;
justify-content:center;
min-height:48px;
padding:12px 16px;
border-radius:12px;
text-decoration:none;
font-size:14px;
font-weight:700;
transition:.2s;
}

.button.primary{
background:#fff;
color:#111;
}

.button.secondary{
background:#2a2f38;
color:#fff;
}

.button:hover{
opacity:.9;
}

@media(max-width:400px){
.actions{
flex-direction:column;
}
} </style>

</head>
<body>

<div class="container">
    <div class="card">


    <div class="logo">L</div>

    <h1>Limupy VPN</h1>
    <div class="subtitle">Подключение к VPN-подписке</div>

    <div class="status" id="status">
        Открываем приложение HAPP...
    </div>

    <div class="info">
        <div class="info-title">Клиент HAPP</div>
        <div class="info-text">
            Данная подписка работает через приложение HAPP.
            Для подключения установите HAPP на ваше устройство.
        </div>
    </div>

    <div class="actions" id="actions">
        <a class="button primary" id="open" href="#">
            Открыть HAPP
        </a>

        <a class="button secondary" href="https://happ.info/">
            Скачать HAPP
        </a>
    </div>

</div>


</div>

<script>
const params=new URLSearchParams(location.search);
const key=params.get("key");
const status=document.getElementById("status");
const actions=document.getElementById("actions");
const open=document.getElementById("open");

if(key){
    const url="http://78.17.112.158/open.php?key="+encodeURIComponent(key);

    open.href=url;
    location.href=url;

    setTimeout(()=>{
        status.textContent="Не удалось автоматически открыть HAPP. Выберите действие ниже.";
        actions.style.display="flex";
    },1800);
}else{
    status.textContent="Страница не найдена.";
}
</script>

</body>
</html>
