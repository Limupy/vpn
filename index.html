<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1020">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src https://78.17.112.158; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'"
  >

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236ea8fe'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-size='38' font-weight='800' fill='white'%3EL%3C/text%3E%3C/svg%3E"
  >

  <title>Limupy VPN</title>

  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(20, 27, 48, .9);
      --line: rgba(255,255,255,.08);
      --text: #f4f7fb;
      --muted: #9aa6bd;
      --accent: #6ea8fe;
      --accent-2: #8b7cff;
      --ok: #41d392;
      --bad: #ff657a;
      --warn: #ffc857;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          900px 500px at 10% -10%,
          rgba(110,168,254,.16),
          transparent 55%
        ),
        radial-gradient(
          700px 450px at 100% 0%,
          rgba(139,124,255,.13),
          transparent 50%
        ),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 42px;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );
      color: white;
      font-weight: 800;
      box-shadow:
        0 10px 30px rgba(110,168,254,.24);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .hero {
      padding: 11px 18px;
      border-bottom: 1px solid var(--line);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin: 0;
      min-height: 24px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      min-height: 24px;
      max-width: 80%;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      background: rgba(255,255,255,.06);
      overflow-wrap: anywhere;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.ok {
      color: var(--ok);
      background: rgba(65,211,146,.10);
    }

    .status.bad {
      color: var(--bad);
      background: rgba(255,101,122,.10);
    }

    .status.wait {
      color: #c5cde0;
    }

    .status.warn {
      color: var(--warn);
      background: rgba(255,200,87,.10);
    }

    .rows {
      padding: 6px 22px 14px;
    }

    .row {
      display: grid;
      grid-template-columns:
        minmax(120px, 1fr)
        minmax(0, 1.5fr);
      gap: 18px;
      align-items: center;
      min-height: 62px;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .value {
      text-align: right;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .protocols {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .protocol {
      padding: 6px 9px;
      border-radius: 9px;
      border: 1px solid rgba(110,168,254,.22);
      background: rgba(110,168,254,.10);
      color: #dce9ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 11px 22px 20px;
    }

    .token-wrap {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .token-input {
      appearance: none;
      flex: 1 1 auto;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      outline: none;
      font: inherit;
      font-size: 14px;
    }

    .token-input::placeholder {
      color: var(--muted);
    }

    .token-input:focus {
      border-color: rgba(110,168,254,.55);
      box-shadow: 0 0 0 3px rgba(110,168,254,.10);
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 16px;
      border-radius: 13px;
      text-decoration: none;
      font-weight: 750;
      font-size: 14px;
      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.primary {
      color: #07101f;
      background:
        linear-gradient(
          135deg,
          #86b8ff,
          #8f84ff
        );
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.07);
      border: 1px solid var(--line);
    }

    .footer-note {
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 13px 0;
        min-height: auto;
      }

      .value {
        text-align: left;
      }

      .protocols {
        justify-content: flex-start;
      }

      .header {
        align-items: flex-start;
      }

      .token-wrap {
        flex-direction: column;
      }

      .token-input,
      .token-wrap .btn {
        width: 100%;
      }

      .status-row {
        align-items: flex-start;
      }

      .status {
        max-width: 70%;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="header">
      <div class="brand">
        <div class="logo">L</div>

        <div>
          <h1>Limupy VPN</h1>
          <div class="subtitle">VPN-подписка</div>
        </div>
      </div>
    </div>

    <section class="card" aria-live="polite">
      <div class="hero">
        <div class="status-row">
          <span class="label">Статус</span>

          <span id="status" class="status wait">
            Проверка…
          </span>
        </div>
      </div>

      <div class="rows">
        <div class="row">
          <div class="label">
            Подписка
          </div>

          <div id="subscription" class="value">
            —
          </div>
        </div>

        <div class="row">
          <div class="label">
            Сервер
          </div>

          <div id="server" class="value">
            —
          </div>
        </div>

        <div class="row">
          <div class="label">
            Протоколы
          </div>

          <div id="protocols" class="value">
            —
          </div>
        </div>

        <div class="row">
          <div class="label">
            Трафик
          </div>

          <div id="traffic" class="value">
            —
          </div>
        </div>

        <div class="row">
          <div class="label">
            Срок действия
          </div>

          <div id="expire" class="value">
            —
          </div>
        </div>

        <div class="row">
          <div class="label">
            Задержка
          </div>

          <div id="latency" class="value">
            —
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="token-wrap">
          <input
            id="tokenInput"
            class="token-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Введите токен подписки"
            aria-label="Токен подписки"
          >

          <button
            id="tokenButton"
            class="btn primary"
            type="button"
          >
            Проверить
          </button>
        </div>

        <a
          id="happDownload"
          class="btn secondary"
          href="https://happ.info/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Скачать Happ
        </a>
      </div>
    </section>

    <div class="footer-note">
      Задержка измеряется непосредственно с вашего устройства до API Limupy.
    </div>
  </main>

  <script>
    'use strict';

    const API_URL =
      'https://78.17.112.158/api.php';

    const REQUEST_TIMEOUT_MS = 10000;
    const HASH_CHANGE_DELAY_MS = 150;
    const HISTORY_TOKEN_KEY = '__limupy_subscription_token';

    let activeToken = '';
    let deviceId = '';
    let activeLoadPromise = null;
    let hashTimer = null;

    const $ = id =>
      document.getElementById(id);

    function getUrlToken() {
      const hashParams =
        new URLSearchParams(
          window.location.hash.replace(/^#/, '')
        );

      const searchParams =
        new URLSearchParams(
          window.location.search
        );

      return (
        hashParams.get('key') ||
        searchParams.get('key') ||
        ''
      ).trim();
    }

    function getHistoryToken() {
      const state =
        window.history &&
        window.history.state;

      if (
        !state ||
        typeof state !== 'object'
      ) {
        return '';
      }

      const token =
        state[HISTORY_TOKEN_KEY];

      return typeof token === 'string'
        ? token.trim()
        : '';
    }

    function saveTokenToHistory(token) {
      if (
        !window.history ||
        typeof window.history.replaceState !== 'function'
      ) {
        return false;
      }

      const currentState =
        window.history.state &&
        typeof window.history.state === 'object'
          ? window.history.state
          : {};

      const nextState = {
        ...currentState,
        [HISTORY_TOKEN_KEY]: token
      };

      window.history.replaceState(
        nextState,
        '',
        window.location.pathname
      );

      return true;
    }

    function clearUrlKeepHistoryState() {
      if (
        !window.history ||
        typeof window.history.replaceState !== 'function'
      ) {
        return;
      }

      const currentState =
        window.history.state &&
        typeof window.history.state === 'object'
          ? window.history.state
          : null;

      window.history.replaceState(
        currentState,
        '',
        window.location.pathname
      );
    }

    function adoptToken() {
      const urlToken =
        getUrlToken();

      if (urlToken) {
        activeToken =
          urlToken;

        $('tokenInput').value =
          activeToken;

        saveTokenToHistory(
          activeToken
        );

        return activeToken;
      }

      const historyToken =
        getHistoryToken();

      activeToken =
        historyToken;

      if (activeToken) {
        $('tokenInput').value =
          activeToken;
      }

      clearUrlKeepHistoryState();

      return activeToken;
    }

    function base64Url(bytes) {
      let binary = '';

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    function getDeviceId() {
      if (deviceId) {
        return deviceId;
      }

      const bytes =
        new Uint8Array(32);

      crypto.getRandomValues(bytes);

      deviceId =
        base64Url(bytes);

      return deviceId;
    }

    function setStatus(type, text) {
      const el = $('status');

      el.className =
        'status ' + type;

      el.textContent =
        text;
    }

    function resetFields() {
      $('subscription').textContent = '—';
      $('server').textContent = '—';
      $('protocols').textContent = '—';
      $('traffic').textContent = '—';
      $('expire').textContent = '—';
      $('latency').textContent = '—';
    }

    function bytes(value) {
      const n =
        Number(value || 0);

      if (
        !Number.isFinite(n) ||
        n <= 0
      ) {
        return '0 Б';
      }

      const units = [
        'Б',
        'КБ',
        'МБ',
        'ГБ',
        'ТБ'
      ];

      let x = n;
      let i = 0;

      while (
        x >= 1024 &&
        i < units.length - 1
      ) {
        x /= 1024;
        i++;
      }

      const digits =
        x >= 100
          ? 0
          : x >= 10
            ? 1
            : 2;

      return `${x.toFixed(digits)} ${units[i]}`;
    }

    function trafficText(sub) {
      const total =
        Number(
          sub.total_bytes || 0
        );

      const used =
        Number(
          sub.used_bytes || 0
        );

      if (!total) {
        return `Использовано ${bytes(used)} · без лимита`;
      }

      const remaining =
        Number(
          sub.remaining_bytes ??
          Math.max(
            0,
            total - used
          )
        );

      return (
        `${bytes(used)} из ${bytes(total)} · осталось ${bytes(remaining)}`
      );
    }

    function expireText(timestamp) {
      const ts =
        Number(
          timestamp || 0
        );

      if (!ts) {
        return 'Бессрочно';
      }

      const d =
        new Date(
          ts > 1e12
            ? ts
            : ts * 1000
        );

      if (
        Number.isNaN(
          d.getTime()
        )
      ) {
        return '—';
      }

      return d.toLocaleDateString(
        'ru-RU',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }

    async function postApi() {
      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS
        );

      try {
        return await fetch(
          API_URL,
          {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            credentials: 'omit',
            redirect: 'error',
            signal: controller.signal,
            headers: {
              'Authorization':
                `Bearer ${activeToken}`,
              'Accept':
                'application/json',
              'Content-Type':
                'application/json'
            },
            body: JSON.stringify({
              device_id:
                getDeviceId()
            })
          }
        );
      } finally {
        clearTimeout(
          timeout
        );
      }
    }

    async function fetchSubscription() {
      const started =
        performance.now();

      const res =
        await postApi();

      let data =
        null;

      try {
        data =
          await res.json();
      } catch (_) {
        data =
          null;
      }

      return {
        res,
        data,
        elapsed:
          performance.now() -
          started
      };
    }

    function renderProtocols(protocols) {
      const arr =
        Array.isArray(protocols)
          ? protocols
          : String(
              protocols || ''
            )
              .split(',')
              .map(
                s => s.trim()
              )
              .filter(Boolean);

      const el =
        $('protocols');

      el.textContent =
        '';

      if (
        !arr.length
      ) {
        el.textContent =
          '—';

        return;
      }

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'protocols';

      for (
        const protocol of arr
      ) {
        const item =
          document.createElement(
            'span'
          );

        item.className =
          'protocol';

        item.textContent =
          String(
            protocol
          );

        wrapper.appendChild(
          item
        );
      }

      el.appendChild(
        wrapper
      );
    }

    function isSubscriptionActive(data) {
      const sub =
        data?.subscription ||
        {};

      return !(
        sub.enabled === false ||
        sub.active === false ||
        data?.enabled === false ||
        data?.active === false
      );
    }

    function renderActive(
      data,
      elapsed
    ) {
      const sub =
        data?.subscription ||
        {};

      $('subscription').textContent =
        String(
          data.subscription_name ||
          sub.name ||
          data.name ||
          'VPN-подписка'
        );

      $('server').textContent =
        'Финляндия';

      renderProtocols(
        sub.protocols ||
        data.protocols ||
        []
      );

      $('traffic').textContent =
        trafficText(
          sub
        );

      $('expire').textContent =
        expireText(
          sub.expire
        );

      $('latency').textContent =
        `${Math.max(1, Math.round(elapsed))} мс`;
    }

    async function loadInternal() {
      resetFields();

      setStatus(
        'wait',
        'Проверка…'
      );

      if (
        !activeToken
      ) {
        setStatus(
          'bad',
          'Ссылка не содержит ключ подписки'
        );

        return;
      }

      try {
        const {
          res,
          data,
          elapsed
        } =
          await fetchSubscription();

        if (
          res.status === 429
        ) {
          setStatus(
            'warn',
            res.headers.get(
              'Retry-After'
            )
              ? `Слишком много запросов. Повторите через ${Math.ceil(
                  Number(
                    res.headers.get(
                      'Retry-After'
                    )
                  )
                )} сек.`
              : 'Слишком много запросов. Попробуйте позже.'
          );

          return;
        }

        if (
          !res.ok ||
          !data ||
          data.ok === false
        ) {
          if (
            res.status === 401
          ) {
            setStatus(
              'bad',
              'Подписка недействительна'
            );
          } else if (
            res.status === 403
          ) {
            setStatus(
              'bad',
              'Доступ запрещён'
            );
          } else if (
            res.status === 502 ||
            res.status === 503 ||
            res.status === 504
          ) {
            setStatus(
              'bad',
              'Сервер временно недоступен'
            );
          } else {
            setStatus(
              'bad',
              'Не удалось получить данные подписки'
            );
          }

          return;
        }

        if (
          !isSubscriptionActive(
            data
          )
        ) {
          setStatus(
            'bad',
            'Эта VPN-подписка отключена'
          );

          return;
        }

        setStatus(
          'ok',
          'Активно'
        );

        renderActive(
          data,
          elapsed
        );
      } catch (error) {
        resetFields();

        setStatus(
          'bad',
          error?.name ===
            'AbortError'
            ? 'Сервер не ответил вовремя'
            : 'Нет связи с сервером подписки'
        );
      }
    }

    function load() {
      if (
        activeLoadPromise
      ) {
        return activeLoadPromise;
      }

      activeLoadPromise =
        loadInternal().finally(
          () => {
            activeLoadPromise =
              null;
          }
        );

      return activeLoadPromise;
    }

    function applyToken() {
      const token =
        $('tokenInput').value.trim();

      if (!token) {
        activeToken = '';

        clearUrlKeepHistoryState();

        resetFields();

        setStatus(
          'bad',
          'Введите токен подписки'
        );

        return;
      }

      activeToken =
        token;

      saveTokenToHistory(
        activeToken
      );

      clearUrlKeepHistoryState();

      load();
    }

    $('tokenButton').addEventListener(
      'click',
      () => {
        applyToken();
      }
    );

    $('tokenInput').addEventListener(
      'keydown',
      event => {
        if (
          event.key === 'Enter'
        ) {
          event.preventDefault();
          applyToken();
        }
      }
    );

    window.addEventListener(
      'hashchange',
      () => {
        const urlToken =
          getUrlToken();

        if (
          urlToken
        ) {
          activeToken =
            urlToken;

          $('tokenInput').value =
            activeToken;

          saveTokenToHistory(
            activeToken
          );
        } else {
          activeToken =
            getHistoryToken();

          $('tokenInput').value =
            activeToken;

          clearUrlKeepHistoryState();
        }

        clearTimeout(
          hashTimer
        );

        hashTimer =
          setTimeout(
            () => load(),
            HASH_CHANGE_DELAY_MS
          );
      }
    );

    window.addEventListener(
      'popstate',
      () => {
        activeToken =
          getHistoryToken();

        $('tokenInput').value =
          activeToken;

        clearUrlKeepHistoryState();

        load();
      }
    );

    window.addEventListener(
      'load',
      () => {
        adoptToken();

        $('happDownload').href =
          'https://happ.info/';

        load();
      }
    );
  </script>
</body>
</html>
