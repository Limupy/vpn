<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>Limupy VPN</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #f4f5f7; }
    main { width: min(92vw, 520px); padding: 28px; border: 1px solid #2a2f3a; border-radius: 18px; background: #171a21; box-shadow: 0 18px 50px rgba(0,0,0,.28); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #b8bfcb; line-height: 1.5; }
    .status { margin: 20px 0; padding: 14px 16px; border-radius: 12px; background: #20252f; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; }
    .label { color: #9ea7b5; }
    .value { text-align: right; overflow-wrap: anywhere; }
    button { width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; background: #f4f5f7; color: #15181e; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .error { color: #ff9e9e; }
    .ok { color: #a8e6bd; }
    small { display: block; margin-top: 14px; color: #7f8794; }
  </style>
</head>
<body>
  <main>
    <h1>Limupy VPN</h1>
    <p id="intro">Подключение через защищённый API.</p>

    <div class="status" id="status" aria-live="polite">
      <div class="row"><span class="label">Статус</span><span class="value" id="statusText">Готово</span></div>
      <div class="row"><span class="label">Протоколы</span><span class="value" id="protocols">—</span></div>
      <div class="row"><span class="label">Задержка</span><span class="value" id="latency">—</span></div>
      <div class="row"><span class="label">Срок</span><span class="value" id="expire">—</span></div>
    </div>

    <button id="connect" type="button">Подключить в HAPP</button>
    <small id="note">Ключ берётся только из #key=... и не отправляется в URL API.</small>
  </main>

  <script src="./app.js" defer></script>
  <script>
    'use strict';

    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('connect');
      const statusText = document.getElementById('statusText');
      const protocols = document.getElementById('protocols');
      const latency = document.getElementById('latency');
      const expire = document.getElementById('expire');
      const note = document.getElementById('note');

      let payload = null;

      function setStatus(text, className = '') {
        statusText.textContent = text;
        statusText.className = `value ${className}`.trim();
      }

      function formatExpire(value) {
        if (!value || Number(value) <= 0) return 'не задан';
        const date = new Date(Number(value) * 1000);
        return Number.isNaN(date.getTime()) ? 'неизвестно' : date.toLocaleString('ru-RU');
      }

      async function prepare() {
        button.disabled = true;
        setStatus('Проверка...');
        note.textContent = 'Запрашиваем состояние подписки.';

        try {
          payload = await window.Limupy.collect();

          const list = Array.isArray(payload?.subscription?.protocols)
            ? payload.subscription.protocols
            : [];

          protocols.textContent = list.length ? list.join(', ') : '—';
          latency.textContent = payload?.upstream?.available
            ? `${Number(payload.upstream.rtt_ms).toFixed(1)} мс`
            : 'недоступно';
          expire.textContent = formatExpire(payload?.subscription?.expire);

          setStatus('Готово', 'ok');
          note.textContent = 'Нажми кнопку, чтобы открыть подключение в HAPP.';
          button.disabled = !payload?.launch_url;
        } catch (error) {
          setStatus('Ошибка', 'error');
          note.textContent = error instanceof Error ? error.message : 'Не удалось получить данные подписки.';
          button.disabled = true;
        }
      }

      button.addEventListener('click', () => {
        if (!payload?.launch_url) return;
        window.location.href = payload.launch_url;
      });

      prepare();
    });
  </script>
</body>
</html>
