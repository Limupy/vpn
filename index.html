    <meta charset="UTF-8">

    <meta

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

        }

            margin: 0 0 12px;
        }

        p {
            color: #aeb4c0;
            line-height: 1.5;
        }

        a {
            display: inline-block;

            margin-top: 15px;

            padding: 13px 22px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;
        }
    </style>

<body>

<div class="box">

    <h1>Limupy VPN</h1>

    <p id="status">
        Открываем приложение...
    </p>

    <a
        id="fallback"
        href="https://happ.info/"
        style="display:none;"
    >
        Скачать HAPP
    </a>

</div>


<script>

    /*
     * ==========================================
     * КЛЮЧИ И ИХ ПОДПИСКИ
     * ==========================================
     *
     * Формат:
     *
     * "ключ": "ссылка на подписку"
     *
     * Добавляй сюда новых пользователей.
     */


    const subscriptions = {

        "7fK3mP9xQ2vL":
            "http://78.17.112.158:444/DisstVpn/dplgn7904o4cd4cp",


        "Ab92KlmP7xQ":
            "http://example.com/subscription2",


        "X8nP4sL2Qa":
            "http://example.com/subscription3"

    };


    /*
     * ==========================================
     * ПОЛУЧАЕМ КЛЮЧ ИЗ ?key=
     * ==========================================
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const key =
        params.get("key");


    /*
     * ==========================================
     * ИЩЕМ ПОДПИСКУ
     * ==========================================
     */

    const subscription =
        subscriptions[key];


    const status =
        document.getElementById("status");


    const fallback =
        document.getElementById("fallback");


    /*
     * ==========================================
     * ПРОВЕРЯЕМ КЛЮЧ
     * ==========================================
     */

    if (!subscription) {

        status.textContent =
            "Страница не найдена.";

    } else {

        /*
         * Формируем ссылку HAPP
         */

        const happUrl =
            "happ://add/" + subscription;


        /*
         * Пытаемся открыть HAPP
         */

        window.location.href =
            happUrl;


        /*
         * Если HAPP не установлен,
         * показываем кнопку скачивания
         */

        setTimeout(function () {

            status.textContent =
                "Если приложение не открылось автоматически:";

            fallback.style.display =
                "inline-block";

        }, 1800);

    }

</script>

</body>
