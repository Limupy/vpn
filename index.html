  <script>
    'use strict';

    const API_URL =
      'https://78.17.112.158/api.php';

    const HAPP_DOWNLOAD_URL =
      'https://happ.info/';

    const REQUEST_TIMEOUT_MS =
      10000;

    const DEVICE_STORAGE_KEY =
      'limupy_device_id_v2';

    const HASH_CHANGE_DELAY_MS =
      150;

    const $ =
      id => document.getElementById(id);


    /*
     * Один общий Promise.
     *
     * Даже если hashchange/load сработают почти одновременно,
     * второй POST не пойдёт, пока первый запрос выполняется.
     */
    let activeLoadPromise = null;


    /*
     * Получение ключа из:
     *
     * https://limupy.github.io/vpn/#key=TOKEN
     */
    function getToken() {

      const hash =
        window.location.hash.replace(
          /^#/,
          ''
        );

      const params =
        new URLSearchParams(hash);

      return (
        params.get('key') ||
        ''
      ).trim();
    }


    /*
     * Base64URL.
     */
    function base64Url(bytes) {

      let binary = '';

      for (const byte of bytes) {
        binary += String.fromCharCode(
          byte
        );
      }

      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }


    /*
     * Генерация стабильного ID устройства.
     */
    function makeDeviceId() {

      const bytes =
        new Uint8Array(32);

      crypto.getRandomValues(bytes);

      return base64Url(bytes);
    }


    /*
     * Один device_id на браузер.
     */
    function getDeviceId() {

      let value =
        localStorage.getItem(
          DEVICE_STORAGE_KEY
        );

      if (
        !value ||
        !/^[A-Za-z0-9._~-]{43}$/.test(
          value
        )
      ) {

        value =
          makeDeviceId();

        localStorage.setItem(
          DEVICE_STORAGE_KEY,
          value
        );
      }

      return value;
    }


    /*
     * Статус.
     */
    function setStatus(
      type,
      text
    ) {

      const el =
        $('status');

      el.className =
        'status ' + type;

      el.textContent =
        text;
    }


    /*
     * Сброс полей.
     */
    function resetFields() {

      $('subscription')
        .textContent = '—';

      $('devicesCount')
        .textContent = '—';

      $('protocols')
        .textContent = '—';

      $('traffic')
        .textContent = '—';

      $('expire')
        .textContent = '—';

      $('latency')
        .textContent = '—';

      $('happConnect')
        .hidden = true;

      $('happConnect')
        .removeAttribute(
          'href'
        );
    }


    /*
     * Сообщение ошибки.
     */
    function showError(
      message,
      warning = false
    ) {

      const el =
        $('error');

      el.hidden = false;

      el.className =
        warning
          ? 'error warning'
          : 'error';

      el.textContent =
        message;
    }


    /*
     * Скрыть ошибку.
     */
    function hideError() {

      const el =
        $('error');

      el.hidden = true;
      el.textContent = '';
      el.className = 'error';
    }


    /*
     * Форматирование байтов.
     */
    function bytes(value) {

      const n =
        Number(value || 0);

      if (
        !Number.isFinite(n) ||
        n <= 0
      ) {
        return '0 Б';
      }

      const units = [
        'Б',
        'КБ',
        'МБ',
        'ГБ',
        'ТБ'
      ];

      let x = n;
      let i = 0;

      while (
        x >= 1024 &&
        i < units.length - 1
      ) {

        x /= 1024;
        i++;
      }

      const digits =
        x >= 100
          ? 0
          : x >= 10
            ? 1
            : 2;

      return (
        `${x.toFixed(digits)} ${units[i]}`
      );
    }


    /*
     * Трафик.
     */
    function trafficText(sub) {

      const total =
        Number(
          sub.total_bytes || 0
        );

      const used =
        Number(
          sub.used_bytes || 0
        );

      if (!total) {

        return (
          `Использовано ${bytes(used)} · без лимита`
        );
      }

      const remaining =
        Number(
          sub.remaining_bytes ?? (
            Math.max(
              0,
              total - used
            )
          )
        );

      return (
        `${bytes(used)} из ${bytes(total)} · осталось ${bytes(remaining)}`
      );
    }


    /*
     * Срок.
     */
    function expireText(
      timestamp
    ) {

      const ts =
        Number(
          timestamp || 0
        );

      if (!ts) {
        return 'Бессрочно';
      }

      const d =
        new Date(
          ts > 1e12
            ? ts
            : ts * 1000
        );

      if (
        Number.isNaN(
          d.getTime()
        )
      ) {
        return '—';
      }

      return d.toLocaleDateString(
        'ru-RU',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }


    /*
     * Окончательная проверка Happ URL.
     */
    function isAllowedHappUrl(
      value
    ) {

      try {

        const url =
          new URL(value);

        return (
          url.protocol === 'https:' ||
          url.protocol === 'happ:'
        );

      } catch (_) {

        return false;
      }
    }


    /*
     * POST к API.
     *
     * ВАЖНО:
     * На одну загрузку страницы теперь только ОДИН POST.
     */
    async function postApi(
      token
    ) {

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS
        );

      try {

        return await fetch(
          API_URL,
          {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            credentials: 'omit',
            redirect: 'error',
            signal: controller.signal,

            headers: {
              'Authorization':
                `Bearer ${token}`,

              'Accept':
                'application/json',

              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({
              device_id:
                getDeviceId()
            })
          }
        );

      } finally {

        clearTimeout(timeout);
      }
    }


    /*
     * Получение JSON.
     */
    async function fetchSubscription(
      token
    ) {

      const started =
        performance.now();

      let res;

      try {

        res =
          await postApi(
            token
          );

      } catch (error) {

        error.requestTimeMs =
          performance.now() -
          started;

        throw error;
      }

      let data = null;

      try {

        data =
          await res.json();

      } catch (_) {

        data = null;
      }

      const elapsed =
        performance.now() -
        started;

      return {
        res,
        data,
        elapsed
      };
    }


    /*
     * Простое склонение.
     */
    function pluralizeDevices(
      count
    ) {

      const mod10 =
        count % 10;

      const mod100 =
        count % 100;

      if (
        mod10 === 1 &&
        mod100 !== 11
      ) {
        return 'устройство';
      }

      if (
        mod10 >= 2 &&
        mod10 <= 4 &&
        (
          mod100 < 10 ||
          mod100 >= 20
        )
      ) {
        return 'устройства';
      }

      return 'устройств';
    }


    /*
     * Попытка найти число подключённых устройств
     * во всех поддерживаемых вариантах ответа API.
     */
    function getConnectionCount(
      data
    ) {

      const candidates = [

        data?.vpn_connections_count,

        data?.vpn_connected_devices_count,

        data?.connected_vpn_devices_count,

        data?.vpn_devices_count,

        data?.active_vpn_devices_count,

        data?.connected_devices_count,

        data?.connectedDevicesCount,

        data?.active_devices_count,

        data?.activeDevicesCount,

        data?.connections_count,

        data?.connectionsCount,

        data?.online_count,

        data?.connected_count,

        data?.device_count,

        data?.devices_count,

        data?.connection_count,

        data?.connectionCount,

        data?.subscription?.vpn_connections_count,

        data?.subscription?.vpn_connected_devices_count,

        data?.subscription?.connected_vpn_devices_count,

        data?.subscription?.vpn_devices_count,

        data?.subscription?.active_vpn_devices_count,

        data?.subscription?.connected_devices_count,

        data?.subscription?.active_devices_count,

        data?.subscription?.connections_count,

        data?.subscription?.online_count,

        data?.connection?.vpn_connected_devices_count,

        data?.connection?.connected_devices_count,

        data?.connection?.active_devices_count,

        data?.connection?.connections_count,

        data?.connection?.online_count,

        data?.connection?.count,

        data?.device?.connected_devices_count,

        data?.device?.active_devices_count,

        data?.device?.connections_count,

        data?.device?.online_count,

        data?.device?.connections,

        data?.connections?.count
      ];


      for (
        const value of candidates
      ) {

        if (
          typeof value === 'number' &&
          Number.isFinite(value) &&
          value >= 0
        ) {

          return Math.floor(
            value
          );
        }


        if (
          typeof value === 'string' &&
          value.trim() !== '' &&
          Number.isFinite(
            Number(value)
          )
        ) {

          return Math.max(
            0,
            Math.floor(
              Number(value)
            )
          );
        }
      }


      /*
       * Если API возвращает массивы.
       */
      const arrays = [

        data?.connections,

        data?.devices,

        data?.connected_devices,

        data?.connectedDevices,

        data?.vpn_devices,

        data?.vpnDevices,

        data?.sessions,

        data?.connected_clients,

        data?.connectedClients,

        data?.online_clients,

        data?.onlineClients,

        data?.subscription?.connections,

        data?.subscription?.connected_devices,

        data?.subscription?.sessions,

        data?.connection?.connections,

        data?.connection?.sessions,

        data?.device?.connections,

        data?.device?.sessions
      ];


      for (
        const value of arrays
      ) {

        if (
          Array.isArray(value)
        ) {

          return value.length;
        }
      }


      return null;
    }


    /*
     * Отрисовка подключённых устройств.
     */
    function renderConnections(
      data
    ) {

      const count =
        getConnectionCount(
          data
        );

      const el =
        $('devicesCount');

      el.textContent = '';

      if (
        count === null
      ) {

        const wrapper =
          document.createElement(
            'div'
          );

        wrapper.className =
          'connections';

        const countEl =
          document.createElement(
            'div'
          );

        countEl.className =
          'connections-count';

        countEl.textContent =
          'Данные недоступны';

        wrapper.appendChild(
          countEl
        );

        el.appendChild(
          wrapper
        );

        return;
      }


      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'connections';


      const countEl =
        document.createElement(
          'div'
        );

      countEl.className =
        'connections-count';

      countEl.textContent =
        `${count} ${pluralizeDevices(count)}`;


      wrapper.appendChild(
        countEl
      );


      /*
       * Небольшое пояснение,
       * если одновременно 0.
       */
      if (count === 0) {

        const stateEl =
          document.createElement(
            'div'
          );

        stateEl.className =
          'connections-state';

        stateEl.textContent =
          'сейчас нет активных подключений';

        wrapper.appendChild(
          stateEl
        );
      }


      el.appendChild(
        wrapper
      );
    }


    /*
     * Протоколы.
     */
    function renderProtocols(
      protocols
    ) {

      const arr =
        Array.isArray(protocols)
          ? protocols
          : String(
              protocols || ''
            )
              .split(',')
              .map(
                s => s.trim()
              )
              .filter(
                Boolean
              );

      const el =
        $('protocols');

      el.textContent = '';


      if (!arr.length) {

        el.textContent = '—';

        return;
      }


      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'protocols';


      for (
        const protocol of arr
      ) {

        const item =
          document.createElement(
            'span'
          );

        item.className =
          'protocol';

        item.textContent =
          String(protocol);

        wrapper.appendChild(
          item
        );
      }


      el.appendChild(
        wrapper
      );
    }


    /*
     * Ошибки API.
     */
    function showApiError(
      status,
      data,
      retryAfter
    ) {

      switch (status) {

        case 400:

          showError(
            'API отклонил запрос: проверьте формат данных и идентификатор устройства.'
          );

          break;


        case 401:

          showError(
            'Подписка отключена или ключ больше не действителен.'
          );

          break;


        case 403:

          showError(
            'Запрос отклонён сервером по политике доступа.'
          );

          break;


        case 405:

          showError(
            'Ошибка метода API: сервер ожидает POST-запрос.'
          );

          break;


        case 415:

          showError(
            'API отклонил формат запроса. Ожидается JSON.'
          );

          break;


        case 429: {

          let message =
            'Слишком много запросов.';

          if (
            retryAfter
          ) {

            const seconds =
              Number(
                retryAfter
              );

            if (
              Number.isFinite(
                seconds
              ) &&
              seconds > 0
            ) {

              message +=
                ` Повторите через ${Math.ceil(seconds)} сек.`;
            }
          }

          message +=
            ' Не обновляйте страницу несколько раз подряд.';

          showError(
            message,
            true
          );

          break;
        }


        case 500:

          showError(
            'Внутренняя ошибка API Limupy.'
          );

          break;


        case 502:
        case 503:
        case 504:

          showError(
            `Сервер подписки временно недоступен. HTTP ${status}.`
          );

          break;


        default:

          if (
            data &&
            typeof data.error === 'string'
          ) {

            showError(
              data.error
            );

          } else {

            showError(
              `Не удалось получить данные подписки. HTTP ${status}.`
            );
          }
      }
    }


    /*
     * Проверка активности.
     */
    function isSubscriptionActive(
      data
    ) {

      const sub =
        data?.subscription || {};


      if (
        sub.enabled === false ||
        sub.active === false
      ) {

        return false;
      }


      if (
        data?.enabled === false ||
        data?.active === false
      ) {

        return false;
      }


      return true;
    }


    /*
     * Основной рендер.
     */
    function renderActive(
      data
    ) {

      const sub =
        data.subscription || {};


      const subscriptionName =
        data.subscription_name ||
        sub.name ||
        data.name ||
        'VPN-подписка';


      $('subscription')
        .textContent =
          String(
            subscriptionName
          );


      renderConnections(
        data
      );


      renderProtocols(
        sub.protocols ||
        data.protocols ||
        []
      );


      $('traffic')
        .textContent =
          trafficText(
            sub
          );


      $('expire')
        .textContent =
          expireText(
            sub.expire
          );


      if (
        typeof data.launch_url ===
          'string' &&
        isAllowedHappUrl(
          data.launch_url
        )
      ) {

        $('happConnect')
          .href =
            data.launch_url;

        $('happConnect')
          .hidden = false;
      }
    }


    /*
     * Реальная загрузка.
     */
    async function loadInternal() {

      hideError();
      resetFields();

      setStatus(
        'wait',
        'Проверка…'
      );


      const token =
        getToken();


      if (!token) {

        setStatus(
          'bad',
          'Не активно'
        );

        showError(
          'Ссылка не содержит ключ подписки. Откройте персональную ссылку из Limupy.'
        );

        return;
      }


      try {

        /*
         * ВАЖНО:
         * это единственный API-запрос.
         */
        const {
          res,
          data,
          elapsed
        } =
          await fetchSubscription(
            token
          );


        /*
         * Задержка именно этого запроса.
         */
        if (
          Number.isFinite(
            elapsed
          )
        ) {

          $('latency')
            .textContent =
              `${Math.max(
                1,
                Math.round(
                  elapsed
                )
              )} мс`;
        }


        /*
         * Обрабатываем 429 отдельно.
         */
        if (
          res.status === 429
        ) {

          setStatus(
            'warn',
            'Ограничение'
          );


          showApiError(
            429,
            data,
            res.headers.get(
              'Retry-After'
            )
          );

          return;
        }


        if (
          !res.ok ||
          !data ||
          data.ok === false
        ) {

          setStatus(
            'bad',
            'Не активно'
          );


          showApiError(
            res.status,
            data,
            res.headers.get(
              'Retry-After'
            )
          );

          return;
        }


        if (
          !isSubscriptionActive(
            data
          )
        ) {

          setStatus(
            'bad',
            'Не активно'
          );

          showError(
            'Эта VPN-подписка отключена.'
          );

          return;
        }


        setStatus(
          'ok',
          'Активно'
        );


        renderActive(
          data
        );


      } catch (error) {

        setStatus(
          'bad',
          'Не активно'
        );


        if (
          error &&
          error.name ===
            'AbortError'
        ) {

          showError(
            'Сервер не ответил вовремя. Попробуйте обновить страницу.'
          );

          return;
        }


        showError(
          'Нет связи с сервером подписки. Проверьте соединение и попробуйте обновить страницу.'
        );
      }
    }


    /*
     * Обёртка от двойных/параллельных запусков.
     */
    function load() {

      if (
        activeLoadPromise
      ) {

        return activeLoadPromise;
      }


      activeLoadPromise =
        loadInternal()
          .finally(
            () => {
              activeLoadPromise =
                null;
            }
          );


      return activeLoadPromise;
    }


    /*
     * hashchange с маленькой задержкой,
     * чтобы несколько изменений hash не дали
     * серию POST.
     */
    let hashTimer = null;

    window.addEventListener(
      'hashchange',
      () => {

        clearTimeout(
          hashTimer
        );

        hashTimer =
          setTimeout(
            () => load(),
            HASH_CHANGE_DELAY_MS
          );
      }
    );


    /*
     * Первый запуск.
     */
    window.addEventListener(
      'load',
      () => {

        $('happDownload')
          .href =
            HAPP_DOWNLOAD_URL;

        load();
      }
    );
  </script>

</body>
