<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAPP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #fff;
        }

        .box {
            width: min(90%, 420px);
            padding: 35px 25px;
            text-align: center;
            background: #191c22;
            border-radius: 18px;
        }

        h1 {
            margin: 0 0 15px;
        }

        p {
            color: #aeb4c0;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            border-radius: 10px;
            background: white;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>HAPP</h1>

    <p id="status">
        Проверяем ссылку...
    </p>

    <a
        id="download"
        href="https://happ.info/"
        style="display:none;"
    >
        Скачать HAPP
    </a>

</div>

<script>

    /*
     * ==========================================
     * НАСТРОЙКИ
     * ==========================================
     */

    // Ссылка на твою подписку
    const subscription =
        "http://78.17.112.158:444/DisstVpn/dplgn7904o4cd4cp";

    // Секретный ключ
    const validKey =
        "7fK3mP9xQ2vL";


    /*
     * ==========================================
     * ПОЛУЧАЕМ ?key=
     * ==========================================
     */

    const params =
        new URLSearchParams(window.location.search);

    const key =
        params.get("key");


    /*
     * ==========================================
     * ПРОВЕРЯЕМ КЛЮЧ
     * ==========================================
     */

    if (key !== validKey) {

        document.getElementById("status").textContent =
            "Страница не найдена.";

    } else {

        const happUrl =
            "happ://add/" + subscription;

        const status =
            document.getElementById("status");

        const download =
            document.getElementById("download");


        /*
         * Пытаемся открыть HAPP
         */

        status.textContent =
            "Открываем HAPP...";

        window.location.href =
            happUrl;


        /*
         * Если приложение не открылось
         */

        setTimeout(function () {

            status.textContent =
                "HAPP не установлен или не удалось открыть приложение.";

            download.style.display =
                "inline-block";

        }, 2000);
    }

</script>

</body>
</html>
