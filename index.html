<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAPP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
        }

        .box {
            width: min(90%, 420px);
            padding: 35px 25px;
            text-align: center;
            background: #191c22;
            border-radius: 18px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #aeb4c0;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            border-radius: 10px;
            background: white;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>HAPP</h1>

    <p id="status">
        Открываем приложение...
    </p>

    <a
        id="fallback"
        href="https://happ.info/"
        style="display:none;"
    >
        Скачать HAPP
    </a>
</div>

<script>

    /*
     * ССЫЛКА НА ТВОЮ ПОДПИСКУ
     */
    const subscription =
        "http://78.17.112.158:444/DisstVpn/dplgn7904o4cd4cp";


    /*
     * СЕКРЕТНАЯ ЧАСТЬ ССЫЛКИ
     *
     * Например:
     *
     * /7fK3mP9xQ2vL
     */
    const secretPath =
        "7fK3mP9xQ2vL";


    /*
     * Текущий путь
     */
    let path =
        window.location.pathname;


    /*
     * Убираем начальные и конечные /
     */
    path = path.replace(/^\/+|\/+$/g, "");


    /*
     * Берём последнюю часть URL.
     *
     * Например:
     *
     * happ-link/7fK3mP9xQ2vL
     *
     * превратится в:
     *
     * 7fK3mP9xQ2vL
     */
    const currentToken =
        path.split("/").pop();


    /*
     * Проверяем секрет
     */
    if (currentToken !== secretPath) {

        document.getElementById("status").textContent =
            "Страница не найдена.";

    } else {

        const happUrl =
            "happ://add/" + subscription;

        const status =
            document.getElementById("status");

        const fallback =
            document.getElementById("fallback");


        /*
         * Пытаемся открыть HAPP
         */
        window.location.href = happUrl;


        /*
         * Если HAPP не установлен,
         * показываем кнопку скачивания
         */
        setTimeout(function () {

            status.textContent =
                "Если HAPP не установлен, скачайте его:";

            fallback.style.display =
                "inline-block";

        }, 2000);
    }

</script>

</body>
</html>
