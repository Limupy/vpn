<style>

<body>

<div class="container">
    <div class="card">


    <div class="header">
        <div class="logo">L</div>
        <h1>Limupy VPN</h1>
        <div class="subtitle">VPN-подписка</div>
    </div>

    <div class="status" id="status">
        Открываем приложение HAPP...
    </div>

    <div class="section">
        <div class="section-title">Подписка</div>

        <div class="row">
            <div class="label">Клиент</div>
            <div class="value">HAPP</div>
        </div>

        <div class="row">
            <div class="label">Остаток трафика</div>
            <div class="value">Нет данных</div>
        </div>

        <div class="row">
            <div class="label">Дата окончания</div>
            <div class="value">Нет данных</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Устройства</div>
        <div class="devices" id="devices"></div>
    </div>

    <div class="warning">
        Не передавайте ссылку на этот сайт третьим лицам.
    </div>

    <div class="actions" id="actions">
        <a class="button primary" id="open" href="#">
            Открыть HAPP
        </a>

        <a class="button secondary" href="https://happ.info/">
            Скачать HAPP
        </a>
    </div>

</div>


</div>

<script>
const params=new URLSearchParams(location.search);
const key=params.get("key");
const status=document.getElementById("status");
const actions=document.getElementById("actions");
const open=document.getElementById("open");
const devices=document.getElementById("devices");

function getDeviceName(){
    const ua=navigator.userAgent;

    let browser="Браузер";

    if(/Edg\//i.test(ua)){
        browser="Microsoft Edge";
    }else if(/OPR\//i.test(ua)){
        browser="Opera";
    }else if(/Chrome\//i.test(ua)){
        browser="Google Chrome";
    }else if(/Firefox\//i.test(ua)){
        browser="Firefox";
    }else if(/Safari\//i.test(ua) && !/Chrome\//i.test(ua)){
        browser="Safari";
    }

    let os="Неизвестное устройство";

    if(/Android/i.test(ua)){
        os="Android";
    }else if(/iPhone|iPad|iPod/i.test(ua)){
        os="iOS";
    }else if(/Windows/i.test(ua)){
        os="Windows";
    }else if(/Mac OS X/i.test(ua)){
        os="macOS";
    }else if(/Linux/i.test(ua)){
        os="Linux";
    }

    return os+" · "+browser;
}

function getDeviceId(){
    const idKey="limupy_device_id";

    let id=localStorage.getItem(idKey);

    if(!id){
        id=crypto.randomUUID();
        localStorage.setItem(idKey,id);
    }

    return id;
}

function getStorageKey(){
    return "limupy_devices_"+key;
}

function loadDevices(){
    const storageKey=getStorageKey();
    const currentId=getDeviceId();
    const currentName=getDeviceName();

    let saved=[];

    try{
        saved=JSON.parse(localStorage.getItem(storageKey)||"[]");
    }catch(e){
        saved=[];
    }

    const now=Date.now();
    const existing=saved.find(device=>device.id===currentId);

    if(existing){
        existing.name=currentName;
        existing.lastSeen=now;
    }else{
        saved.push({
            id:currentId,
            name:currentName,
            firstSeen:now,
            lastSeen:now
        });
    }

    saved.sort((a,b)=>b.lastSeen-a.lastSeen);

    if(saved.length>10){
        saved=saved.slice(0,10);
    }

    try{
        localStorage.setItem(storageKey,JSON.stringify(saved));
    }catch(e){}

    devices.innerHTML="";

    if(saved.length===0){
        const empty=document.createElement("div");
        empty.className="empty";
        empty.textContent="Нет сохранённых устройств";
        devices.appendChild(empty);
        return;
    }

    saved.forEach(device=>{
        const item=document.createElement("div");
        item.className="device"+(device.id===currentId ? " current":"");

        const name=document.createElement("div");
        name.className="device-name";
        name.textContent=device.name+(device.id===currentId ? " · текущее":"");

        const time=document.createElement("div");
        time.className="device-time";
        time.textContent="Последний визит: "+new Date(device.lastSeen).toLocaleString("ru-RU");

        item.appendChild(name);
        item.appendChild(time);

        devices.appendChild(item);
    });
}

if(key){
    loadDevices();

    const url="http://78.17.112.158/open.php?key="+encodeURIComponent(key);

    open.href=url;
    location.href=url;

    setTimeout(()=>{
        status.textContent="Не удалось автоматически открыть HAPP. Выберите действие ниже.";
        actions.style.display="flex";
    },1800);
}else{
    status.textContent="Страница не найдена.";
}
</script>

</body>
