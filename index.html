<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Limupy</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:#11141b;
      --panel-2:#151923;
      --line:#262b36;
      --text:#f5f7fb;
      --muted:#8f97a8;
      --accent:#ffffff;
      --danger:#ff6868;
      --success:#67d391;
      --warning:#e2b65f;
      --shadow:0 20px 60px rgba(0,0,0,.28);
      --radius:18px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{
      min-height:100vh;
    }

    button,input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    .app{
      width:min(760px,100%);
      margin:0 auto;
      padding:24px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .brand{
      font-size:22px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .mode-wrap{
      position:relative;
    }

    .mode-button{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:40px;
      padding:0 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      color:var(--text);
      font-weight:700;
    }

    .mode-button svg{
      width:15px;
      height:15px;
      opacity:.7;
    }

    .mode-menu{
      position:absolute;
      right:0;
      top:48px;
      z-index:30;
      width:170px;
      padding:6px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      display:none;
    }

    .mode-menu.open{
      display:block;
    }

    .mode-option{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:11px 12px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      text-align:left;
    }

    .mode-option:hover{
      background:#1b202b;
    }

    .mode-option.active{
      background:#202631;
    }

    .mode-option span:last-child{
      color:var(--muted);
      font-size:12px;
    }

    .page{
      display:none;
    }

    .page.active{
      display:block;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel + .panel{
      margin-top:12px;
    }

    .panel-head{
      padding:18px 18px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panel-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .panel-subtitle{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .panel-body{
      padding:18px;
    }

    .mode-label{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .mode-value{
      font-size:30px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .status-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:16px;
    }

    .status-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:14px;
      min-width:0;
    }

    .status-item-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px;
    }

    .status-item-value{
      font-size:14px;
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .input-row{
      display:flex;
      gap:10px;
      align-items:stretch;
    }

    .input{
      width:100%;
      min-height:46px;
      padding:0 14px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      outline:none;
      color:var(--text);
    }

    .input:focus{
      border-color:#454d5d;
    }

    .input::placeholder{
      color:#687080;
    }

    .btn{
      min-height:46px;
      padding:0 16px;
      border-radius:12px;
      font-weight:750;
      transition:.18s ease;
      white-space:nowrap;
    }

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .btn-primary{
      background:#fff;
      color:#111;
    }

    .btn-primary:hover:not(:disabled){
      background:#e9ebef;
    }

    .btn-secondary{
      background:var(--panel-2);
      border:1px solid var(--line);
      color:var(--text);
    }

    .btn-secondary:hover:not(:disabled){
      background:#1a1f29;
    }

    .btn-danger{
      background:rgba(255,104,104,.08);
      border:1px solid rgba(255,104,104,.22);
      color:var(--danger);
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .actions.one{
      grid-template-columns:1fr;
    }

    .download-btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .download-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--success);
      flex:0 0 auto;
    }

    .notice{
      margin-top:10px;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
      background:var(--panel-2);
    }

    .notice.error{
      color:#ffaaaa;
      border-color:rgba(255,104,104,.22);
      background:rgba(255,104,104,.05);
    }

    .notice.success{
      color:#a3e9ba;
      border-color:rgba(103,211,145,.22);
      background:rgba(103,211,145,.05);
    }

    .lan-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      padding:5px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:13px;
      margin-bottom:12px;
    }

    .lan-tab{
      min-height:38px;
      border-radius:9px;
      background:transparent;
      color:var(--muted);
      font-weight:700;
    }

    .lan-tab.active{
      background:#202631;
      color:var(--text);
    }

    .lan-form{
      display:none;
    }

    .lan-form.active{
      display:block;
    }

    .field{
      margin-bottom:12px;
    }

    .field-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:7px;
      display:block;
    }

    .key-box{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
    }

    .key-text{
      min-width:0;
      flex:1;
      font-size:12px;
      line-height:1.45;
      word-break:break-all;
      color:#d8dce4;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }

    .mini-btn{
      flex:0 0 auto;
      padding:8px 10px;
      border-radius:9px;
      background:#202631;
      color:var(--text);
      border:1px solid var(--line);
      font-size:12px;
      font-weight:700;
    }

    .network-list{
      display:grid;
      gap:8px;
    }

    .network-item{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      text-align:left;
      padding:13px 14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      color:var(--text);
      border-radius:12px;
    }

    .network-item:hover{
      background:#191e27;
    }

    .network-main{
      min-width:0;
    }

    .network-name{
      font-weight:750;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .network-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
    }

    .network-arrow{
      color:var(--muted);
      font-size:18px;
    }

    .current-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .current-item{
      padding:13px;
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
    }

    .current-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px;
    }

    .current-value{
      font-weight:700;
      font-size:14px;
      word-break:break-word;
    }

    .access-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:14px;
    }

    .access-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .access-title{
      font-size:12px;
      color:var(--muted);
    }

    .access-code{
      padding:11px 12px;
      border-radius:10px;
      border:1px dashed #3a4250;
      background:#0f1218;
      color:var(--text);
      font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.04em;
      word-break:break-all;
      user-select:text;
    }

    .config-box{
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel-2);
    }

    .config-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .config-title{
      font-weight:750;
      font-size:13px;
    }

    .config-actions{
      display:flex;
      gap:8px;
    }

    .config-text{
      width:100%;
      min-height:220px;
      resize:vertical;
      padding:12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0c0f14;
      color:#d9dde5;
      font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
      outline:none;
    }

    .section-title{
      font-size:13px;
      font-weight:800;
      margin-bottom:10px;
    }

    .devices{
      display:grid;
      gap:8px;
    }

    .device{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 13px;
      border:1px solid var(--line);
      background:var(--panel-2);
      border-radius:12px;
    }

    .device-main{
      min-width:0;
    }

    .device-name{
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .device-sub{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
    }

    .device-state{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:11px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .device-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#666e7d;
    }

    .device-dot.online{
      background:var(--success);
    }

    .empty{
      padding:18px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:12px;
      font-size:12px;
    }

    .hidden{
      display:none !important;
    }

    .spacer{
      height:12px;
    }

    @media (max-width:620px){
      .app{
        padding:16px 12px 28px;
      }

      .input-row{
        flex-direction:column;
      }

      .status-grid,
      .current-grid{
        grid-template-columns:1fr 1fr;
      }

      .actions{
        grid-template-columns:1fr;
      }

      .config-head{
        align-items:flex-start;
        flex-direction:column;
      }

      .config-actions{
        width:100%;
      }

      .config-actions .mini-btn{
        flex:1;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Limupy</div>

      <div class="mode-wrap">
        <button class="mode-button" id="modeButton" type="button">
          <span id="modeButtonText">VPN</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        <div class="mode-menu" id="modeMenu">
          <button class="mode-option active" data-mode="vpn" type="button">
            <span>VPN</span>
            <span>Сервис</span>
          </button>
          <button class="mode-option" data-mode="lan" type="button">
            <span>LAN</span>
            <span>Сеть</span>
          </button>
        </div>
      </div>
    </div>

    <main>
      <section class="page active" id="pageVpn">
        <div class="panel">
          <div class="panel-body">
            <div class="mode-label">Режим</div>
            <div class="mode-value">VPN</div>

            <div class="status-grid">
              <div class="status-item">
                <div class="status-item-label">Срок</div>
                <div class="status-item-value" id="vpnExpiry">—</div>
              </div>
              <div class="status-item">
                <div class="status-item-label">Пинг</div>
                <div class="status-item-value" id="vpnPing">—</div>
              </div>
              <div class="status-item">
                <div class="status-item-label">Статус</div>
                <div class="status-item-value" id="vpnState">—</div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Токен</div>
              <div class="panel-subtitle">Подписка</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="input-row">
              <input class="input" id="vpnToken" type="text" placeholder="Введите токен" autocomplete="off" spellcheck="false">
              <button class="btn btn-primary" id="vpnCheck" type="button">Проверить</button>
            </div>

            <div class="notice hidden" id="vpnNotice"></div>

            <div class="actions hidden" id="vpnActions">
              <button class="btn btn-primary download-btn" id="happDownload" type="button">
                <span class="download-dot"></span>
                <span>Скачать Happ</span>
              </button>
              <button class="btn btn-secondary" id="happOpen" type="button">
                Открыть в Happ
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="page" id="pageLan">
        <div class="panel">
          <div class="panel-body">
            <div class="lan-tabs">
              <button class="lan-tab active" data-lan-tab="create" type="button">Создать</button>
              <button class="lan-tab" data-lan-tab="join" type="button">Подключить</button>
            </div>

            <div class="lan-form active" id="lanCreateForm">
              <div class="field">
                <label class="field-label" for="lanCreateName">Название</label>
                <input class="input" id="lanCreateName" type="text" maxlength="64" placeholder="Новая сеть">
              </div>

              <div class="actions one">
                <button class="btn btn-primary" id="lanCreateButton" type="button">Создать</button>
                <button class="btn btn-secondary download-btn" id="wireguardInstallCreate" type="button">
                  <span class="download-dot"></span>
                  <span>Скачать WireGuard</span>
                </button>
              </div>

              <div class="notice hidden" id="lanCreateNotice"></div>
            </div>

            <div class="lan-form" id="lanJoinForm">
              <div class="field">
                <label class="field-label" for="lanJoinCode">Код</label>
                <input class="input" id="lanJoinCode" type="text" maxlength="128" placeholder="Код доступа" autocomplete="off" spellcheck="false">
              </div>

              <div class="actions one">
                <button class="btn btn-primary" id="lanJoinButton" type="button">Подключить</button>
                <button class="btn btn-secondary download-btn" id="wireguardInstallJoin" type="button">
                  <span class="download-dot"></span>
                  <span>Скачать WireGuard</span>
                </button>
              </div>

              <div class="notice" id="lanJoinHint">Код нужен только первый раз</div>
              <div class="notice hidden" id="lanJoinNotice"></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Public Key</div>
              <div class="panel-subtitle">Ключ устройства</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="key-box">
              <div class="key-text" id="publicKeyValue">—</div>
              <button class="mini-btn" id="copyPublicKey" type="button">Копировать</button>
            </div>
          </div>
        </div>

        <div class="panel" id="myNetworksPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Мои сети</div>
              <div class="panel-subtitle">Доступ по Public Key</div>
            </div>
            <button class="mini-btn" id="refreshLan" type="button">Обновить</button>
          </div>

          <div class="panel-body">
            <div class="network-list" id="networkList"></div>
          </div>
        </div>

        <div class="panel hidden" id="currentNetworkPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title" id="currentNetworkTitle">Сеть</div>
              <div class="panel-subtitle" id="currentNetworkSubtitle">—</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="current-grid">
              <div class="current-item">
                <div class="current-label">Имя</div>
                <div class="current-value" id="currentName">—</div>
              </div>
              <div class="current-item">
                <div class="current-label">Подсеть</div>
                <div class="current-value" id="currentSubnet">—</div>
              </div>
              <div class="current-item">
                <div class="current-label">Мой IP</div>
                <div class="current-value" id="currentIp">—</div>
              </div>
              <div class="current-item">
                <div class="current-label">Роль</div>
                <div class="current-value" id="currentRole">—</div>
              </div>
            </div>

            <div class="access-box hidden" id="accessBox">
              <div class="access-head">
                <div class="access-title">Код для гостей</div>
                <button class="mini-btn" id="copyAccessCode" type="button">Копировать</button>
              </div>
              <div class="access-code" id="accessCode">—</div>
            </div>

            <div class="config-box">
              <div class="config-head">
                <div class="config-title">WireGuard</div>
                <div class="config-actions">
                  <button class="mini-btn" id="copyConfig" type="button">Копировать</button>
                  <button class="mini-btn" id="downloadConfig" type="button">Скачать</button>
                </div>
              </div>
              <textarea class="config-text" id="configText" readonly spellcheck="false"></textarea>
            </div>
          </div>
        </div>

        <div class="panel hidden" id="networkActionsPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Действия</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="actions one">
              <button class="btn btn-danger" id="leaveLanButton" type="button">Выйти</button>
              <button class="btn btn-danger hidden" id="deleteLanButton" type="button">Удалить LAN</button>
            </div>
            <div class="notice error hidden" id="networkActionNotice"></div>
          </div>
        </div>

        <div class="panel hidden" id="devicesPanel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Устройства</div>
              <div class="panel-subtitle" id="devicesCount">0 устройств</div>
            </div>
          </div>

          <div class="panel-body">
            <div class="devices" id="devicesList"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_URL = 'https://78.17.112.158/api.php';
    const WIREGUARD_INSTALL_URL = 'https://www.wireguard.com/install/';
    const REQUEST_TIMEOUT_MS = 10000;

    const LS_PUBLIC_KEY = 'limupy_public_key';
    const SS_ACTIVE_NETWORK = 'limupy_active_network';
    const SS_LAN_NETWORKS = 'limupy_lan_networks';
    const SS_LAN_JOIN_CODES = 'limupy_lan_join_codes';
    const LS_VPN_TOKEN = 'limupy_vpn_token';

    const $ = id => document.getElementById(id);

    let currentMode = 'vpn';
    let currentLanTab = 'create';
    let currentNetwork = null;
    let currentConfig = '';
    let vpnData = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function readJsonStorage(key, fallback) {
      try {
        const raw = sessionStorage.getItem(key) || localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeSession(key, value) {
      sessionStorage.setItem(key, JSON.stringify(value));
    }

    function readSession(key, fallback) {
      try {
        const raw = sessionStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function setNotice(element, text, type = '') {
      element.textContent = text || '';
      element.className = `notice${type ? ` ${type}` : ''}${text ? '' : ' hidden'}`;
    }

    function setMode(mode) {
      currentMode = mode;

      $('pageVpn').classList.toggle('active', mode === 'vpn');
      $('pageLan').classList.toggle('active', mode === 'lan');
      $('modeButtonText').textContent = mode === 'vpn' ? 'VPN' : 'LAN';

      document.querySelectorAll('.mode-option').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });

      $('modeMenu').classList.remove('open');
    }

    function setLanTab(tab) {
      currentLanTab = tab;

      document.querySelectorAll('.lan-tab').forEach(button => {
        button.classList.toggle('active', button.dataset.lanTab === tab);
      });

      $('lanCreateForm').classList.toggle('active', tab === 'create');
      $('lanJoinForm').classList.toggle('active', tab === 'join');
    }

    async function api(action, payload = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            action,
            ...payload
          }),
          signal: controller.signal
        });

        const text = await response.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(text || 'Ошибка сервера');
        }

        if (!response.ok || data?.success === false || data?.ok === false && data?.error) {
          throw new Error(data?.message || data?.error || 'Ошибка сервера');
        }

        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    function savePublicKey(publicKey) {
      if (!publicKey) return;
      localStorage.setItem(LS_PUBLIC_KEY, publicKey);
      $('publicKeyValue').textContent = publicKey;
    }

    function getPublicKey() {
      return localStorage.getItem(LS_PUBLIC_KEY) || '';
    }

    function getActiveNetwork() {
      return readSession(SS_ACTIVE_NETWORK, null);
    }

    function saveActiveNetwork(network) {
      if (!network) {
        sessionStorage.removeItem(SS_ACTIVE_NETWORK);
        return;
      }

      sessionStorage.setItem(SS_ACTIVE_NETWORK, JSON.stringify(network));
    }

    function getLanNetworks() {
      return readSession(SS_LAN_NETWORKS, []);
    }

    function saveLanNetworks(networks) {
      writeSession(SS_LAN_NETWORKS, networks || []);
    }

    function getJoinCodes() {
      return readSession(SS_LAN_JOIN_CODES, {});
    }

    function saveJoinCodes(codes) {
      writeSession(SS_LAN_JOIN_CODES, codes || {});
    }

    function getJoinCodeForNetwork(networkId) {
      const codes = getJoinCodes();
      return codes[String(networkId)] || '';
    }

    function saveJoinCode(networkId, code) {
      const codes = getJoinCodes();
      codes[String(networkId)] = code;
      saveJoinCodes(codes);
    }

    function removeJoinCode(networkId) {
      const codes = getJoinCodes();
      delete codes[String(networkId)];
      saveJoinCodes(codes);
    }

    function normalizeNetwork(network) {
      if (!network) return null;

      return {
        id: network.id ?? network.network_id ?? network.networkId ?? null,
        name: network.name ?? 'LAN',
        subnet: network.subnet ?? '—',
        publicKey: network.public_key ?? network.owner_public_key ?? network.me?.public_key ?? '',
        role: network.role ?? 'member',
        myIp: network.my_ip ?? network.ip ?? network.me?.ip ?? network.me?.address ?? '—',
        joinCode: network.join_code ?? network.code ?? '',
        config: network.config ?? '',
        devices: Array.isArray(network.devices) ? network.devices : []
      };
    }

    function getNetworksFromStatusResponse(data) {
      if (Array.isArray(data?.networks)) {
        return data.networks.map(normalizeNetwork).filter(Boolean);
      }

      if (data?.network) {
        const network = normalizeNetwork(data.network);
        return network ? [network] : [];
      }

      if (data?.network_id || data?.name || data?.config) {
        const network = normalizeNetwork(data);
        return network ? [network] : [];
      }

      return [];
    }

    function renderNetworkList(networks) {
      const list = $('networkList');

      if (!networks.length) {
        list.innerHTML = '<div class="empty">Нет сетей</div>';
        return;
      }

      list.innerHTML = networks.map(network => {
        const role = network.role === 'owner' ? 'Владелец' : 'Участник';

        return `
          <button class="network-item" type="button" data-network-id="${escapeHtml(network.id)}">
            <div class="network-main">
              <div class="network-name">${escapeHtml(network.name)}</div>
              <div class="network-meta">${escapeHtml(network.subnet)} · ${escapeHtml(role)}</div>
            </div>
            <div class="network-arrow">›</div>
          </button>
        `;
      }).join('');

      list.querySelectorAll('.network-item').forEach(button => {
        button.addEventListener('click', () => {
          const network = networks.find(item => String(item.id) === String(button.dataset.networkId));
          if (network) {
            openNetwork(network);
          }
        });
      });
    }

    function renderCurrentNetwork(network) {
      currentNetwork = network;

      $('currentNetworkPanel').classList.remove('hidden');
      $('networkActionsPanel').classList.remove('hidden');
      $('devicesPanel').classList.remove('hidden');

      $('currentNetworkTitle').textContent = 'Сеть';
      $('currentNetworkSubtitle').textContent = network.name || 'LAN';
      $('currentName').textContent = network.name || '—';
      $('currentSubnet').textContent = network.subnet || '—';
      $('currentIp').textContent = network.myIp || '—';
      $('currentRole').textContent = network.role === 'owner' ? 'Владелец' : 'Участник';

      const isOwner = network.role === 'owner';

      $('accessBox').classList.toggle('hidden', !isOwner || !network.joinCode);
      $('leaveLanButton').classList.toggle('hidden', isOwner);
      $('deleteLanButton').classList.toggle('hidden', !isOwner);

      if (isOwner && network.joinCode) {
        $('accessCode').textContent = network.joinCode;
      } else {
        $('accessCode').textContent = '—';
      }

      currentConfig = network.config || '';
      $('configText').value = currentConfig;

      renderDevices(network.devices || []);
    }

    function renderDevices(devices) {
      const list = $('devicesList');
      $('devicesCount').textContent = `${devices.length} ${devices.length === 1 ? 'устройство' : 'устройств'}`;

      if (!devices.length) {
        list.innerHTML = '<div class="empty">Нет устройств</div>';
        return;
      }

      const myPublicKey = getPublicKey();

      list.innerHTML = devices.map(device => {
        const key = device.public_key ?? device.publicKey ?? '';
        const name = device.name || (key === myPublicKey ? 'Это устройство' : 'Устройство');
        const ip = device.ip ?? device.address ?? '—';
        const online = Boolean(device.online);

        return `
          <div class="device">
            <div class="device-main">
              <div class="device-name">${escapeHtml(name)}</div>
              <div class="device-sub">${escapeHtml(ip)}</div>
            </div>
            <div class="device-state">
              <span class="device-dot ${online ? 'online' : ''}"></span>
              <span>${online ? 'онлайн' : 'офлайн'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function clearCurrentNetwork() {
      currentNetwork = null;
      currentConfig = '';

      $('currentNetworkPanel').classList.add('hidden');
      $('networkActionsPanel').classList.add('hidden');
      $('devicesPanel').classList.add('hidden');
      $('accessBox').classList.add('hidden');

      $('configText').value = '';
      $('networkActionNotice').classList.add('hidden');
    }

    function mergeNetworks(networks) {
      const existing = getLanNetworks();
      const map = new Map();

      existing.forEach(item => {
        if (item?.id != null) {
          map.set(String(item.id), item);
        }
      });

      networks.forEach(item => {
        if (item?.id != null) {
          map.set(String(item.id), {
            ...map.get(String(item.id)),
            ...item
          });
        }
      });

      const merged = [...map.values()];
      saveLanNetworks(merged);
      return merged;
    }

    async function createLan() {
      const name = $('lanCreateName').value.trim();
      const notice = $('lanCreateNotice');

      setNotice(notice, '');

      if (!name) {
        setNotice(notice, 'Введите название', 'error');
        return;
      }

      const publicKey = getPublicKey();

      if (!publicKey) {
        setNotice(notice, 'Нет Public Key', 'error');
        return;
      }

      const button = $('lanCreateButton');
      button.disabled = true;

      try {
        const data = await api('lan_create', {
          public_key: publicKey,
          name
        });

        if (data.public_key) {
          savePublicKey(data.public_key);
        }

        let network = normalizeNetwork(data.network || data);

        if (!network?.id && data.network_id) {
          network = normalizeNetwork({
            ...data,
            network_id: data.network_id
          });
        }

        if (!network) {
          throw new Error('Сеть не создана');
        }

        network.role = 'owner';

        if (data.join_code) {
          network.joinCode = data.join_code;
        }

        mergeNetworks([network]);
        saveActiveNetwork(network);
        renderNetworkList(getLanNetworks());
        renderCurrentNetwork(network);

        setNotice(notice, 'Сеть создана', 'success');
      } catch (error) {
        setNotice(notice, error.message || 'Ошибка сервера', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function joinLan() {
      const joinCode = $('lanJoinCode').value.trim();
      const notice = $('lanJoinNotice');

      setNotice(notice, '');

      if (!joinCode) {
        setNotice(notice, 'Введите код', 'error');
        return;
      }

      const publicKey = getPublicKey();

      if (!publicKey) {
        setNotice(notice, 'Нет Public Key', 'error');
        return;
      }

      const button = $('lanJoinButton');
      button.disabled = true;

      try {
        const data = await api('lan_join', {
          public_key: publicKey,
          join_code: joinCode
        });

        if (data.public_key) {
          savePublicKey(data.public_key);
        }

        let network = normalizeNetwork(data.network || data);

        if (!network) {
          throw new Error('Не удалось подключиться');
        }

        network.role = network.role || 'member';
        saveJoinCode(network.id, joinCode);

        mergeNetworks([network]);
        saveActiveNetwork(network);
        renderNetworkList(getLanNetworks());
        renderCurrentNetwork(network);
        $('lanJoinCode').value = '';

        setNotice(notice, 'Подключено', 'success');
      } catch (error) {
        setNotice(notice, error.message || 'Ошибка сервера', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function refreshLanNetwork() {
      const publicKey = getPublicKey();

      if (!publicKey) {
        $('publicKeyValue').textContent = '—';
        renderNetworkList(getLanNetworks());
        clearCurrentNetwork();
        return;
      }

      $('publicKeyValue').textContent = publicKey;

      try {
        const active = getActiveNetwork();

        const payload = {
          public_key: publicKey
        };

        if (active?.role !== 'owner' && active?.id) {
          const joinCode = getJoinCodeForNetwork(active.id);
          if (joinCode) {
            payload.join_code = joinCode;
          }
        }

        const data = await api('lan_status', payload);
        const networks = getNetworksFromStatusResponse(data);

        const merged = mergeNetworks(networks);
        renderNetworkList(merged);

        if (networks.length) {
          let selected = null;

          if (active?.id) {
            selected = networks.find(item => String(item.id) === String(active.id)) || null;
          }

          if (!selected && networks.length === 1) {
            selected = networks[0];
          }

          if (selected) {
            saveActiveNetwork(selected);
            renderCurrentNetwork(selected);
          }
        } else if (!active) {
          clearCurrentNetwork();
        }
      } catch {
        renderNetworkList(getLanNetworks());

        const active = getActiveNetwork();

        if (active) {
          renderCurrentNetwork(active);
        }
      }
    }

    async function refreshSelectedNetwork() {
      if (!currentNetwork?.id) {
        await refreshLanNetwork();
        return;
      }

      const publicKey = getPublicKey();

      if (!publicKey) {
        return;
      }

      const payload = {
        public_key: publicKey
      };

      if (currentNetwork.role !== 'owner') {
        const joinCode = getJoinCodeForNetwork(currentNetwork.id);
        if (joinCode) {
          payload.join_code = joinCode;
        }
      }

      try {
        const data = await api('lan_status', payload);
        const networks = getNetworksFromStatusResponse(data);

        const selected = networks.find(item => String(item.id) === String(currentNetwork.id));

        if (selected) {
          saveActiveNetwork(selected);
          mergeNetworks([selected]);
          renderCurrentNetwork(selected);
          renderNetworkList(getLanNetworks());
        }
      } catch {}
    }

    async function leaveLan() {
      if (!currentNetwork?.id) return;

      const publicKey = getPublicKey();
      const joinCode = getJoinCodeForNetwork(currentNetwork.id);

      if (!joinCode) {
        setNotice($('networkActionNotice'), 'Нет кода подключения', 'error');
        return;
      }

      const button = $('leaveLanButton');
      button.disabled = true;

      try {
        await api('lan_leave', {
          public_key: publicKey,
          join_code: joinCode
        });

        removeJoinCode(currentNetwork.id);

        const networks = getLanNetworks().filter(item => String(item.id) !== String(currentNetwork.id));
        saveLanNetworks(networks);

        saveActiveNetwork(null);
        clearCurrentNetwork();
        renderNetworkList(networks);

        setNotice($('lanJoinNotice'), 'Вы вышли из сети', 'success');
      } catch (error) {
        setNotice($('networkActionNotice'), error.message || 'Ошибка сервера', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function deleteLan() {
      if (!currentNetwork?.id) return;

      const publicKey = getPublicKey();

      if (!publicKey) {
        setNotice($('networkActionNotice'), 'Нет Public Key', 'error');
        return;
      }

      const button = $('deleteLanButton');
      button.disabled = true;

      try {
        await api('lan_delete', {
          public_key: publicKey,
          network_id: currentNetwork.id
        });

        const networks = getLanNetworks().filter(item => String(item.id) !== String(currentNetwork.id));
        saveLanNetworks(networks);
        removeJoinCode(currentNetwork.id);

        saveActiveNetwork(null);
        clearCurrentNetwork();
        renderNetworkList(networks);

        setNotice($('lanCreateNotice'), 'Сеть удалена', 'success');
      } catch (error) {
        setNotice($('networkActionNotice'), error.message || 'Ошибка сервера', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function copyText(text, button) {
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }

      const old = button.textContent;
      button.textContent = 'Готово';

      setTimeout(() => {
        button.textContent = old;
      }, 1200);
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], {
        type: 'text/plain;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function openWireGuardInstall() {
      window.open(WIREGUARD_INSTALL_URL, '_blank', 'noopener,noreferrer');
    }

    function setVpnStatus(state, expiry = '—', ping = '—') {
      $('vpnState').textContent = state;
      $('vpnExpiry').textContent = expiry;
      $('vpnPing').textContent = ping;
    }

    function formatExpiry(value) {
      if (!value) return '—';

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleDateString('ru-RU');
    }

    function findVpnToken() {
      return localStorage.getItem(LS_VPN_TOKEN) || '';
    }

    async function checkVpnToken() {
      const input = $('vpnToken');
      const notice = $('vpnNotice');
      const button = $('vpnCheck');
      const token = input.value.trim();

      setNotice(notice, '');
      $('vpnActions').classList.add('hidden');

      if (!token) {
        setVpnStatus('Введите токен', '—', '—');
        setNotice(notice, 'Введите токен', 'error');
        return;
      }

      button.disabled = true;
      setVpnStatus('Проверка…', '—', '—');

      try {
        const data = await api('vpn_status', {
          token
        });

        vpnData = data;
        localStorage.setItem(LS_VPN_TOKEN, token);

        const valid = Boolean(
          data.valid ??
          data.active ??
          data.success !== false
        );

        if (!valid) {
          setVpnStatus('Неверный токен', '—', '—');
          setNotice(notice, data.message || 'Неверный токен', 'error');
          return;
        }

        const expiry = formatExpiry(
          data.expires_at ??
          data.expire_at ??
          data.expiry ??
          data.expires
        );

        const ping = data.ping != null ? `${data.ping} ms` : '—';

        setVpnStatus('Активна', expiry, ping);

        setNotice(notice, 'Подписка активна', 'success');

        const happAvailable = Boolean(
          data.happ_url ||
          data.subscription_url ||
          data.url ||
          data.link
        );

        const actions = $('vpnActions');
        actions.classList.remove('hidden');

        if (happAvailable) {
          $('happOpen').classList.remove('hidden');
          $('happDownload').classList.remove('hidden');
          actions.classList.remove('one');
        } else {
          $('happOpen').classList.add('hidden');
          $('happDownload').classList.remove('hidden');
          actions.classList.add('one');
        }
      } catch (error) {
        const message = error.name === 'AbortError'
          ? 'Нет ответа'
          : (error.message || 'Нет связи');

        setVpnStatus(message, '—', '—');
        setNotice(notice, message, 'error');
      } finally {
        button.disabled = false;
      }
    }

    function restoreVpnToken() {
      const token = findVpnToken();

      if (token) {
        $('vpnToken').value = token;
      }

      setVpnStatus('Нет токена', '—', '—');
    }

    function getHappUrl() {
      return vpnData?.happ_url ||
        vpnData?.subscription_url ||
        vpnData?.url ||
        vpnData?.link ||
        '';
    }

    $('modeButton').addEventListener('click', event => {
      event.stopPropagation();
      $('modeMenu').classList.toggle('open');
    });

    document.addEventListener('click', () => {
      $('modeMenu').classList.remove('open');
    });

    document.querySelectorAll('.mode-option').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        setMode(button.dataset.mode);
      });
    });

    document.querySelectorAll('.lan-tab').forEach(button => {
      button.addEventListener('click', () => {
        setLanTab(button.dataset.lanTab);
      });
    });

    $('lanCreateButton').addEventListener('click', createLan);
    $('lanJoinButton').addEventListener('click', joinLan);
    $('refreshLan').addEventListener('click', refreshLanNetwork);
    $('leaveLanButton').addEventListener('click', leaveLan);
    $('deleteLanButton').addEventListener('click', deleteLan);

    $('copyPublicKey').addEventListener('click', () => {
      copyText(getPublicKey(), $('copyPublicKey'));
    });

    $('copyAccessCode').addEventListener('click', () => {
      copyText($('accessCode').textContent, $('copyAccessCode'));
    });

    $('copyConfig').addEventListener('click', () => {
      copyText(currentConfig, $('copyConfig'));
    });

    $('downloadConfig').addEventListener('click', () => {
      if (!currentConfig) return;

      const name = (currentNetwork?.name || 'limupy').replace(/[^\wа-яА-ЯёЁ.-]+/g, '_');
      downloadText(`${name}.conf`, currentConfig);
    });

    $('wireguardInstallCreate').addEventListener('click', openWireGuardInstall);
    $('wireguardInstallJoin').addEventListener('click', openWireGuardInstall);

    $('vpnCheck').addEventListener('click', checkVpnToken);

    $('vpnToken').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        checkVpnToken();
      }
    });

    $('happDownload').addEventListener('click', () => {
      const url = getHappUrl();

      if (!url) return;

      window.open(url, '_blank', 'noopener,noreferrer');
    });

    $('happOpen').addEventListener('click', () => {
      const url = getHappUrl();

      if (!url) return;

      window.location.href = url;
    });

    function ensureLanPublicKey() {
      const existing = getPublicKey();

      if (existing) {
        $('publicKeyValue').textContent = existing;
        return existing;
      }

      const generated = crypto?.randomUUID
        ? crypto.randomUUID().replaceAll('-', '')
        : `${Date.now()}${Math.random().toString(36).slice(2)}`;

      localStorage.setItem(LS_PUBLIC_KEY, generated);
      $('publicKeyValue').textContent = generated;

      return generated;
    }

    async function init() {
      restoreVpnToken();
      ensureLanPublicKey();
      renderNetworkList(getLanNetworks());

      const active = getActiveNetwork();

      if (active) {
        renderCurrentNetwork(active);
      }

      await refreshLanNetwork();
    }

    init();
  </script>
</body>
</html>
