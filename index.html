    <script>
        const SERVER =
            "http://78.17.112.158/open.php";

        const GLOBALPING =
            "https://api.globalping.io/v1/measurements";

        const TARGET =
            "78.17.112.158";

        const params =
            new URLSearchParams(
                location.search
            );

        const key =
            params.get("key");

        const state =
            params.get("state");

        const elements = {
            status:
                document.getElementById(
                    "status"
                ),

            open:
                document.getElementById(
                    "open"
                ),

            subscriptionKey:
                document.getElementById(
                    "subscriptionKey"
                ),

            serverStatus:
                document.getElementById(
                    "serverStatus"
                ),

            serverMain:
                document.querySelector(
                    ".server-main"
                ),

            serverDetails:
                document.getElementById(
                    "serverDetails"
                ),

            remaining:
                document.getElementById(
                    "remaining"
                ),

            used:
                document.getElementById(
                    "used"
                ),

            expire:
                document.getElementById(
                    "expire"
                ),

            devices:
                document.getElementById(
                    "devices"
                )
        };

        let happUrl = "";

        function makeId() {
            if (
                window.crypto &&
                crypto.randomUUID
            ) {
                return crypto.randomUUID();
            }

            return (
                Date.now().toString(36) +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2)
            );
        }

        function getDeviceId() {
            let id =
                localStorage.getItem(
                    "limupy_device_id"
                );

            if (!id) {
                id = makeId();

                try {
                    localStorage.setItem(
                        "limupy_device_id",
                        id
                    );
                } catch (error) {}
            }

            return id;
        }

        function getDeviceName() {
            const ua =
                navigator.userAgent;

            let browser =
                "Браузер";

            let os =
                "Устройство";

            if (/Edg\//i.test(ua)) {
                browser =
                    "Microsoft Edge";
            } else if (/OPR\//i.test(ua)) {
                browser =
                    "Opera";
            } else if (/Chrome\//i.test(ua)) {
                browser =
                    "Google Chrome";
            } else if (/Firefox\//i.test(ua)) {
                browser =
                    "Firefox";
            } else if (
                /Safari\//i.test(ua) &&
                !/Chrome\//i.test(ua)
            ) {
                browser =
                    "Safari";
            }

            if (/Android/i.test(ua)) {
                os = "Android";
            } else if (/iPhone/i.test(ua)) {
                os = "iPhone";
            } else if (/iPad/i.test(ua)) {
                os = "iPad";
            } else if (/Windows/i.test(ua)) {
                os = "Windows";
            } else if (/Mac OS X/i.test(ua)) {
                os = "macOS";
            } else if (/Linux/i.test(ua)) {
                os = "Linux";
            }

            return `${os} · ${browser}`;
        }

        function formatBytes(bytes) {
            if (
                bytes === null ||
                bytes === undefined
            ) {
                return "Нет данных";
            }

            if (bytes === 0) {
                return "0 Б";
            }

            const units = [
                "Б",
                "КБ",
                "МБ",
                "ГБ",
                "ТБ"
            ];

            const index = Math.min(
                Math.floor(
                    Math.log(bytes) /
                    Math.log(1024)
                ),
                units.length - 1
            );

            const value = (
                bytes /
                Math.pow(1024, index)
            ).toFixed(
                index > 2 ? 2 : 1
            );

            return `${value} ${units[index]}`;
        }

        function formatDate(timestamp) {
            if (!timestamp) {
                return "Нет данных";
            }

            return new Date(
                timestamp * 1000
            ).toLocaleString("ru-RU");
        }

        function decodeState(value) {
            const normalized =
                value
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

            const padded =
                normalized +
                "=".repeat(
                    (4 -
                        normalized.length % 4) %
                        4
                );

            const binary =
                atob(padded);

            const bytes =
                new Uint8Array(
                    binary.length
                );

            for (
                let i = 0;
                i < binary.length;
                i++
            ) {
                bytes[i] =
                    binary.charCodeAt(i);
            }

            return JSON.parse(
                new TextDecoder().decode(
                    bytes
                )
            );
        }

        function renderDevices(list) {
            elements.devices.innerHTML = "";

            if (
                !list ||
                !list.length
            ) {
                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "empty";

                empty.textContent =
                    "Пока никто не посещал эту ссылку.";

                elements.devices.appendChild(
                    empty
                );

                return;
            }

            list.forEach(device => {
                const item =
                    document.createElement(
                        "div"
                    );

                const name =
                    document.createElement(
                        "div"
                    );

                const time =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "device" +
                    (
                        device.current
                            ? " current"
                            : ""
                    );

                name.className =
                    "device-name";

                name.textContent =
                    device.name +
                    (
                        device.current
                            ? " · текущее"
                            : ""
                    );

                time.className =
                    "device-time";

                time.textContent =
                    "Последний визит: " +
                    formatDate(
                        device.last_seen
                    ) +
                    "\nПервый визит: " +
                    formatDate(
                        device.first_seen
                    );

                item.appendChild(name);
                item.appendChild(time);

                elements.devices.appendChild(
                    item
                );
            });
        }

        function renderSubscription(info) {
            if (!info) {
                return;
            }

            const unlimited =
                info.total_bytes !== null &&
                Number(info.total_bytes) === 0;

            if (unlimited) {
                elements.remaining.textContent =
                    "Безлимит";
            } else {
                elements.remaining.textContent =
                    formatBytes(
                        info.remaining_bytes
                    );
            }

            elements.used.textContent =
                formatBytes(
                    info.used_bytes
                );

            elements.expire.textContent =
                info.expire
                    ? formatDate(
                        info.expire
                    )
                    : "Нет данных";
        }

        async function createPingMeasurement() {
            const response =
                await fetch(
                    GLOBALPING,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            type: "ping",
                            target: TARGET,
                            locations: [
                                {
                                    continent: "EU"
                                }
                            ],
                            limit: 3,
                            measurementOptions: {
                                packets: 4
                            }
                        })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `Globalping HTTP ${response.status}`
                );
            }

            return response.json();
        }

        async function getPingMeasurement(id) {
            const response =
                await fetch(
                    `${GLOBALPING}/${encodeURIComponent(id)}`,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `Globalping result HTTP ${response.status}`
                );
            }

            return response.json();
        }

        async function waitForPing(id) {
            const started =
                Date.now();

            while (
                Date.now() - started <
                20000
            ) {
                const measurement =
                    await getPingMeasurement(
                        id
                    );

                if (
                    measurement.status ===
                        "finished" ||
                    measurement.status ===
                        "failed"
                ) {
                    return measurement;
                }

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );
            }

            throw new Error(
                "Ping timeout"
            );
        }

        function renderPingResults(
            measurement
        ) {
            const results =
                Array.isArray(
                    measurement.results
                )
                    ? measurement.results
                    : [];

            const finished =
                results.filter(result =>
                    result &&
                    result.result &&
                    result.result.status ===
                        "finished" &&
                    result.result.stats
                );

            const reachable =
                finished.filter(result =>
                    Number(
                        result.result.stats.rcv
                    ) > 0
                );

            if (!reachable.length) {
                elements.serverMain.textContent =
                    "Недоступен";

                elements.serverDetails.textContent =
                    "";

                return;
            }

            const averages =
                reachable
                    .map(result =>
                        Number(
                            result.result.stats.avg
                        )
                    )
                    .filter(value =>
                        Number.isFinite(
                            value
                        )
                    );

            const average =
                averages.length
                    ? averages.reduce(
                        (sum, value) =>
                            sum + value,
                        0
                    ) / averages.length
                    : null;

            elements.serverMain.textContent =
                average !== null
                    ? `Доступен · ${average.toFixed(1)} мс`
                    : "Доступен";

            elements.serverDetails.textContent =
                "";
        }

        async function checkExternalPing() {
            elements.serverMain.textContent =
                "Проверка...";

            elements.serverDetails.textContent =
                "";

            try {
                const created =
                    await createPingMeasurement();

                const measurement =
                    await waitForPing(
                        created.id
                    );

                renderPingResults(
                    measurement
                );
            } catch (error) {
                elements.serverMain.textContent =
                    "Проверка недоступна";

                elements.serverDetails.textContent =
                    "";
            }
        }

        function launchHapp() {
            if (!happUrl) {
                return;
            }

            window.location.assign(
                happUrl
            );
        }

        function collectDevice() {
            const deviceId =
                getDeviceId();

            const deviceName =
                getDeviceName();

            const returnUrl =
                new URL(
                    location.href
                );

            returnUrl.searchParams.delete(
                "state"
            );

            const url =
                SERVER +
                "?mode=collect" +
                "&key=" +
                encodeURIComponent(
                    key
                ) +
                "&device_id=" +
                encodeURIComponent(
                    deviceId
                ) +
                "&device_name=" +
                encodeURIComponent(
                    deviceName
                ) +
                "&return=" +
                encodeURIComponent(
                    returnUrl.toString()
                );

            location.replace(url);
        }

        function initialize() {
            if (!key) {
                elements.status.textContent =
                    "Страница не найдена.";

                return;
            }

            elements.subscriptionKey.textContent =
                key;

            if (!state) {
                elements.status.textContent =
                    "Получаем данные...";

                collectDevice();

                return;
            }

            let data;

            try {
                data =
                    decodeState(state);
            } catch (error) {
                elements.status.textContent =
                    "Не удалось получить данные.";

                return;
            }

            happUrl =
                data.happ_url || "";

            renderDevices(
                data.devices
            );

            renderSubscription(
                data.subscription
            );

            elements.status.textContent =
                "Подписка готова.";

            elements.open.href =
                happUrl || "#";

            elements.open.onclick =
                event => {
                    event.preventDefault();
                    launchHapp();
                };

            const cleanUrl =
                new URL(
                    location.href
                );

            cleanUrl.searchParams.delete(
                "state"
            );

            history.replaceState(
                {},
                "",
                cleanUrl.toString()
            );

            checkExternalPing();

            setTimeout(
                launchHapp,
                500
            );
        }

        initialize();
    </script>
</body>
</html>
