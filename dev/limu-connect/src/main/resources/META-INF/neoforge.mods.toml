[[mods]]
modId="limuconnect"
version="${version}"
displayName="Limu Connect"
authors="Limupy"
description='''Limu Connect adds a one-click in-game connection to the Limu Minecraft server. It retrieves the current e4steam session address over HTTPS and connects through the installed e4steam client.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.limuconnect]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="CLIENT"

[[dependencies.limuconnect]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.limuconnect]]
modId="e4steam"
type="required"
versionRange="[0.3.2,)"
ordering="AFTER"
side="CLIENT"
